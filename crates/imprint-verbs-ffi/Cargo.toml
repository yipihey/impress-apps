[package]
name = "imprint-verbs-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Per-app UniFFI dispatch for imprint service inventory and live app state"

[lib]
crate-type = ["lib"]
name = "imprint_verbs_ffi"

[features]
default = []
native = ["uniffi"]

[dependencies]
async-trait.workspace = true
impress-service-core.workspace = true
impress-store-service.workspace = true
impress-core.workspace = true
imprint-service = { workspace = true, features = ["typst-render"] }
serde.workspace = true
serde_json.workspace = true
uniffi = { workspace = true, optional = true }
impress-workspace-hack.workspace = true

[dev-dependencies]
tempfile = "3"
tokio.workspace = true

[lints]
workspace = true
