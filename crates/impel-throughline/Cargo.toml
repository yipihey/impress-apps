[package]
name = "impel-throughline"
version = "0.1.0"
edition = "2021"
description = "ADR-0016 throughline sync: spawn rule + executor that keep a manuscript's narrative companion in sync via propose-never-commit review checkpoints over the impress-core item graph."

[features]
default = []
# LLM-backed ProposalDrafter. Off by default: the impress-llm provider
# stack (aws-* chain) requires rustc >= 1.94; the kernel pipeline and the
# prompt/parse contract compile and test everywhere without it.
llm = ["dep:impress-llm"]

[dependencies]
impress-core = { workspace = true, features = ["sqlite"] }
impress-llm = { path = "../impress-llm", optional = true }
impel-core = { workspace = true }
# Pure throughline domain logic (anchor map, paragraph extraction, staleness
# derivation) — the canonical implementation per ADR-0016 D4.
imprint-service = { workspace = true }

async-trait = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["serde", "v5"] }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
