[package]
name = "impress-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "impress CLI binary, auto-generated from the store-generic #[impress_service] traits in impress-store-service"

[[bin]]
name = "impress"
path = "src/main.rs"

[dependencies]
# Linking impress-store-service pulls its inventory submissions (the
# collection kernel, triage, store query and docs-import subcommands) into
# the final binary, where this CLI iterates them at startup.
impress-store-service = { workspace = true }
impress-ai-service = { workspace = true }
# The smart-search verbs belong to no app (pure functions over strings), so
# the store-generic binary is their CLI host.
impress-parsers-service = { workspace = true }
impress-smart-search-service = { workspace = true }
# ADR-0028 memory kernel P2: remember/recall/brief/confirm/supersede/forget.
# Belongs to no app either — the shared store is its host, like the others.
impress-memory-service = { workspace = true, features = ["vector-embedder"] }
impress-service-core = { workspace = true, features = ["cli"] }
serde_json = { workspace = true }
