[package]
name = "imprint-service"
description = "Stateless imprint service layer: manuscript persistence (content-addressed), tantivy-backed cross-document search, and stateless HTTP handler implementations. Phase 2D/2E of the impress Rust-core consolidation."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["lib"]

[features]
default = []
# Propagate imprint-core's embedded Tectonic LaTeX engine so `compile_latex`
# actually compiles (off by default — heavy C deps; the method returns a
# "not enabled" DTO otherwise).
tectonic-render = ["imprint-core/tectonic-render"]
# Propagate imprint-core's embedded Typst engine so `compile_typst` actually
# compiles headlessly (off by default — Typst linkage is heavy, see ADR-0018;
# `impress-mcp` turns it on explicitly because the MCP server is exactly where
# a headless compile is wanted). Without it the method returns a structured
# "not enabled" DTO, same shape as `compile_latex`.
typst-render = ["imprint-core/typst-render"]

[dependencies]
# Shared impress workspace crates
impress-store-ffi = { workspace = true }
imprint-core = { workspace = true }
impress-core = { workspace = true, features = ["sqlite"] }

# Phase 3A — codegen pipeline (ImprintTextService).
impress-service-core = { workspace = true }
impress-service-macros = { workspace = true }
async-trait = { workspace = true }
schemars = { workspace = true }

# Async + concurrency
tokio = { workspace = true }

# Hashing for content-addressed storage
sha2 = "0.10"
hex = "0.4"

# Compile-artifact cache location (~/Library/Caches/impress/imprint/compile).
dirs = { workspace = true }

# Full-text search
tantivy = "0.22"

# Serialization / domain types
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5"] }
chrono = { workspace = true }

# Errors
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
proptest = "1.4"
