[package]
name = "implore-service-http"
description = "HTTP-backed implementation of implore-service (routes to the running implore app)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
impress-app-client = { workspace = true }
implore-service = { workspace = true }
# `FigureData`, the validated create-figure data this crate forwards.
implore-core = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }

[dev-dependencies]
# The pass-through tests' one-request mock of implore (`#[tokio::test]`).
tokio = { workspace = true }
