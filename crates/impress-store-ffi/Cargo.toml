[package]
name = "impress-store-ffi"
description = "UniFFI bindings for the shared impress-core SqliteItemStore"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# `lib` only. This target is a dependency of ~17 other workspace crates, and
# listing `staticlib`/`cdylib` here made cargo hand rustc all three crate types
# on EVERY dependent build: a plain `cargo build -p impress-mcp` archived a
# 203 MB libimprint_core.a and linked a dylib without ever naming imprint-core,
# and the debug pair is 1.36 GB + 169 MB, rewritten on every test run. Worse,
# cargo drops the feature hash from the FILENAME for path crates that emit a
# cdylib, so one package-id directory held both the `default,typst-render`
# shape (impress-mcp) and the `native` shape (tests, frameworks) and every
# alternation recompiled the crate and all its dependents.
#
# The staticlib the xcframeworks need is produced on demand by the build
# scripts with `cargo rustc --lib --crate-type staticlib`, which uplifts to the
# same target/<triple>/release/lib<crate>.a path they already read.
crate-type = ["lib"]
name = "impress_store_ffi"

[features]
default = []
native = ["uniffi"]

[dependencies]
impress-core = { workspace = true, features = ["sqlite", "collab"] }
impress-ai.workspace = true
# The ADR-0031 layout tree (L5). `impress-layout` for the verb vocabulary and
# the tree value Swift renders; `impress-layout-service` for the store-backed
# live layout, the undo rings and the D8 verbs — this crate translates, it
# never decides anything about the tree.
impress-layout.workspace = true
impress-layout-service.workspace = true
# The ADR-0033 agent-surface tree (S6). `impress-surface` for the pure
# vocabulary (`Event`, `SurfaceSpec`) this crate's `dispatch`/`spec`/HTTP
# handlers speak directly; `impress-surface-service` for the store-backed
# `SurfaceStore`/`SessionRegistry`/`DefaultExecutor`/`DefaultImpressSurfaceService`
# this crate drives — this crate translates, it never decides anything about
# a surface (same division `impress-layout`/`impress-layout-service` draw
# above).
impress-surface.workspace = true
impress-surface-service.workspace = true
# ADR-0033 D4 says the linked-verb inventory (store + layout + surface +
# surface-demo, `impress-capabilities`'s `kit` feature) should be ONE
# dependency edge, shared with `impress-mcp`/`impress-cli`'s `full`. That is
# NOT what this crate does below, and the reason is a hard blocker, not a
# preference: `impress-capabilities` (regardless of which features are
# selected — Cargo's cyclic-package check walks every OPTIONAL dependency a
# manifest lists, feature-gated or not) reaches `impress-bridges-service` ->
# `imprint-service` -> `impress-app-client` -> `imbib-service-http` ->
# `impress-store-ffi` (THIS crate, a real, unconditional dependency of
# `imprint-service` — see that crate's Cargo.toml), so `impress-store-ffi`
# depending on `impress-capabilities` AT ALL is a cyclic package dependency
# Cargo refuses to resolve, verified with `default-features = false` and
# every feature off. See this work package's report for the fix this needs
# (breaking the `imprint-service -> impress-store-ffi` edge or the
# `impress-capabilities -> impress-bridges-service` one, neither owned by
# this crate) and why it is out of scope here.
#
# Until that is fixed, this crate force-links the FOUR `kit` service crates
# directly — `impress-layout-service` above already has real references
# (`DefaultLayoutService` etc. throughout `layout.rs`) and needs no `use … as
# _;`; `impress-surface-service` below gets one from `surface.rs`'s real use
# of `SurfaceStore`/`SessionRegistry`/`DefaultExecutor`. `impress-store-service`
# and `surface-demo-service` have no real reference anywhere in this crate,
# so `lib.rs` force-links them explicitly — the exact mechanism
# `impress-capabilities` itself uses, one crate short of where D4 wants it.
impress-store-service.workspace = true
surface-demo-service.workspace = true
futures-util = "0.3"
uniffi = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
# No uniffi build-dependency: this crate uses the proc-macro
# `uniffi::setup_scaffolding!()`, so its build.rs only prints
# rerun-if-changed. The build-dep still pulled uniffi_build ->
# uniffi_bindgen (+ askama, goblin, uniffi_udl) into the host graph.

