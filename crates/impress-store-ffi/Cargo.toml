[package]
name = "impress-store-ffi"
description = "UniFFI bindings for the shared impress-core SqliteItemStore"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# `lib` only. This target is a dependency of ~17 other workspace crates, and
# listing `staticlib`/`cdylib` here made cargo hand rustc all three crate types
# on EVERY dependent build: a plain `cargo build -p impress-mcp` archived a
# 203 MB libimprint_core.a and linked a dylib without ever naming imprint-core,
# and the debug pair is 1.36 GB + 169 MB, rewritten on every test run. Worse,
# cargo drops the feature hash from the FILENAME for path crates that emit a
# cdylib, so one package-id directory held both the `default,typst-render`
# shape (impress-mcp) and the `native` shape (tests, frameworks) and every
# alternation recompiled the crate and all its dependents.
#
# The staticlib the xcframeworks need is produced on demand by the build
# scripts with `cargo rustc --lib --crate-type staticlib`, which uplifts to the
# same target/<triple>/release/lib<crate>.a path they already read.
crate-type = ["lib"]
name = "impress_store_ffi"

[features]
default = []
native = ["uniffi"]

[dependencies]
impress-core = { workspace = true, features = ["sqlite", "collab"] }
impress-ai.workspace = true
# The ADR-0031 layout tree (L5). `impress-layout` for the verb vocabulary and
# the tree value Swift renders; `impress-layout-service` for the store-backed
# live layout, the undo rings and the D8 verbs — this crate translates, it
# never decides anything about the tree.
impress-layout.workspace = true
impress-layout-service.workspace = true
# `SharedStore::open` installs its handle as the kit services' process-wide
# store (`install_store`), so a surface's triage verb writes where the panes read.
impress-store-service.workspace = true
# The ADR-0033 agent-surface tree (S6). `impress-surface` for the pure
# vocabulary (`Event`, `SurfaceSpec`) this crate's `dispatch`/`spec`/HTTP
# handlers speak directly; `impress-surface-service` for the store-backed
# `SurfaceStore`/`SessionRegistry`/`DefaultExecutor`/`DefaultImpressSurfaceService`
# this crate drives — this crate translates, it never decides anything about
# a surface (same division `impress-layout`/`impress-layout-service` draw
# above).
impress-surface.workspace = true
impress-surface-service.workspace = true
# ADR-0033 D4 wants the linked-verb inventory (store + layout + surface +
# surface-demo) to be ONE dependency edge, shared with `impress-mcp`/
# `impress-cli`'s `full`. `impress-capabilities` itself is still not that
# edge for this crate — `impress-capabilities` (regardless of which features
# are selected — Cargo's cyclic-package check walks every OPTIONAL
# dependency a manifest lists, feature-gated or not) reaches
# `impress-bridges-service` -> `imprint-service` -> `impress-app-client` ->
# `imbib-service-http` -> `impress-store-ffi` (THIS crate, a real,
# unconditional dependency of `imprint-service` — see that crate's
# Cargo.toml), so `impress-store-ffi` depending on `impress-capabilities` AT
# ALL is a cyclic package dependency Cargo refuses to resolve.
#
# `impress-capabilities-kit` (ADR-0033 D7 / plan S6) is that edge instead: it
# holds exactly the four kit service crates and nothing that reaches back to
# `impress-store-ffi` (verified with `cargo tree -p impress-capabilities-kit
# -e normal | grep -c impress-store-ffi` == 0), so it is not part of the
# cycle above. `impress-layout-service` and `impress-surface-service` stay as
# their own direct dependencies too, above, because `layout.rs`/`surface.rs`
# name their types directly (`DefaultLayoutService`,
# `SurfaceStore`/`SessionRegistry`/`DefaultExecutor`) — this one dependency
# is what replaces the two force-linked-by-hand crates (`impress-store-service`,
# `surface-demo-service`) that had no real reference anywhere in this crate;
# see `lib.rs`'s force-link comment for the mechanism.
impress-capabilities-kit.workspace = true
# `Refusal`, the code-and-message every layout and surface refusal carries
# across the FFI and HTTP (wave 7 T5).
impress-service-core.workspace = true
# The facade `impress-layout-service` and `impress-surface-service` log
# through; `log_bridge.rs` forwards it to the host's Console (wave 7 T5).
log = { version = "0.4", features = ["std"] }
futures-util = "0.3"
uniffi = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
# No uniffi build-dependency: this crate uses the proc-macro
# `uniffi::setup_scaffolding!()`, so its build.rs only prints
# rerun-if-changed. The build-dep still pulled uniffi_build ->
# uniffi_bindgen (+ askama, goblin, uniffi_udl) into the host graph.

