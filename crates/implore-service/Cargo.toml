[package]
name = "implore-service"
description = "#[impress_service] trait for implore (data visualization), exposed to MCP/CLI/impel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
impress-service-core = { workspace = true }
# `create-figure`'s data arguments are validated by the module that renders
# them (`implore_core::figure_artifact::validate_figure_data`), so the verb
# and implore's renderer share one definition of a series, a spec and an SVG.
# Default features only: no uniffi, kuva or typst.
implore-core = { workspace = true }
impress-service-macros = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
async-trait = { workspace = true }
# The proc macro emits `derive(schemars::JsonSchema)`, which needs schemars
# resolvable as a top-level crate at the call site.
schemars = { workspace = true }
