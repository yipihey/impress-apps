[package]
name = "impress-sources"
description = "HTTP source clients (arXiv, Crossref, ADS, OpenAlex, PubMed, Semantic Scholar, WoS) for the impress suite"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
quick-xml = { workspace = true }
regex = { workspace = true }
lazy_static = { workspace = true }
tokio = { workspace = true }

# Reuse the canonical impress Author type when shapes match
impress-domain = { workspace = true }

[dev-dependencies]
mockito = "1"
tokio = { workspace = true }

# One integration-test binary, tests/main.rs, with a `mod` per file in tests/
# (plan-verb-pipeline-and-transport § Build cost, B1); autodiscovery would
# make each of those files a binary of its own again.
[[test]]
name = "main"
path = "tests/main.rs"
