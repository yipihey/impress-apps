[package]
name = "implore-verbs-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Per-app UniFFI target for implore's own verbs (plan-verb-pipeline-and-transport.md § P5, ADR-0034 D2): links implore-service directly, outside the kit boundary impress-store-ffi keeps."

[lib]
crate-type = ["lib"]
name = "implore_verbs_ffi"

[features]
default = []
native = ["uniffi"]

[dependencies]
async-trait = { workspace = true }
base64 = "0.22"
impress-service-core = { workspace = true }
impress-core = { workspace = true }
impress-store-service = { workspace = true }
implore-service = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uniffi = { workspace = true, optional = true }
impress-workspace-hack.workspace = true

[build-dependencies]
# No uniffi build-dependency, same reasoning as impress-store-ffi's: this
# crate uses the proc-macro `uniffi::setup_scaffolding!()`.

[dev-dependencies]
implore-core = { workspace = true, features = ["uniffi"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
tempfile = "3"
# The transport's client (koine) against a stub of `POST /api/verb/<name>`
# that calls `dispatch_verb` (tests/transport_parity.rs), and the pin of its
# port table to Swift's (tests/transport_ports.rs): both need things koine
# does not have, implore's verbs and the Swift sources.
impress-app-transport = { workspace = true }
axum = { workspace = true }

[lints]
workspace = true
