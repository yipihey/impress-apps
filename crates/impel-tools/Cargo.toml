[package]
name = "impel-tools"
description = "The impress suite's tool surface, as impel's agent loop sees it. Projects the #[impress_service] inventory over UniFFI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# `lib` only. This target is a dependency of ~17 other workspace crates, and
# listing `staticlib`/`cdylib` here made cargo hand rustc all three crate types
# on EVERY dependent build: a plain `cargo build -p impress-mcp` archived a
# 203 MB libimprint_core.a and linked a dylib without ever naming imprint-core,
# and the debug pair is 1.36 GB + 169 MB, rewritten on every test run. Worse,
# cargo drops the feature hash from the FILENAME for path crates that emit a
# cdylib, so one package-id directory held both the `default,typst-render`
# shape (impress-mcp) and the `native` shape (tests, frameworks) and every
# alternation recompiled the crate and all its dependents.
#
# The staticlib the xcframeworks need is produced on demand by the build
# scripts with `cargo rustc --lib --crate-type staticlib`, which uplifts to the
# same target/<triple>/release/lib<crate>.a path they already read.
crate-type = ["lib"]
name = "impel_tools"

[dependencies]
# Linking the service crates is what populates the inventory: each
# #[impress_method] submits an McpToolDescriptor at link time. Nothing in this
# crate references their types directly — the dependency IS the mechanism.
imbib-service = { workspace = true }
imbib-service-http = { workspace = true }
imprint-service = { workspace = true }
imprint-service-http = { workspace = true }
# ADR-0028 memory kernel P2: remember/recall/brief/confirm/supersede/forget.
impress-memory-service = { workspace = true }

impress-service-core = { workspace = true }

serde_json = { workspace = true }
thiserror = { workspace = true }
uniffi = { workspace = true }


[features]
# Manual probes are opt-in; see the note on the [[example]] blocks below.
examples = []

[[example]]
name = "live_check"
required-features = ["examples"]
