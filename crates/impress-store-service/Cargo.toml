[package]
name = "impress-store-service"
description = "Store-generic #[impress_service] traits: the collection kernel (ADR-0022 D1) and generic triage verbs (D5), exposed to MCP/CLI/agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
impress-service-core = { workspace = true }
impress-service-macros = { workspace = true }
# The kernel these services front. No imbib-core dependency: these verbs are
# schema-agnostic and run against the shared store directly.
# `schema`: the ADR-0023 watched-folder kernel lives in impress-core (so
# impress-store-ffi can front it too) and its DTOs cross this crate's
# `#[impress_method]` boundary, which needs `schemars::JsonSchema` on them.
impress-core = { workspace = true, features = ["sqlite", "schema", "collab"] }
# The settings registry and its files (ADR-0036 D5); `settings_service.rs`
# adds the verbs, the process-wide instance and the synced store row.
impress-settings = { workspace = true }
impress-surface = { workspace = true }
log = "0.4"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
async-trait = { workspace = true }
schemars = { workspace = true }
dirs = { workspace = true }
# `v5` (not just `v4`): the docs importer derives every manuscript id
# deterministically from its source path, mirroring impart's DeterministicID.
uuid = { workspace = true, features = ["v5"] }
chrono = { workspace = true }
base64 = "0.22"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
# The inline job runner (ADR-0034 D6): a long-running verb spawns its work on
# the shared service runtime and answers with the handle.
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
