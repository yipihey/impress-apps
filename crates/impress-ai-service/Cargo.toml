[package]
name = "impress-ai-service"
description = "Generated MCP, CLI, and impel service surface for the provenance-first Impress AI core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The verbs are koine-ai's (`service`); this crate submits the suite's store
# and workspace as their deployment.
koine-ai = { workspace = true, features = ["service"] }
impress-ai = { workspace = true, features = ["schema"] }
impress-service-core.workspace = true
impress-store-service.workspace = true
impress-workspace-hack.workspace = true

[lints]
workspace = true
