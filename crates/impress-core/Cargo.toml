[package]
name = "impress-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Unified item protocol for the impress research suite"
autotests = false

[features]
default = []
sqlite = ["rusqlite", "impress-item/sqlite", "dep:koine-store"]
# Derive `schemars::JsonSchema` on the kernel DTOs that cross an
# `#[impress_service]` boundary. Enabled by `impress-store-service`.
schema = ["schemars", "impress-pane-query/schema", "impress-item/schema"]
# Automerge-backed manuscript bodies (ADR-0027). Needs the store: the
# document cache hangs off SqliteItemStore and chunks are store items.
collab = ["dep:automerge", "dep:base64", "sqlite"]
# The store spy (ADR-0036 D1, `effects_spy`): `SqliteItemStore` reports the
# kinds each call reads and writes to a process-wide recorder so
# `crates/impress-capabilities/tests/effects.rs` can verify every verb's
# declared effects against what it did. Tests only; nothing ships with it.
effects-spy = ["sqlite"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# The item protocol (K1b). This crate keeps SqliteItemStore and re-exports it.
impress-item = { workspace = true }
# The triage kernel only: no verbs, no package manager (KM2).
koine-triage = { workspace = true }
# The collection kernel only (KM4): no verbs, no package manager.
koine-collections = { workspace = true }
# The task state machine, the task store port and jobs (koine
# docs/plan-koine-ai-tasks.md Q-D1, Q-D4); `runtime` stays off here.
koine-tasks = { workspace = true }
# The ADR-0031 D2 pane-query algebra's types (ADR-0033 D7): this crate keeps
# only the built-in kind manifest, which is domain data.
impress-pane-query = { workspace = true }
# The compiler and invalidation rules (docs/plan-koine-host.md H-D2),
# re-exported by `pane_query` so no caller changes.
impress-pane-query-compile = { workspace = true }
# The pipeline's task-local call context (ADR-0036 D2, hook H-P2-2): the
# store stamps `batch_id = call_id` on every operation written under a verb
# call. A pure kit crate with no reach back here, like impress-pane-query.
impress-service-core = { workspace = true }
# `SqliteItemStore` tells koine's process registry it may be a call-scoped
# store (`pipeline::invoke_on(store, …)`), so the layout and surface verbs
# reach a scratch SQLite store the way the store-generic ones do.
koine-store = { workspace = true, optional = true }
# `v5`: the watched-folder kernel derives every folder and file id
# deterministically from its path, so a re-add finds the same row.
uuid = { workspace = true, features = ["v4", "v5", "serde"] }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
rusqlite = { workspace = true, optional = true }
sha2 = "0.10"
# Only for the `schema` feature: the DTOs the `#[impress_service]` verbs take
# and return need `JsonSchema` derives, and those DTOs live with the kernel
# that produces them. OFF by default so `impress-store-ffi` — which calls the
# same kernel from Swift and has no use for JSON schemas — does not link it.
schemars = { workspace = true, optional = true }
automerge = { version = "0.11", optional = true }
base64 = { version = "0.22", optional = true }
impress-workspace-hack.workspace = true

[dev-dependencies]
proptest = "1.4"
# The koine store conformance suite, run against SqliteItemStore in
# tests/store_conformance.rs: this store is the suite's oracle, and the suite
# is how the memory and directory backends stay the same store.
koine-store-conformance = { workspace = true }
tempfile = "3.10"

# One integration-test binary, tests/main.rs, with a `mod` per file in tests/
# (plan-verb-pipeline-and-transport § Build cost, B1); autodiscovery would
# make each of those files a binary of its own again.
[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
