[package]
name = "impress-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Unified item protocol for the impress research suite"

[features]
default = []
sqlite = ["rusqlite"]
# Derive `schemars::JsonSchema` on the kernel DTOs that cross an
# `#[impress_service]` boundary. Enabled by `impress-store-service`.
schema = ["schemars", "impress-pane-query/schema"]
# Automerge-backed manuscript bodies (ADR-0027). Needs the store: the
# document cache hangs off SqliteItemStore and chunks are store items.
collab = ["dep:automerge", "dep:base64", "sqlite"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# The ADR-0031 D2 pane-query algebra's types (ADR-0033 D7): this crate keeps
# only the compiler that lowers a query onto its store and the built-in kind
# manifest, which is domain data.
impress-pane-query = { workspace = true }
# `v5`: the watched-folder kernel derives every folder and file id
# deterministically from its path, so a re-add finds the same row.
uuid = { workspace = true, features = ["v4", "v5", "serde"] }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
rusqlite = { workspace = true, optional = true }
sha2 = "0.10"
# Only for the `schema` feature: the DTOs the `#[impress_service]` verbs take
# and return need `JsonSchema` derives, and those DTOs live with the kernel
# that produces them. OFF by default so `impress-store-ffi` — which calls the
# same kernel from Swift and has no use for JSON schemas — does not link it.
schemars = { workspace = true, optional = true }
automerge = { version = "0.11", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
proptest = "1.4"
tempfile = "3.10"
