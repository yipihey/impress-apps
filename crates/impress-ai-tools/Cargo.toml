[package]
name = "impress-ai-tools"
description = "Grouped local-model projection of the generated Impress service inventory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
impress-ai.workspace = true
impress-ai-service.workspace = true
impress-service-core.workspace = true
serde_json.workspace = true
tokio.workspace = true

# The one linked inventory (ADR-0033 D4; plan-verb-pipeline PL-6): the
# service crates this adapter exposes arrive through `impress-capabilities`'
# features rather than a second force-link list here. Not `full`: no
# impel/memory (the daemon hosting this IS impel) and no `kit` — the layout
# and surface verbs are the app's, not a local model's; the store-generic
# services still come through `impress-store-service` directly.
impress-capabilities = { workspace = true, default-features = false, features = [
    "imbib", "impart", "implore", "imprint", "ai", "bridges", "parsers", "smart-search", "vw",
] }
impress-store-service.workspace = true
# The probes that install each app's HTTP backend (`probe_reachability`).
imbib-service-http.workspace = true
impart-service-http.workspace = true
implore-service-http.workspace = true
imprint-service-http.workspace = true
