[package]
name = "impel-taskd"
version = "0.1.0"
edition = "2021"
description = "impel task scheduler daemon: watches the shared impress-core store for new bibliography entries, spawns enrichment task DAGs, and executes them (ADR-0005 §6, ADR-0015)."

[[bin]]
name = "impel-taskd"
path = "src/main.rs"

[dependencies]
impress-core = { workspace = true, features = ["sqlite"] }
impel-core = { workspace = true }
impel-enrichment = { path = "../impel-enrichment" }
impel-throughline = { path = "../impel-throughline", features = ["llm"] }
impel-memory = { workspace = true }
impress-ai = { workspace = true, features = ["executor"] }
impress-ai-tools = { workspace = true }
imprint-service = { workspace = true }
impress-sources = { workspace = true }
imbib-core = { workspace = true, features = ["native"] }
# W2: the fourth spawn rule — `impress-workflow-service::WorkflowEngine`
# plans and runs due workflows; `impress-capabilities` (`full`, the same set
# `impress-mcp`/`impress-cli` link) is what makes `VerbDescriptor::find`
# resolve a workflow step's verb name for `pipeline::invoke_on` to run.
impress-workflow = { workspace = true }
impress-workflow-service = { workspace = true }
impress-capabilities = { workspace = true, features = ["full"] }
impress-service-core = { workspace = true }

tokio = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
impress-workspace-hack.workspace = true

[features]
# Manual probes are opt-in; see the note on the [[example]] blocks below.
examples = []

[[example]]
name = "insert_entry"
required-features = ["examples"]

[[example]]
name = "review_cli"
required-features = ["examples"]
