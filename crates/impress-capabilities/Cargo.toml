[package]
name = "impress-capabilities"
description = "the one place the #[impress_service] inventory is linked (ADR-0033 D4)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde_json = { workspace = true }
impress-service-core = { workspace = true }

# One optional dependency per service crate, gated by the feature of the same
# name below. `imprint` links both `imprint-service` (the trait) and
# `imprint-selftest` (`run-selftest`, ADR-0033 plan S2) — they are one
# capability family, not two.
imbib-service = { workspace = true, optional = true }
impart-service = { workspace = true, optional = true }
impel-service = { workspace = true, optional = true }
implore-service = { workspace = true, optional = true }
imprint-service = { workspace = true, optional = true }
imprint-selftest = { workspace = true, optional = true }
impress-ai-service = { workspace = true, optional = true }
impress-bridges-service = { workspace = true, optional = true }
impress-memory-service = { workspace = true, optional = true }
impress-parsers-service = { workspace = true, optional = true }
impress-smart-search-service = { workspace = true, optional = true }
impress-scenario-service = { workspace = true, optional = true }
# Not a workspace.dependencies entry (see crates/impress-mcp/Cargo.toml,
# which reaches it the same way): the vw-* family has never had a workspace
# alias, only relative `path` dependencies from each consumer.
vw-impress-adapter = { path = "../vw-impress-adapter", optional = true }
# The ADR-0033 D7 standalone-kit slice (store, layout, surface,
# surface-demo) lives in its own crate so `impress-store-ffi` can depend on
# exactly that list without depending on `impress-capabilities` itself,
# which would be a package cycle (see `impress-capabilities-kit`'s and
# `impress-store-ffi`'s module docs). The four kit service crates are NOT
# direct dependencies here any more — they arrive transitively through
# `impress-capabilities-kit`, so each is named in exactly one place.
impress-capabilities-kit = { workspace = true, optional = true }
impress-workspace-hack.workspace = true

# The pipeline tests (tests/pipeline.rs, policy.rs, pipeline_bench.rs) run
# linked verbs on a scratch store through `Pipeline::invoke_on` and read
# the rows back.
# The effects test (`tests/effects.rs`, ADR-0036 D1) runs every headless
# verb's examples and the three Tier A catalogues under impress-core's store
# spy. Dev-dependencies only: this crate's library still depends on the
# service crates alone.
[dev-dependencies]
impress-core = { workspace = true, features = ["sqlite", "effects-spy"] }
impress-store-service = { workspace = true }
impress-layout-service = { workspace = true }
impress-surface-service = { workspace = true }
imprint-selftest = { workspace = true }
tokio = { workspace = true }
# R2: the keymap coverage test's verb-existence half lives here so
# `impress-keymap` itself keeps no inventory dependency (RG-6).
impress-keymap = { workspace = true }

[features]
# `full`: every capability the suite has, for the two binaries that must see
# everything (impress-mcp, impress-cli). `kit`: the ADR-0033 D7 standalone
# cut — store, layout and the two surface crates, via `impress-capabilities-kit`
# — none of the five per-app domain cores (imbib/imprint/implore/impart/impel),
# which already ship as their own xcframeworks and must not be linked a
# second time here.
default = ["full"]
full = [
    "imbib",
    "impart",
    "impel",
    "implore",
    "imprint",
    "ai",
    "bridges",
    "memory",
    "parsers",
    "smart-search",
    "vw",
    "kit",
    "scenario",
]
kit = ["dep:impress-capabilities-kit"]
scenario = ["dep:impress-scenario-service"]

imbib = ["dep:imbib-service"]
impart = ["dep:impart-service"]
impel = ["dep:impel-service"]
implore = ["dep:implore-service"]
imprint = ["dep:imprint-service", "dep:imprint-selftest"]
ai = ["dep:impress-ai-service"]
bridges = ["dep:impress-bridges-service"]
memory = ["dep:impress-memory-service"]
parsers = ["dep:impress-parsers-service"]
smart-search = ["dep:impress-smart-search-service"]
vw = ["dep:vw-impress-adapter"]
