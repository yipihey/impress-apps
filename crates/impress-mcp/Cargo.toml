[package]
name = "impress-mcp"
description = "MCP server for local impress suite search (publications, chunks, embeddings)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "impress-mcp"
path = "src/main.rs"

[dependencies]
imbib-core = { workspace = true, features = ["native", "embeddings"] }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
dirs = { workspace = true }
# Inlining rasterised pages as MCP image content.
base64 = "0.22"
# Phase 3B: pull in the service crates so their inventory-registered
# McpToolDescriptor entries link into this binary at compile time, plus
# the core runtime helpers for descriptor iteration and `block_on`.
impress-service-core = { workspace = true }
impress-ai-service = { workspace = true }
imbib-service = { workspace = true }
imbib-service-http = { workspace = true }
# `typst-render` is OFF by default in imprint-service (Typst linkage is heavy —
# ADR-0018) and turned on HERE, because this binary is exactly where a headless
# compile is wanted: `imprint-manuscript-service_compile-typst` is not
# app-gated, so with imprint closed this is the only thing in the suite that can
# turn a manuscript into a PDF. It is NOT free: the release binary goes
# 46,990,144 → 98,709,072 bytes (45 → 94 MiB, +110%). That cost is exactly why
# the feature is not in imprint-service's `default` — every other consumer
# (imprint-service-http, imprint-selftest, the app FFI, which already links
# Typst its own way) would pay it for a capability only this binary uses.
imprint-service = { workspace = true, features = ["typst-render"] }
imprint-service-http = { workspace = true }
# implore + impart services (TypeScript MCP retirement, phase 3).
implore-service = { workspace = true }
implore-service-http = { workspace = true }
impart-service = { workspace = true }
impart-service-http = { workspace = true }
# Cross-app orchestration (the imbib/imprint/implore/impart seams).
impress-bridges-service = { workspace = true }
# Store-generic services (ADR-0022 WP G1): the collection kernel + generic
# triage verbs. Never app-gated — they open the shared store directly.
impress-store-service = { workspace = true }
# VW expert-system semantic service and Impress repository adapter.
vw-impress-adapter = { path = "../vw-impress-adapter" }
# Pulls the ImprintSelftestService inventory (run-selftest MCP tool).
imprint-selftest = { workspace = true }
# Pulls the SmartSearchService inventory (pure, app-independent — no
# reachability gate entry needed).
impress-parsers-service = { workspace = true }
impress-smart-search-service = { workspace = true }
