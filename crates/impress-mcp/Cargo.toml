[package]
name = "impress-mcp"
description = "MCP server for local impress suite search (publications, chunks, embeddings)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "impress-mcp"
path = "src/main.rs"

[dependencies]
imbib-core = { workspace = true, features = ["native", "embeddings"] }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
dirs = { workspace = true }
# Phase 3B: pull in the service crates so their inventory-registered
# McpToolDescriptor entries link into this binary at compile time, plus
# the core runtime helpers for descriptor iteration and `block_on`.
impress-service-core = { workspace = true }
imbib-service = { workspace = true }
imbib-service-http = { workspace = true }
imprint-service = { workspace = true }
imprint-service-http = { workspace = true }
# implore + impart services (TypeScript MCP retirement, phase 3).
implore-service = { workspace = true }
implore-service-http = { workspace = true }
impart-service = { workspace = true }
impart-service-http = { workspace = true }
# Pulls the ImprintSelftestService inventory (run-selftest MCP tool).
imprint-selftest = { workspace = true }
