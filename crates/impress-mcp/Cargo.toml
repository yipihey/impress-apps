[package]
name = "impress-mcp"
description = "MCP server for local impress suite search (publications, chunks, embeddings)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "impress-mcp"
path = "src/main.rs"

[dependencies]
imbib-core = { workspace = true, features = ["native"] }
# The embedding stack behind the three hand-written semantic-search tools.
# All three features named explicitly even though imbib-core's `native` also
# turns on store+index: `tools.rs` names `EmbeddingStore` and `ChunkIndex`
# itself, and a dependency you use is one you declare, not one you inherit by
# feature unification. `embedder` (fastembed) is enabled HERE and nowhere else
# in the suite — this binary is the only thing that generates embeddings
# rather than reading them.
impress-embeddings = { workspace = true, features = ["store", "index", "embedder"] }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
dirs = { workspace = true }
# Inlining rasterised pages as MCP image content.
base64 = "0.22"
# ADR-0033 D4 / plan S2: the ONE place the `#[impress_service]` inventory is
# linked, `features = ["full"]` so this binary keeps linking every capability
# the old per-crate force-link list did (imbib, impart, impel, implore,
# imprint(+selftest), ai, bridges, layout, memory, parsers, smart-search,
# store, vw, surface, surface-demo). `inventory_bridge.rs` delegates to it.
impress-capabilities = { workspace = true, features = ["full"] }
# The core runtime helpers (descriptor iteration used to live here too, but
# `server.rs` and `surface.rs` still reach `McpToolDescriptor`/`runtime`
# directly outside the inventory-tool path, e.g. for the ADR-0024 grouped
# surface rendering, so this stays a direct dependency).
impress-service-core = { workspace = true }
imbib-service-http = { workspace = true }
# `typst-render` is OFF by default in imprint-service (Typst linkage is heavy —
# ADR-0018) and turned on HERE, because this binary is exactly where a headless
# compile is wanted: `imprint-manuscript-service_compile-typst` is not
# app-gated, so with imprint closed this is the only thing in the suite that can
# turn a manuscript into a PDF. It is NOT free: the release binary goes
# 46,990,144 → 98,709,072 bytes (45 → 94 MiB, +110%). That cost is exactly why
# the feature is not in imprint-service's `default` — every other consumer
# (imprint-service-http, imprint-selftest, the app FFI, which already links
# Typst its own way) would pay it for a capability only this binary uses. Kept
# as a direct dependency (impress-capabilities also pulls imprint-service, at
# its default features) so cargo's feature unification turns typst-render on
# for the one compiled copy of the crate that ends up in this binary.
imprint-service = { workspace = true, features = ["typst-render"] }
imprint-service-http = { workspace = true }
# implore + impart HTTP reachability probes (TypeScript MCP retirement,
# phase 3) — `main.rs` calls `maybe_install_http_backend()` on these
# directly; the non-HTTP `*-service` crates that register the inventory now
# come from `impress-capabilities`.
implore-service-http = { workspace = true }
impart-service-http = { workspace = true }
# Store-generic services (ADR-0022 WP G1): `server.rs` calls
# `impress_store_service::{store_instance, store_path, set_store_path, …}`
# directly, beyond what the inventory alone needs — kept as a direct
# dependency for that, same reasoning as `imprint-service` above.
impress-store-service = { workspace = true }
# Pulls the MemoryService inventory (ADR-0028 memory kernel P2 — remember/
# recall/brief/confirm/supersede/forget, FTS tier + the opt-in vector tier).
# `server.rs` also constructs `DefaultMemoryService` directly. Kept as a
# direct dependency (impress-capabilities' `memory` feature deliberately does
# NOT enable `vector-embedder` — it would drag ort-sys/ONNX into every `full`
# build, including ones that never wanted it) so this binary keeps the vector
# tier it always had.
impress-memory-service = { workspace = true, features = ["vector-embedder"] }

[dev-dependencies]
# Isolated EmbeddingStore fixtures for the rebuild_chunk_index model-gating
# tests. Same version pin as impress-embeddings' own dev-dependency.
tempfile = "3.10"
