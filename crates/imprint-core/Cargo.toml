[package]
name = "imprint-core"
description = "Core document and bibliography management for imprint - CRDT-based collaborative academic writing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Self-contained C dependencies for the Tectonic LaTeX engine, built statically
# via `cargo vcpkg build` so a `tectonic-render` build links no Homebrew dylibs.
# vcpkg's stock macOS triplets default to static linkage, so no custom triplet
# overlay is needed here (unlike Windows). Mirrors tectonic's own manifest.
# Usage: `cargo vcpkg build --manifest-path crates/imprint-core/Cargo.toml`
# then build with VCPKG_ROOT=target/vcpkg TECTONIC_DEP_BACKEND=vcpkg.
[package.metadata.vcpkg]
git = "https://github.com/microsoft/vcpkg"
rev = "a62ce77d56ee07513b4b67de1ec2daeaebfae51a"

[package.metadata.vcpkg.target.aarch64-apple-darwin]
triplet = "arm64-osx"
install = ["freetype", "harfbuzz[graphite2]", "icu"]

[package.metadata.vcpkg.target.x86_64-apple-darwin]
triplet = "x64-osx"
install = ["freetype", "harfbuzz[graphite2]", "icu"]

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[features]
default = []
uniffi = ["dep:uniffi"]
# Enable Typst rendering support (requires typst dependencies)
typst-render = ["dep:typst", "dep:typst-pdf", "dep:typst-svg", "dep:typst-as-lib", "dep:comemo", "dep:impress-plot"]
# Full native build with both UniFFI and Typst
native = ["uniffi", "typst-render"]
# Enable the self-contained Tectonic LaTeX engine (heavy C dependency tree:
# freetype2, graphite2, icu4c, libpng, zlib; harfbuzz vendored). Kept OUT of
# `native` until proven — see Phase 0 build spike.
tectonic-render = ["dep:tectonic", "dep:tectonic_status_base", "dep:tectonic_errors", "dep:tectonic_bundles"]

[dependencies]
# Workspace crates
impress-domain = { workspace = true }
impress-bibtex = { workspace = true }
impress-identifiers = { workspace = true }

# CRDT support
automerge = "0.5"

# Serialization and error handling
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

# URL handling for automation
url = "2"
urlencoding = "2"

# Directory paths for user data
dirs = "5"

# Citation extraction (Phase 2A) — LaTeX `\cite{...}` matcher.
regex = { workspace = true }

# SyncTeX parsing (Phase 2B) — `.synctex.gz` gzip decompression.
flate2 = "1"

# UniFFI for FFI bindings (optional)
uniffi = { workspace = true, optional = true }

# Typst rendering (optional, behind feature flag)
typst = { version = "0.14", optional = true }
typst-pdf = { version = "0.14", optional = true }
typst-svg = { version = "0.14", optional = true }
typst-as-lib = { version = "0.15", optional = true, features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
comemo = { version = "0.4", optional = true }

# Native Typst-first plotting (declarative spec → Typst + raster). Optional,
# enabled with the Typst renderer since render_plot_svg compiles through it.
impress-plot = { path = "../impress-plot", optional = true }

# Tectonic self-contained LaTeX engine (optional, behind `tectonic-render`).
# Default features keep bundled HarfBuzz + reqwest-based bundle fetching.
tectonic = { version = "0.16", optional = true }
# StatusBackend trait for capturing structured diagnostics from the driver.
tectonic_status_base = { version = "0.2", optional = true }
# The `Error` type used in the StatusBackend::report signature (distinct from
# tectonic::errors::Error, which is error_chain-based).
tectonic_errors = { version = "0.2", optional = true }
# The `Bundle` trait — implemented by a thread-local shared wrapper so the
# expensive bundle-index load (~2s) is paid once and reused across compiles.
tectonic_bundles = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "uniffi-bindgen"
path = "src/uniffi_bindgen.rs"
required-features = ["uniffi"]
