[package]
name = "impress-ai"
description = "Provenance-first AI conversations for the Impress item graph: koine-ai, over the suite's SQLite store, plus the LocalModels import"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The kernel (koine docs/plan-koine-ai-tasks.md AI-D1). `legacy-sqlite` is the
# error variant the LocalModels import converts into.
koine-ai = { workspace = true, features = ["legacy-sqlite"] }
chrono.workspace = true
impress-core = { workspace = true, features = ["sqlite"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
uuid = { workspace = true, features = ["v4", "v5", "serde"] }
impress-workspace-hack.workspace = true

[features]
# The task executors (and the desk agent), over koine-tasks' scheduler, which
# impel-core re-exports. Opt-in, so the store FFI, which links impress-ai for
# the conversation and registry bindings and never runs a task executor,
# links no scheduler (ADR-0033 D7; decided by Tom 2026-09-24 in wave 6's W6).
# impel-taskd, the executors' one user, turns it on.
executor = ["koine-ai/executor"]
# `JsonSchema` on the DTOs that cross a verb boundary (ADR-0034 D1).
schema = ["koine-ai/schema"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
