[package]
name = "implore-core"
description = "Core visualization engine for implore - scientific data visualization"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# `lib` only. This target is a dependency of ~17 other workspace crates, and
# listing `staticlib`/`cdylib` here made cargo hand rustc all three crate types
# on EVERY dependent build: a plain `cargo build -p impress-mcp` archived a
# 203 MB libimprint_core.a and linked a dylib without ever naming imprint-core,
# and the debug pair is 1.36 GB + 169 MB, rewritten on every test run. Worse,
# cargo drops the feature hash from the FILENAME for path crates that emit a
# cdylib, so one package-id directory held both the `default,typst-render`
# shape (impress-mcp) and the `native` shape (tests, frameworks) and every
# alternation recompiled the crate and all its dependents.
#
# The staticlib the xcframeworks need is produced on demand by the build
# scripts with `cargo rustc --lib --crate-type staticlib`, which uplifts to the
# same target/<triple>/release/lib<crate>.a path they already read.
crate-type = ["lib"]

[features]
default = []
uniffi = ["dep:uniffi"]
parallel = ["dep:rayon"]
kuva = ["dep:kuva"]
lilaq = ["dep:typst", "dep:typst-pdf", "dep:typst-svg", "dep:typst-as-lib"]

[dependencies]
# Workspace crates
impress-domain = { workspace = true }
impress-collab = { workspace = true }
impress-core = { workspace = true }

# Data I/O
implore-io = { workspace = true, features = ["npz"] }

# N-dimensional arrays
ndarray = { workspace = true }

# Linear algebra (3x3 matrix ops for RG computations)
nalgebra = { workspace = true }

# Serialization and error handling
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

# URL handling for automation
url = { workspace = true }
urlencoding = { workspace = true }

# UniFFI for FFI bindings (optional)
uniffi = { workspace = true, optional = true }

# Parallel processing (optional)
rayon = { workspace = true, optional = true }

# kuva plotting library (optional)
kuva = { workspace = true, optional = true }

# Typst rendering for lilaq backend (optional)
typst = { workspace = true, optional = true }
typst-pdf = { workspace = true, optional = true }
typst-svg = { workspace = true, optional = true }
typst-as-lib = { workspace = true, optional = true }

# Statistics (for histogram computation)
implore-stats = { workspace = true }


[dev-dependencies]
