[package]
name = "impress-surface"
description = "ADR-0033 surfaces: spec, schema, plan/resolve/reduce, pure"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Derive `schemars::JsonSchema` on the surface vocabulary, so the S4 verb
# `surface_schema` can hand an agent the JSON Schema without it reading Rust
# source. Forwards the same feature on `impress-pane-query`, whose `PaneQuery` and
# `ParamDecl` a source and a param declaration embed directly — the same
# forwarding `impress-layout`'s `schema` feature does for the same types.
schema = ["dep:schemars", "impress-pane-query/schema"]

[dependencies]
# `PaneQuery` and `ParamDecl` are spelled once, in the pane-query algebra
# (ADR-0031 D2). ADR-0033 D7 moved that algebra into `impress-pane-query`
# (S0), so this crate depends on the algebra crate alone and never on
# impress-core: the kit line `scripts/check-kit-deps.sh` pins.
impress-pane-query = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
schemars = { workspace = true, optional = true }
