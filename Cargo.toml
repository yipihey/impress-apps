[workspace]
resolver = "2"
members = [
    "crates/impress-workspace-hack",
    "crates/uniffi-bindgen",
    "crates/im-bibtex",
    "crates/im-identifiers",
    "crates/impress-domain",
    "crates/vw-domain",
    "crates/vw-service",
    "crates/vw-impress-adapter",
    "crates/vw-mcp",
    "crates/impress-bibtex",
    "crates/impress-identifiers",
    "crates/impress-collab",
    "crates/imprint-core",
    "crates/imbib-core",
    # P3c step 1: the three legacy semantic-search MCP tools as a real
    # #[impress_service] trait, behind impress-capabilities' semantic-search
    # feature (NOT full) — see docs/plan-verb-pipeline-and-transport.md.
    "crates/imbib-semantic-service",
    # local-network (SFTP) transport for reMarkable tablets
    "crates/impress-remarkable",
    # provenance-first local/remote inference over the shared item graph
    "crates/impress-ai",
    "crates/impress-ai-service",
    "crates/impress-ai-tools",
    "crates/impress-ai-http",
    # implore - scientific data visualization
    "crates/implore-core",
    "crates/implore-stats",
    "crates/implore-io",
    "crates/implore-selection",
    # impel - agent orchestration for autonomous research
    "crates/impel-core",
    # impel-enrichment - ADR-0005 §9 reference implementation (task executors)
    "crates/impel-enrichment",
    # impel-throughline - ADR-0016 throughline sync (spawn rule + executor)
    "crates/impel-throughline",
    # impel-taskd - live task scheduler daemon over the shared store
    "crates/impel-taskd",
    # impel-tools - projects the #[impress_service] inventory into impel's agent loop
    "crates/impel-tools",
    # implore/impart service traits (TypeScript MCP retirement)
    "crates/implore-service",
    # implore-verbs-ffi - implore's own per-app UniFFI target (plan-verb-
    # pipeline-and-transport.md § P5): links implore-service directly,
    # outside the kit boundary impress-store-ffi keeps.
    "crates/implore-verbs-ffi",
    "crates/imbib-verbs-ffi",
    "crates/imprint-verbs-ffi",
    "crates/impart-verbs-ffi",
    "crates/impart-service",
    "crates/impress-bridges-service",
    # impress-store-service - store-generic services (ADR-0022 WP G1):
    # the collection kernel + generic triage verbs, no app dependency.
    "crates/impress-store-service",
    "crates/impress-helix",
    "apps/impel-tui",
    "crates/impel-server",
    # impart - research conversation platform
    "crates/impart-core",
    # impress-git - git integration logic (models, parsers, command builders)
    "crates/impress-git",
    # impress-toolbox - unsandboxed local tool execution server
    "crates/impress-toolbox",
    # impress-core - unified item protocol. The item protocol it re-exports
    # lives in koine (impress-item).
    "crates/impress-core",
    # impress-layout-service and impress-surface-service live in koine
    # (docs/plan-koine-host.md K3b); see [workspace.dependencies].
    # W1: the workflow verbs (validate/create/get/list/dry-run/enable/disable)
    # over impress-core's `impress/workflow@1.0.0` rows.
    # the one place the #[impress_service] inventory is linked (ADR-0033 D4)
    "crates/impress-capabilities",
    # the ADR-0033 D7 standalone-kit slice of the inventory (store, layout,
    # surface, surface-demo) split out so impress-store-ffi can depend on it
    # without the impress-capabilities package cycle (plan-agent-surfaces.md S6)
    # impress-plot - native Typst-first plotting (declarative spec → Typst + raster)
    "crates/impress-plot",
    # impress-store-ffi - UniFFI bindings for the shared impress-core store
    "crates/impress-store-ffi",
    # scix-client-ffi - UniFFI bindings for scix-client (NASA ADS/SciX API)
    "crates/scix-client-ffi",
    # impress-sources - HTTP clients for arXiv/Crossref/ADS/OpenAlex/etc
    "crates/impress-sources",
    # impress-smart-search - deterministic Cmd+S search core (intent
    # classification, ADS query normalization/rewriting, reference validation,
    # page identifier extraction). Ported from the ImpressSmartSearch Swift
    # package; the LLM call and the page fetch stay Swift.
    "crates/impress-smart-search",
    "crates/impel-service",
    "crates/impress-parsers-service",
    "crates/impress-smart-search-service",
    # imprint-service - Phase 2D/2E: manuscript persistence + search + stateless HTTP handlers
    "crates/imprint-service",
    # imbib-service - Phase 3: ImbibTextService trait exposed via #[impress_service]
    "crates/imbib-service",
    # imbib-cli / imprint-cli - Phase 3A: clap binaries auto-generated from
    # CliSubcommand inventory entries registered by the *-service crates.
    "crates/imbib-cli",
    "crates/imprint-cli",
    # impress-cli - the same clap-from-inventory binary for the store-generic
    # services (collections, triage, store query, docs import), which belong to
    # no app and so had no CLI host until now.
    "crates/impress-cli",
    # impress-mcp - stdio JSON-RPC MCP server (Phase 3B: imports *-service
    # inventory entries to surface trait methods as MCP tools).
    "crates/impress-mcp",
    # impress-py - the P6 Python binding: a thin cdylib that links impress's
    # inventory and hands the module to `koine_py::register` (koine
    # docs/plan-koine-kit-moves.md KM1).
    "crates/impress-py",
    # imprint-selftest - declarative capability self-tests (Tier A pure-Rust,
    # Tier B live-app-over-HTTP) producing an agent-readable pass/fail report.
    "crates/imprint-selftest",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yipihey/impress-apps"

[workspace.lints.rust]
# Keep unsafe operations explicit even inside an unsafe function.
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# Accidental debug output and unfinished branches must not ship in a verb host.
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
# The cargo-hakari workspace-hack crate: every member depends on it so every
# lane resolves one third-party feature set (plan-verb-pipeline-and-transport
# § Build cost, B4). Generated; `cargo hakari generate` rewrites it and
# `cargo hakari manage-deps` adds the line to a new member. Configured in
# .config/hakari.toml.
impress-workspace-hack = { path = "crates/impress-workspace-hack" }
# Shared dependencies across crates
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2.0"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Parsing
nom = "7.1"
regex = "1.10"
lazy_static = "1.4"

# UniFFI for FFI bindings (optional).
# NO `cli` here: that feature makes `uniffi_bindgen` a normal dependency of the
# facade, so every library enabling `uniffi` linked the whole generator stack
# (askama, goblin, cargo_metadata, clap - 40 crates) in every profile and for
# all five Apple triples. The generator lives in ONE binary crate now,
# `crates/uniffi-bindgen`, which the build-xcframework scripts invoke.
uniffi = { version = "0.28", default-features = false }

# Async trait support (HTTP source plugins, service traits)
async-trait = "0.1"
# HTTP client (rustls so no OpenSSL dependency on macOS/Linux/CI)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# XML parsing (arXiv Atom feed, PubMed)
quick-xml = "0.38"
# HTTP mocking for source-client tests
mockito = "1"

# Internal workspace crates
impress-domain = { path = "crates/impress-domain" }
impress-bibtex = { path = "crates/impress-bibtex" }
impress-identifiers = { path = "crates/impress-identifiers" }

# Standalone library crates (local dev, published to crates.io)
im-bibtex = { path = "crates/im-bibtex" }
im-identifiers = { path = "crates/im-identifiers" }
impress-collab = { path = "crates/impress-collab" }
impress-keymap = { path = "../koine/crates/impress-keymap" }
imprint-core = { path = "crates/imprint-core" }
imprint-service = { path = "crates/imprint-service" }
imprint-selftest = { path = "crates/imprint-selftest" }
imbib-service = { path = "crates/imbib-service" }
imbib-semantic-service = { path = "crates/imbib-semantic-service" }
imbib-core = { path = "crates/imbib-core" }
impress-item = { path = "../koine/crates/impress-item" }
# The store conformance suite (koine docs/plan-koine-store.md D6): impress-core
# runs it against SqliteItemStore as a dev-dependency, so the three backends
# can only drift into a failing test.
koine-store-conformance = { path = "../koine/crates/koine-store-conformance" }
# The store port by name: `koine_store::process` is the process-wide store,
# manifest-free registry the layout and surface runtimes read (plan K3a).
koine-store = { path = "../koine/crates/koine-store" }
koine-store-memory = { path = "../koine/crates/koine-store-memory" }
impress-schema-ref-codegen = { path = "../koine/crates/impress-schema-ref-codegen" }
impress-core = { path = "crates/impress-core" }
impress-layout = { path = "../koine/crates/impress-layout" }
# The ADR-0031 D8 layout verbs and the ADR-0033 surface verbs, runtimes over the
# store port (docs/plan-koine-host.md H-D3, K3b).
impress-layout-service = { path = "../koine/crates/impress-layout-service" }
impress-pane-query = { path = "../koine/crates/impress-pane-query" }
impress-pane-query-compile = { path = "../koine/crates/impress-pane-query-compile" }
impress-surface = { path = "../koine/crates/impress-surface" }
impress-workflow = { path = "../koine/crates/impress-workflow" }
impress-workflow-service = { path = "../koine/crates/impress-workflow-service" }
impress-verb-surface = { path = "../koine/crates/impress-verb-surface" }
koine = { path = "../koine/crates/koine" }
koine-style-file = { path = "../koine/crates/koine-style-file" }
koine-tui = { path = "../koine/crates/koine-tui" }
# The plot spec and its SVG renderer and tick calculator (koine docs/plan-koine-followups.md
# F-D3): implore-core re-exports them, so a plot has one definition.
koine-plot = { path = "../koine/crates/koine-plot" }
# The inventory-backed MCP host (stdio and HTTP) impress-mcp and vw-mcp mount
# (docs/plan-koine-host.md H-D5): moved from crates/impress-mcp-host.
koine-mcp-host = { path = "../koine/crates/koine-mcp-host" }
# The agent desk (koine docs/plan-koine-research-os.md G-D): requests a person
# leaves for an agent, and the skill an agent reads. `koine-notebook` is its
# dependency (a `diagnose` request carries the call's notebook record).
koine-agent = { path = "../koine/crates/koine-agent" }
koine-notebook = { path = "../koine/crates/koine-notebook", default-features = false }
# The task kernel and the AI kernel (koine docs/plan-koine-ai-tasks.md):
# impel-core, impress-core's task/job and impress-ai re-export them.
# Features are opt-in per member (a workspace dependency cannot turn one off).
koine-tasks = { path = "../koine/crates/koine-tasks", default-features = false }
koine-ai = { path = "../koine/crates/koine-ai", default-features = false }
impress-scenario = { path = "../koine/crates/impress-scenario" }
impress-scenario-service = { path = "../koine/crates/impress-scenario-service" }
impress-capabilities = { path = "crates/impress-capabilities", default-features = false }
impress-surface-service = { path = "../koine/crates/impress-surface-service" }
surface-demo-service = { path = "../koine/crates/surface-demo-service" }
# Moved to koine (docs/plan-koine-kit-moves.md KM1): the performance verbs,
# the verb transport's client, the impact verbs and the Python module builder.
perf-service = { path = "../koine/crates/perf-service" }
impress-app-transport = { path = "../koine/crates/impress-app-transport" }
capabilities-service = { path = "../koine/crates/capabilities-service" }
koine-py = { path = "../koine/crates/koine-py" }
# KM2: the tag and flag models, and the triage kernel, verbs and package.
# Features are opt-in per member: impress-core takes only the kernel, the
# service crates add `service`; `package` (the builtin:triage package, which
# links koine-packages and so the notebook and agent verbs) is KM7/KM8's.
impress-tags = { path = "../koine/crates/impress-tags" }
impress-flags = { path = "../koine/crates/impress-flags" }
koine-triage = { path = "../koine/crates/koine-triage", default-features = false }
# KM4: the collection kernel and verbs (impress-core takes the kernel only;
# the service crate adds `service`) and the settings verbs.
koine-collections = { path = "../koine/crates/koine-collections", default-features = false }
koine-settings-service = { path = "../koine/crates/koine-settings-service" }
# default-features = false HERE, not at the call site: a member inheriting a
# workspace dependency can only add features, never remove them, so a member
# writing `default-features = false` is silently ignored (cargo warns, and
# says it may become a hard error). Consumers opt in to store/index/embedder.
# KM5: the embedding stack, memory kernel/verbs and executors are koine's;
# the old names stay as aliases so no `use` changes.
impress-embeddings = { package = "koine-embeddings", path = "../koine/crates/koine-embeddings", default-features = false }
impress-sources = { path = "crates/impress-sources" }
impress-smart-search = { path = "crates/impress-smart-search" }
impel-service = { path = "crates/impel-service" }
impress-parsers-service = { path = "crates/impress-parsers-service" }
impress-smart-search-service = { path = "crates/impress-smart-search-service" }
impress-memory-service = { package = "koine-memory", path = "../koine/crates/koine-memory" }
koine-memory = { path = "../koine/crates/koine-memory", default-features = false }
# KM9: grouped search, relations, get and browse (kernels; the verbs behind `service`).
koine-store-query = { path = "../koine/crates/koine-store-query", default-features = false }
# KM14: the effects spy's shared types (and SpyStore for any backend).
koine-store-spy = { path = "../koine/crates/koine-store-spy" }
# KM12: runtime-provider persistence and the provider-service verbs.
koine-providers = { path = "../koine/crates/koine-providers" }
impress-git = { path = "crates/impress-git" }
impress-store-ffi = { path = "crates/impress-store-ffi" }
scix-client-ffi = { path = "crates/scix-client-ffi" }
impress-remarkable = { path = "crates/impress-remarkable" }
impress-fs-lock = { path = "../koine/crates/impress-fs-lock" }
koine-store-dir = { path = "../koine/crates/koine-store-dir" }
impress-settings = { path = "../koine/crates/impress-settings" }
impress-ai = { path = "crates/impress-ai" }
impress-ai-service = { path = "crates/impress-ai-service" }
impress-ai-tools = { path = "crates/impress-ai-tools" }
impress-ai-http = { path = "crates/impress-ai-http" }

# implore crates
implore-core = { path = "crates/implore-core" }
implore-stats = { path = "crates/implore-stats" }
implore-io = { path = "crates/implore-io" }
implore-selection = { path = "crates/implore-selection" }

# Scientific data I/O (for implore)
hdf5 = "0.8"
fitsio = "0.21"
# `arrow` is in parquet's default feature set and pulls arrow-array/-cast/-ipc/
# -select, flatbuffers and the lexical-* family (~16 crates) for a reader that
# only uses `parquet::record` - the row API. Codecs are kept, brotli included,
# so existing files still read.
parquet = { version = "53", default-features = false, features = ["snap", "zstd", "flate2", "lz4", "brotli", "base64"] }
csv = "1.3"

# URL handling
url = "2"
urlencoding = "2"

# N-dimensional arrays (for implore volumetric data)
ndarray = "0.16"

# NPZ/NPY file reading (for implore)
npyz = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Linear algebra (for implore RG computations)
nalgebra = "0.33"

# Parallel processing
rayon = "1.10"

# Plotting (for implore)
kuva = "0.1"
# SVG → PNG for a figure's stored artifact (implore-core figure_artifact).
# Already in the tree through typst-pdf → krilla-svg; no raster-image
# decoders, because implore's SVG embeds none.
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }

# Typst rendering (for implore lilaq backend + imprint)
typst = "0.14"
typst-pdf = "0.14"
typst-svg = "0.14"
typst-as-lib = { version = "0.15", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }

# impel crates
impel-core = { path = "crates/impel-core" }
impel-memory = { package = "koine-memory", path = "../koine/crates/koine-memory", features = ["executors"] }
impress-helix = { path = "../koine/crates/impress-helix" }
impel-tui = { path = "apps/impel-tui" }
impel-server = { path = "crates/impel-server" }

# impel dependencies
rusqlite = { version = "0.32", features = ["bundled", "serde_json", "backup"] }
ratatui = "0.29"
crossterm = "0.28"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Bridges any remaining `log` caller (a dependency; G7a moved the workspace's
# own `log`-facade crates onto `tracing`, D-P1) into whatever `tracing`
# subscriber is installed — `impress-store-ffi`'s bridge layer calls
# `LogTracer::init()`.
tracing-log = "0.2"

# Persona/config loading
toml = "0.8"
dirs = "6"

# impress-service-* (Phase 0 codegen pipeline)
impress-service-core = { path = "../koine/crates/impress-service-core" }
impress-service-macros = { path = "../koine/crates/impress-service-macros" }
inventory = "0.3"
schemars = { version = "0.8", features = ["uuid1"] }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
darling = "0.20"
pyo3 = { version = "0.23", features = ["extension-module"] }
pythonize = "0.23"

# Auto-generated CLI binaries (imbib-cli, imprint-cli) — clap built from
# CliSubcommand inventory entries registered by `#[impress_service]`.
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "string"] }
imbib-cli = { path = "crates/imbib-cli" }
imprint-cli = { path = "crates/imprint-cli" }

# HTTP transport for the unified storage (Phase A/B/C from we-are-planning-…).
impress-py = { path = "crates/impress-py" }
implore-service = { path = "crates/implore-service" }
implore-verbs-ffi = { path = "crates/implore-verbs-ffi" }
imbib-verbs-ffi = { path = "crates/imbib-verbs-ffi" }
imprint-verbs-ffi = { path = "crates/imprint-verbs-ffi" }
impart-verbs-ffi = { path = "crates/impart-verbs-ffi" }
impart-service = { path = "crates/impart-service" }
impress-bridges-service = { path = "crates/impress-bridges-service" }
impress-store-service = { path = "crates/impress-store-service" }

# Dev/test debug info. macOS defaults to `split-debuginfo = "unpacked"`, which
# means rustc KEEPS every codegen unit's `.o` file next to the rlib whenever
# debuginfo is on - that is where DWARF lives. With ~1,080 registry crates and
# one flat `target/debug/deps`, those objects reached 1,223,708 files, and a
# directory that size costs 40-70 SECONDS to launch a test binary out of (same
# bytes one directory up: 1.7s). A 4-package test run is 21 such launches, which
# is where ~55 minutes of a measured 58m49s job went - against 3m06s of
# compiling and 28.8s of actual tests.
#
# `debug = false` for dependencies stops the retention for every registry crate
# (rustc keeps the objects only when debuginfo is enabled); members keep
# line tables, so backtraces still resolve to file:line in our own code.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# `[profile.test]` inherits dev, so test binaries get the same treatment.
#
# Release is NOT incremental: it used to be, to speed the framework-rebuild
# loop, but incremental applies only to workspace members while the shipped
# binaries (impress-mcp, imprint, impress, impel-taskd - signed out of
# target/release) paid 256-way codegen-unit partitioning for it. The framework
# scripts set CARGO_INCREMENTAL=1 for themselves instead; they build into
# target/<triple>/release, which the shipped binaries never share.
