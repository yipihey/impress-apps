name: impel

# Chassis UTIs (`ChassisUTIs` target template) — the types
# PublicationManagerCore/ImpressKit build with `UTType(exportedAs:)`. Declared
# once for the whole suite; see the header of that file.
include:
  - path: ../chassis-utis.yml
options:
  bundleIdPrefix: com.impress
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    PRODUCT_NAME: impel
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  # The shared GUI chassis (GUI-meld / ADR-0021). impel consumes it for the
  # Stage 2-C unified window (ImpelChassisRoot); macOS target only.
  PublicationManagerCore:
    path: ../imbib/PublicationManagerCore
  ImpelCore:
    path: Packages/ImpelCore
  ImpelMail:
    path: Packages/ImpelMail
  CounselEngine:
    path: Packages/CounselEngine
  ImpressAI:
    path: ../../packages/ImpressAI
  ImpressTestKit:
    path: ../../packages/ImpressTestKit
  ImpressKit:
    path: ../../packages/ImpressKit
  ImpressAutomation:
    path: ../../packages/ImpressAutomation
  ImpressLogging:
    path: ../../packages/ImpressLogging
  ImpressKeyboard:
    path: ../../packages/ImpressKeyboard
  ImpressRustCore:
    path: ../../packages/ImpressRustCore

targets:
  impel:
    type: application
    platform: macOS
    templates: [ChassisUTIs]
    deploymentTarget: "26.0"
    postBuildScripts:
      # Debug macOS builds install a fresh copy into ~/Applications so Spotlight
      # always launches the latest build (not a stale DerivedData/Archive copy).
      - name: Install to ~/Applications (Debug)
        basedOnDependencyAnalysis: false
        script: |
          # IMPRESS_SKIP_INSTALL=1 opts out (worktree/CI builds must not
          # hijack the ~/Applications copy a developer is actively using).
          # Also require a real signing identity: an ad-hoc (CODE_SIGNING_ALLOWED=NO)
          # copy has NO entitlements, and installing it strips the app-sandbox +
          # application-groups grants → macOS prompts on every launch for the
          # shared group container and Documents.
          if [ "$CONFIGURATION" = "Debug" ] && [ "$PLATFORM_NAME" = "macosx" ] && [ -z "$IMPRESS_SKIP_INSTALL" ] && [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
            DEST="$HOME/Applications"
            LSREG="/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister"
            mkdir -p "$DEST"
            rm -rf "$DEST/$FULL_PRODUCT_NAME"
            /usr/bin/ditto "$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME" "$DEST/$FULL_PRODUCT_NAME"
            # Script phases run BEFORE Xcode's final product codesign, so the copy is
            # unsigned at this point — sign it ourselves or launchd refuses to spawn it.
            ENT=$(/usr/bin/find "$TARGET_TEMP_DIR" -name "*.xcent" -print -quit 2>/dev/null)
            if [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
              # The debug dylib (Xcode 16 previews) is also only signed during final
              # product signing — sign nested dylibs first or the outer sign fails.
              for dl in "$DEST/$FULL_PRODUCT_NAME/Contents/MacOS/"*.dylib; do
                [ -e "$dl" ] && /usr/bin/codesign --force --timestamp=none --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$dl"
              done
              /usr/bin/codesign --force ${ENT:+--entitlements "$ENT"} --options runtime --timestamp=none --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$DEST/$FULL_PRODUCT_NAME" || echo "warning: re-sign of installed copy failed"
            fi
            /usr/bin/chflags nohidden "$DEST/$FULL_PRODUCT_NAME"
            "$LSREG" -f "$DEST/$FULL_PRODUCT_NAME" || true
            # Keep the DerivedData copy out of Spotlight so ~/Applications is the only hit
            "$LSREG" -u "$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME" 2>/dev/null || true
            /usr/bin/chflags hidden "$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME" || true
            echo "note: installed $FULL_PRODUCT_NAME to $DEST"
          fi
    sources:
      - path: Shared
        excludes:
          - "**/*.xcassets"
      - path: macOS
        excludes:
          - "**/*.xcassets"
      - path: Shared/Assets.xcassets
      - path: macOS/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.impress.impel
        INFOPLIST_FILE: macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: macOS/impel.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: PublicationManagerCore
      - package: ImpelCore
      - package: ImpelMail
      - package: CounselEngine
      - package: ImpressAI
      - package: ImpressKit
      - package: ImpressAutomation
      - package: ImpressLogging
      - package: ImpressKeyboard
      - target: impel-Widgets
        embed: true
    info:
      path: macOS/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.impress.impel
            CFBundleURLSchemes:
              - impel
        LSApplicationQueriesSchemes:
          - imbib
          - imprint
          - implore
          - impart
        # impel declares no types of its own — its whole exported set is the
        # chassis one, supplied by the ChassisUTIs template
        # (apps/chassis-utis.yml). The paper-reference / document-reference /
        # figure-reference / veusz-plot-reference UTImportedTypeDeclarations
        # that used to sit here were removed on 2026-07-30: all four graduated
        # into that template as EXPORTED entries, which is what
        # `UTType(exportedAs:)` in ImpressKit actually requires — an imported
        # entry never satisfied it (see the chassis-utis.yml header).
    entitlements:
      path: macOS/impel.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.application-groups:
          # Team-ID prefix on macOS avoids the app-group TCC prompt.
          - QG3MEYVHMS.com.impress.suite

  impel-Widgets:
    type: app-extension
    platform: macOS
    sources:
      - path: impel-Widgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.impress.impel.widgets
        PRODUCT_MODULE_NAME: impelWidgets
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: impel-Widgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  impelTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: impel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.impress.impel.tests
        PRODUCT_MODULE_NAME: impelTests
        GENERATE_INFOPLIST_FILE: YES

  impelUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: impelUITests
    dependencies:
      - target: impel
      - package: ImpressTestKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.impress.impel.uitests
        PRODUCT_MODULE_NAME: impelUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  impel:
    build:
      targets:
        impel: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - impelTests
        - impelUITests
    profile:
      config: Release
    archive:
      config: Release
