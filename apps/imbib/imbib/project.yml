name: imbib
options:
  bundleIdPrefix: com.impress
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: QG3MEYVHMS
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "20260201.1"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -Osize
      STRIP_INSTALLED_PRODUCT: YES
      COPY_PHASE_STRIP: YES

packages:
  PublicationManagerCore:
    path: ../PublicationManagerCore
  ImpressHelixCore:
    path: ../../../packages/ImpressHelixCore
  ImpressPresence:
    path: ../../../packages/ImpressPresence
  ImbibRustCore:
    path: ../ImbibRustCore
  # Transitive dependencies of PublicationManagerCore — declared here so
  # Xcode GUI can resolve them (xcodebuild CLI resolves them automatically,
  # but the GUI cannot follow transitive local package references).
  ImpressAutomation:
    path: ../../../packages/ImpressAutomation
  ImpressAI:
    path: ../../../packages/ImpressAI
  ImpressKeyboard:
    path: ../../../packages/ImpressKeyboard
  ImpressSidebar:
    path: ../../../packages/ImpressSidebar
  ImpressFTUI:
    path: ../../../packages/ImpressFTUI
  ImpressMailStyle:
    path: ../../../packages/ImpressMailStyle
  ImpressLogging:
    path: ../../../packages/ImpressLogging
  ImpressOperationQueue:
    path: ../../../packages/ImpressOperationQueue
  ImpressKit:
    path: ../../../packages/ImpressKit
  ImpressUndoHistory:
    path: ../../../packages/ImpressUndoHistory
  ImpressTheme:
    path: ../../../packages/ImpressTheme

targets:
  # macOS App
  imbib:
    type: application
    platform: macOS
    postBuildScripts:
      # Debug macOS builds install a fresh copy into ~/Applications so Spotlight
      # always launches the latest build (not a stale DerivedData/Archive copy).
      - name: Install to ~/Applications (Debug)
        basedOnDependencyAnalysis: false
        script: |
          # Only install a PROPERLY SIGNED copy. A headless/CI build
          # (CODE_SIGNING_ALLOWED=NO → empty EXPANDED_CODE_SIGN_IDENTITY) is
          # ad-hoc with NO entitlements; installing it over the user's signed
          # copy strips the app-sandbox + application-groups entitlements, so
          # macOS then prompts on every launch for the shared group container
          # ("access data from other apps") and Documents. Skip it.
          if [ "$CONFIGURATION" = "Debug" ] && [ "$PLATFORM_NAME" = "macosx" ] && [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
            DEST="$HOME/Applications"
            LSREG="/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister"
            mkdir -p "$DEST"
            rm -rf "$DEST/$FULL_PRODUCT_NAME"
            /usr/bin/ditto "$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME" "$DEST/$FULL_PRODUCT_NAME"
            # Script phases run BEFORE Xcode's final product codesign, so the copy is
            # unsigned at this point — sign it ourselves or launchd refuses to spawn it.
            ENT=$(/usr/bin/find "$TARGET_TEMP_DIR" -name "*.xcent" -print -quit 2>/dev/null)
            if [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
              # The debug dylib (Xcode 16 previews) is also only signed during final
              # product signing — sign nested dylibs first or the outer sign fails.
              for dl in "$DEST/$FULL_PRODUCT_NAME/Contents/MacOS/"*.dylib; do
                [ -e "$dl" ] && /usr/bin/codesign --force --timestamp=none --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$dl"
              done
              /usr/bin/codesign --force ${ENT:+--entitlements "$ENT"} --options runtime --timestamp=none --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$DEST/$FULL_PRODUCT_NAME" || echo "warning: re-sign of installed copy failed"
            fi
            /usr/bin/chflags nohidden "$DEST/$FULL_PRODUCT_NAME"
            "$LSREG" -f "$DEST/$FULL_PRODUCT_NAME" || true
            # Keep the DerivedData copy out of Spotlight so ~/Applications is the only hit
            "$LSREG" -u "$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME" 2>/dev/null || true
            /usr/bin/chflags hidden "$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME" || true
            echo "note: installed $FULL_PRODUCT_NAME to $DEST"
          fi
    sources:
      - path: imbib
        excludes:
          - "**/*.entitlements"
          - "**/ShareExtension/**"
      # Help documentation resources
      - path: ../docs
        name: HelpDocs
        type: folder
        buildPhase: resources
        excludes:
          - "adr/**"
          - "_site/**"
          - "_includes/**"
          - "_layouts/**"
          - "*.yml"
          - "Gemfile*"
    dependencies:
      - package: PublicationManagerCore
      - package: ImpressHelixCore
      - package: ImpressPresence
      - package: ImpressKit
      - target: imbib-ShareExtension
        embed: true
      - target: imbib-SafariExtension
        embed: true
      - target: imbib-FileProvider
        embed: true
      - target: imbib-Widgets
        embed: true
    info:
      path: imbib/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSSpeechRecognitionUsageDescription: imbib uses speech recognition for voice search and dictation features.
        CFBundleURLTypes:
          - CFBundleURLName: com.impress.imbib
            CFBundleURLSchemes:
              - imbib
        NSUserActivityTypes:
          - com.impress.imbib.viewing-publication
          - com.impress.imbib.reading-pdf
        LSApplicationQueriesSchemes:
          - imprint
          - implore
          - impel
          - impart
        UTExportedTypeDeclarations:
          - UTTypeConformsTo:
              - public.data
            UTTypeDescription: imbib Publication ID
            UTTypeIdentifier: com.imbib.publication-id
            UTTypeTagSpecification: {}
          - UTTypeConformsTo:
              - public.data
            UTTypeDescription: imbib Sidebar Section ID
            UTTypeIdentifier: com.imbib.sidebar-section-id
            UTTypeTagSpecification: {}
          - UTTypeConformsTo:
              - public.data
            UTTypeDescription: Impress Paper Reference
            UTTypeIdentifier: com.impress.paper-reference
            UTTypeTagSpecification: {}
          - UTTypeConformsTo:
              - public.plain-text
            UTTypeDescription: BibTeX Entry
            UTTypeIdentifier: com.impress.bibtex-entry
            UTTypeTagSpecification:
              public.filename-extension:
                - bib
          - UTTypeConformsTo:
              - public.plain-text
            UTTypeDescription: Citation Key
            UTTypeIdentifier: com.impress.citation-key
            UTTypeTagSpecification: {}
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.impress.imbib
        PRODUCT_NAME: imbib
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: imbib/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: imbib
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026"
        CODE_SIGN_ENTITLEMENTS: imbib/Resources/imbib.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: imbib/Resources/imbib.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.application-groups:
          # Team-ID prefix on macOS: authorized by the QG3MEYVHMS.* profile
          # wildcard, so access never triggers the app-group TCC prompt.
          - QG3MEYVHMS.com.impress.imbib
          - QG3MEYVHMS.com.impress.suite
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.impress.imbib
          - iCloud.com.impress.suite
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.impress.imbib

  # iOS App
  imbib-iOS:
    type: application
    platform: iOS
    sources:
      - path: imbib-iOS
        excludes:
          - "**/ShareExtension/**"
          - "**/FileProvider/**"
          # iOS migration debt — these files reference deleted Core Data
          # types (CDPublication, CDLibrary, CDCollection, CDSmartSearch)
          # and APIs removed during the Rust migration. Excluded until
          # they're rewritten to the value-type + RustStoreAdapter world.
          # Stub replacements live alongside as `*Stub.swift`.
          # IOSSidebarView.swift REVIVED 2026-07-20 — full navigation ported
          # to id-based SidebarSection + RustStoreAdapter value types
          # (listLibraries/listCollections/listSmartSearches/getInboxLibrary/
          # getScixLibrary). Edit ops lacking a store API (delete/rename/
          # reorder collection, nested-collection create, delete smart search)
          # degrade to logged no-ops. Its stub is excluded so the type is unique.
          - "Views/IOSSidebarViewStub.swift"
          # IOSPDFBrowserView.swift REVIVED — ported to id-based init +
          # RustStoreAdapter/PublicationModel (getPublicationDetail,
          # BrowserURLProviderRegistry, AttachmentManager keyed by UUIDs).
          # Its stub is excluded so the type is unique.
          - "Views/IOSPDFBrowserViewStub.swift"
          # IOSUnifiedPublicationListWrapper.swift REVIVED — ported to the
          # value-type + RustStoreAdapter world (id-based Source enum,
          # getPublication/getSmartSearch/getScixLibrary, AttachmentManager
          # keyed by UUIDs, id-based smart-search/SciX refresh services).
          # Its stub is excluded so the type is unique.
          - "Views/IOSUnifiedPublicationListWrapperStub.swift"
          # IOSNoPDFView.swift REVIVED — ported to RustStoreAdapter/PublicationModel
          # (getPublicationDetail + AttachmentManager.importPDF(data:for:in:) +
          # id-based IOSPDFBrowserView). Its stub is excluded so the type is unique.
          - "Views/Detail/IOSNoPDFViewStub.swift"
          # IOSPDFTab.swift REVIVED — ported to RustStoreAdapter/PublicationModel
          # (getPublicationDetail + LinkedFileModel + PDFViewerWithControls +
          # AttachmentManager). Its stub is excluded so the type is unique.
          - "Views/Detail/IOSPDFTabStub.swift"
          # IOSSettingsView.swift REVIVED 2026-07-20 — ported off Core Data
          # (CDMutedItem→MutedItem value type via InboxManager/MuteService,
          # CDLibrary→LibraryModel save-destination picker mirroring macOS,
          # deleted CloudKitSyncSettingsView replaced by in-file
          # IOSCloudKitSyncSettingsView shim over CloudKitSyncSettingsStore).
          # Its stub is excluded so the type is unique.
          - "Views/IOSSettingsViewStub.swift"
          # IOSMailComposer.swift REVIVED 2026-07-20 — MFMailComposeViewController
          # wrapper ported off CDPublication to id-based PublicationModel
          # (RustStoreAdapter.getPublicationDetail; BibTeX via exportBibTeX; PDF
          # via AttachmentManager UUID-keyed paths). Its stub is excluded so the
          # type is unique.
          - "Views/Sharing/IOSMailComposerStub.swift"
          # IOSInfoTab.swift REVIVED — id-based metadata tab (attachments, file
          # import, explore/references, cite badges) ported off LibraryModel
          # .containerURL to AttachmentManager UUID-keyed paths. Its stub is
          # excluded so the type is unique.
          - "Views/Detail/IOSInfoTabStub.swift"
      - path: imbib/Resources/Assets.xcassets
      - path: imbib/Resources/DefaultLibrarySet.json
      - path: imbib/Resources/PrivacyInfo.xcprivacy
      # Help documentation resources
      - path: ../docs
        name: HelpDocs
        type: folder
        buildPhase: resources
        excludes:
          - "adr/**"
          - "_site/**"
          - "_includes/**"
          - "_layouts/**"
          - "*.yml"
          - "Gemfile*"
    dependencies:
      - package: PublicationManagerCore
      - package: ImpressHelixCore
      - package: ImpressKit
      - target: imbib-iOS-ShareExtension
        embed: true
      - target: imbib-iOS-SafariExtension
        embed: true
      - target: imbib-iOS-FileProvider
        embed: true
      - target: imbib-iOS-Widgets
        embed: true
    info:
      path: imbib-iOS/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSpeechRecognitionUsageDescription: imbib uses speech recognition for voice search and dictation features.
        CFBundleURLTypes:
          - CFBundleURLName: com.impress.imbib
            CFBundleURLSchemes:
              - imbib
        # Phase D activation: iOS cannot read its own entitlements at
        # runtime, so CloudSyncAvailability consults this marker.
        ImpressSyncContainerIdentifier: iCloud.com.impress.suite
        UILaunchScreen:
          UIColorName: AccentColor
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSUserActivityTypes:
          - com.impress.imbib.viewing-publication
          - com.impress.imbib.reading-pdf
        LSApplicationQueriesSchemes:
          - imprint
          - implore
          - impel
          - impart
        UIBackgroundModes:
          - remote-notification
        UTExportedTypeDeclarations:
          - UTTypeConformsTo:
              - public.data
            UTTypeDescription: imbib Publication ID
            UTTypeIdentifier: com.imbib.publication-id
            UTTypeTagSpecification: {}
          - UTTypeConformsTo:
              - public.data
            UTTypeDescription: imbib Sidebar Section ID
            UTTypeIdentifier: com.imbib.sidebar-section-id
            UTTypeTagSpecification: {}
          - UTTypeConformsTo:
              - public.data
            UTTypeDescription: Impress Paper Reference
            UTTypeIdentifier: com.impress.paper-reference
            UTTypeTagSpecification: {}
          - UTTypeConformsTo:
              - public.plain-text
            UTTypeDescription: BibTeX Entry
            UTTypeIdentifier: com.impress.bibtex-entry
            UTTypeTagSpecification:
              public.filename-extension:
                - bib
          - UTTypeConformsTo:
              - public.plain-text
            UTTypeDescription: Citation Key
            UTTypeIdentifier: com.impress.citation-key
            UTTypeTagSpecification: {}
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.impress.imbib
        PRODUCT_NAME: imbib
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: imbib-iOS/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_ENTITLEMENTS: imbib-iOS/Resources/imbib-iOS.entitlements
    entitlements:
      path: imbib-iOS/Resources/imbib-iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.impress.imbib
          - group.com.impress.suite
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.impress.imbib
          - iCloud.com.impress.suite
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.impress.imbib
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.impress.imbib

  # macOS Share Extension
  imbib-ShareExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: ShareExtension
        excludes:
          - "**/*.entitlements"
      - path: imbib/Resources/Assets.xcassets
    dependencies:
      - package: PublicationManagerCore
      - package: ImbibRustCore
      - framework: ../../../crates/imbib-core/frameworks/ImbibCore.xcframework
        embed: false
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.impress.imbib.ShareExtension
        PRODUCT_NAME: imbib-ShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - QG3MEYVHMS.com.impress.imbib

  # iOS Share Extension
  imbib-iOS-ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: imbib-iOS/ShareExtension
        excludes:
          - "**/*.entitlements"
      - path: imbib/Resources/Assets.xcassets
    dependencies:
      - package: PublicationManagerCore
      - package: ImbibRustCore
      - framework: ../../../crates/imbib-core/frameworks/ImbibCore.xcframework
        embed: false
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.impress.imbib.ShareExtension
        PRODUCT_NAME: imbib-iOS-ShareExtension
        INFOPLIST_FILE: imbib-iOS/ShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: imbib-iOS/ShareExtension/ShareExtension.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: imbib-iOS/ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.impress.imbib

  # macOS Safari Extension
  imbib-SafariExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: imbibSafariExtension/SafariWebExtensionHandler.swift
      - path: imbibSafariExtension/manifest.json
        buildPhase: resources
      - path: imbibSafariExtension/background.js
        buildPhase: resources
      - path: imbibSafariExtension/_locales
        type: folder
        buildPhase: resources
      - path: imbibSafariExtension/content
        type: folder
        buildPhase: resources
      - path: imbibSafariExtension/images
        type: folder
        buildPhase: resources
      - path: imbibSafariExtension/popup
        type: folder
        buildPhase: resources
    dependencies: []
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.impress.imbib.safari-extension
        PRODUCT_NAME: imbib Safari Extension
        INFOPLIST_FILE: imbibSafariExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: imbibSafariExtension/imbibSafariExtension.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        OTHER_LDFLAGS: "-framework SafariServices"
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: imbibSafariExtension/imbibSafariExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - QG3MEYVHMS.com.impress.imbib

  # iOS Safari Extension
  imbib-iOS-SafariExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: imbibSafariExtension/SafariWebExtensionHandler.swift
      - path: imbibSafariExtension/manifest.json
        buildPhase: resources
      - path: imbibSafariExtension/background.js
        buildPhase: resources
      - path: imbibSafariExtension/_locales
        type: folder
        buildPhase: resources
      - path: imbibSafariExtension/content
        type: folder
        buildPhase: resources
      - path: imbibSafariExtension/images
        type: folder
        buildPhase: resources
      - path: imbibSafariExtension/popup
        type: folder
        buildPhase: resources
    dependencies: []
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.impress.imbib.safari-extension
        PRODUCT_NAME: imbib Safari Extension
        INFOPLIST_FILE: imbibSafariExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: imbibSafariExtension/imbibSafariExtension-iOS.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: "-framework SafariServices"
    entitlements:
      path: imbibSafariExtension/imbibSafariExtension-iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.impress.imbib

  # macOS File Provider Extension
  imbib-FileProvider:
    type: app-extension
    platform: macOS
    sources:
      - path: FileProvider
        excludes:
          - "**/*.entitlements"
    dependencies:
      - package: PublicationManagerCore
      - package: ImbibRustCore
      - framework: ../../../crates/imbib-core/frameworks/ImbibCore.xcframework
        embed: false
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.impress.imbib.fileprovider
        PRODUCT_NAME: imbib-FileProvider
        INFOPLIST_FILE: FileProvider/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: FileProvider/FileProvider.entitlements
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
    entitlements:
      path: FileProvider/FileProvider.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - QG3MEYVHMS.com.impress.imbib

  # iOS File Provider Extension
  imbib-iOS-FileProvider:
    type: app-extension
    platform: iOS
    sources:
      - path: imbib-iOS/FileProvider
        excludes:
          - "**/*.entitlements"
      # Shared stub data service — same Foundation-only file the
      # macOS FileProvider target uses. Keeps FileProviderPublication
      # in one place instead of duplicating it into imbib-iOS/.
      - path: FileProvider/FileProviderDataService.swift
    dependencies:
      - package: PublicationManagerCore
      - package: ImbibRustCore
      - framework: ../../../crates/imbib-core/frameworks/ImbibCore.xcframework
        embed: false
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.impress.imbib.fileprovider
        PRODUCT_NAME: imbib-iOS-FileProvider
        INFOPLIST_FILE: imbib-iOS/FileProvider/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: imbib-iOS/FileProvider/FileProvider.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: imbib-iOS/FileProvider/FileProvider.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.impress.imbib

  # macOS Widgets Extension
  imbib-Widgets:
    type: app-extension
    platform: macOS
    sources:
      - path: imbib-Widgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.impress.imbib.widgets
        PRODUCT_MODULE_NAME: imbibWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: imbib-Widgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # iOS Widgets Extension
  imbib-iOS-Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: imbib-iOS-Widgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.impress.imbib.widgets
        PRODUCT_MODULE_NAME: imbibIOSWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: imbib-iOS-Widgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # macOS Tests
  imbibTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: imbibTests
        optional: true
    dependencies:
      - target: imbib
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.impress.imbib.tests
        GENERATE_INFOPLIST_FILE: YES

  imbibUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: imbibUITests
        optional: true
    dependencies:
      - target: imbib
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.impress.imbib.uitests
        GENERATE_INFOPLIST_FILE: YES

  # iOS XCUITest target — the first real UI-test guard for the revived
  # imbib-iOS views (previously only an install-smoke existed in CI).
  # NOTE: does NOT depend on ImpressTestKit — that package is macOS-only
  # (Package.swift: platforms: [.macOS(.v26)]) and the macOS imbibUITests
  # target does not use it either. Accessibility-id anchors are declared
  # locally in the test target (see IOSAccessibility.swift) so the bundle
  # stays lightweight and doesn't link the whole core into the test runner.
  imbib-iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: imbib-iOSUITests
        optional: true
    dependencies:
      - target: imbib-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.impress.imbib.iosuitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  imbib:
    build:
      targets:
        imbib: all
        imbibTests: [test]
        imbibUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - imbibTests
        - imbibUITests
        - package: PublicationManagerCore/PublicationManagerCoreTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Development scheme: Reset to first-run state on launch
  imbib-FirstRun:
    build:
      targets:
        imbib: all
    run:
      config: Debug
      commandLineArguments:
        "--reset-to-first-run": true
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Development scheme: Edit default library set configuration
  imbib-EditDefaultSet:
    build:
      targets:
        imbib: all
    run:
      config: Debug
      commandLineArguments:
        "--edit-default-set": true
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  imbib-iOS:
    build:
      targets:
        imbib-iOS: all
        imbib-iOSUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - imbib-iOSUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
