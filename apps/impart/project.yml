name: impart

# Chassis UTIs (`ChassisUTIs` target template) — the types
# PublicationManagerCore/ImpressKit build with `UTType(exportedAs:)`. Declared
# once for the whole suite; see the header of that file.
include:
  - path: ../chassis-utis.yml
options:
  bundleIdPrefix: com.imbib
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    PRODUCT_NAME: impart
    DEVELOPMENT_TEAM: QG3MEYVHMS
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  MessageManagerCore:
    path: MessageManagerCore
  # The shared GUI chassis (GUI-meld / ADR-0021). impart consumes it for the
  # Stage 2-A unified mail window (ImpartChassisRoot) on macOS and, since
  # Stage 5c, for the iOS sidebar/list/detail surfaces too (ImpartSidebarBindings
  # + IOSMailHostView). BOTH targets link it.
  PublicationManagerCore:
    path: ../imbib/PublicationManagerCore
  ImpartRustCore:
    path: ImpartRustCore
  ImpressAI:
    path: ../../packages/ImpressAI
  ImpressAutomation:
    path: ../../packages/ImpressAutomation
  ImpressKit:
    path: ../../packages/ImpressKit
  ImpressFTUI:
    path: ../../packages/ImpressFTUI
  ImpressMailStyle:
    path: ../../packages/ImpressMailStyle
  ImpressRustCore:
    path: ../../packages/ImpressRustCore
  ImpressSpotlight:
    path: ../../packages/ImpressSpotlight

targets:
  impart:
    type: application
    platform: macOS
    templates: [ChassisUTIs]
    deploymentTarget: "26.0"
    postBuildScripts:
      # Debug macOS builds install a fresh copy into ~/Applications so Spotlight
      # always launches the latest build (not a stale DerivedData/Archive copy).
      - name: Install to ~/Applications (Debug)
        basedOnDependencyAnalysis: false
        script: |
          # IMPRESS_SKIP_INSTALL=1 opts out (worktree/CI builds must not
          # hijack the ~/Applications copy a developer is actively using).
          # Also require a real signing identity: an ad-hoc (CODE_SIGNING_ALLOWED=NO)
          # copy has NO entitlements, and installing it strips the app-sandbox +
          # application-groups grants → macOS prompts on every launch for the
          # shared group container and Documents.
          if [ "$CONFIGURATION" = "Debug" ] && [ "$PLATFORM_NAME" = "macosx" ] && [ -z "$IMPRESS_SKIP_INSTALL" ] && [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
            DEST="$HOME/Applications"
            LSREG="/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister"
            mkdir -p "$DEST"
            rm -rf "$DEST/$FULL_PRODUCT_NAME"
            /usr/bin/ditto "$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME" "$DEST/$FULL_PRODUCT_NAME"
            # Script phases run BEFORE Xcode's final product codesign, so the copy is
            # unsigned at this point — sign it ourselves or launchd refuses to spawn it.
            ENT=$(/usr/bin/find "$TARGET_TEMP_DIR" -name "*.xcent" -print -quit 2>/dev/null)
            if [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
              # The debug dylib (Xcode 16 previews) is also only signed during final
              # product signing — sign nested dylibs first or the outer sign fails.
              for dl in "$DEST/$FULL_PRODUCT_NAME/Contents/MacOS/"*.dylib; do
                [ -e "$dl" ] && /usr/bin/codesign --force --timestamp=none --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$dl"
              done
              /usr/bin/codesign --force ${ENT:+--entitlements "$ENT"} --options runtime --timestamp=none --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$DEST/$FULL_PRODUCT_NAME" || echo "warning: re-sign of installed copy failed"
            fi
            /usr/bin/chflags nohidden "$DEST/$FULL_PRODUCT_NAME"
            "$LSREG" -f "$DEST/$FULL_PRODUCT_NAME" || true
            # Keep the DerivedData copy out of Spotlight so ~/Applications is the only hit
            "$LSREG" -u "$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME" 2>/dev/null || true
            /usr/bin/chflags hidden "$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME" || true
            echo "note: installed $FULL_PRODUCT_NAME to $DEST"
          fi
    sources:
      - path: Shared
      - path: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imbib.impart
        INFOPLIST_FILE: macOS/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: macOS/Resources/impart.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: MessageManagerCore
      - package: PublicationManagerCore
      - package: ImpartRustCore
      - package: ImpressAI
      - package: ImpressAutomation
      - package: ImpressKit
      - package: ImpressFTUI
      - package: ImpressMailStyle
      - package: ImpressSpotlight
      - target: impart-Widgets
        embed: true
    info:
      path: macOS/Resources/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.imbib.impart
            CFBundleURLSchemes:
              - impart
        NSUserActivityTypes:
          - com.impart.viewing-conversation
          - com.impart.composing-message
        LSApplicationQueriesSchemes:
          - imbib
          - imprint
          - implore
          - impel
        # impart exports no types of its own — its whole exported set is the
        # chassis one, supplied by the ChassisUTIs template
        # (apps/chassis-utis.yml). conversation-ref graduated into that template
        # on 2026-07-30, and the paper-reference / veusz-plot-reference
        # UTImportedTypeDeclarations that used to sit here went with it: an
        # imported entry never satisfied `UTType(exportedAs:)` anyway (see the
        # chassis-utis.yml header), so keeping them alongside the template's
        # exported entry would only have been a contradictory duplicate.
    entitlements:
      path: macOS/Resources/impart.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.application-groups:
          # Team-ID prefix on macOS avoids the app-group TCC prompt.
          - QG3MEYVHMS.com.imbib.shared
          - QG3MEYVHMS.com.impress.suite

  impart-Widgets:
    type: app-extension
    platform: macOS
    sources:
      - path: impart-Widgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imbib.impart.widgets
        PRODUCT_MODULE_NAME: impartWidgets
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: impart-Widgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  impartTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: impart
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imbib.impart.tests
        PRODUCT_MODULE_NAME: impartTests
        GENERATE_INFOPLIST_FILE: YES

  # iOS Target
  impart-iOS:
    type: application
    platform: iOS
    # Stage 5c: impart-iOS links PublicationManagerCore (see `dependencies`
    # below), so it compiles the chassis's `UTType(exportedAs:)` call sites and
    # must export those types or fault on first access. The wave-2 UTI work
    # deliberately skipped this target because it did NOT link PMC; it does now.
    templates: [ChassisUTIs]
    deploymentTarget: "26.0"
    sources:
      - path: Shared
      - path: impart-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imbib.impart
        INFOPLIST_FILE: impart-iOS/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: impart-iOS/Resources/impart-iOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - package: MessageManagerCore
      # Stage 5c: the shared GUI chassis on iOS too. imbib-iOS and imprint-iOS
      # list PMC and let SwiftPM resolve its transitive packages; impart-iOS
      # keeps the packages it already named explicitly (they are its own direct
      # imports) and adds PMC alongside.
      - package: PublicationManagerCore
      - package: ImpartRustCore
      - package: ImpressAI
      - package: ImpressAutomation
      - package: ImpressKit
      - package: ImpressFTUI
      - package: ImpressMailStyle
      - package: ImpressSpotlight
      - target: impart-ShareExtension
        embed: true
    info:
      path: impart-iOS/Resources/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.imbib.impart
            CFBundleURLSchemes:
              - impart
        NSUserActivityTypes:
          - com.impart.viewing-conversation
          - com.impart.composing-message
        LSApplicationQueriesSchemes:
          - imbib
          - imprint
          - implore
          - impel
        # No impart-specific types: conversation-ref, paper-reference and
        # veusz-plot-reference all come from the ChassisUTIs template now
        # (graduated 2026-07-30) — same reasoning as the macOS target above.
    entitlements:
      path: impart-iOS/Resources/impart-iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.imbib.shared
          - group.com.impress.suite

  impart-ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: impart-ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imbib.impart.share-extension
        # PRE-EXISTING BUILD BREAK, fixed here because it blocks every
        # impart-iOS build (Stage 5c was the first time anyone compiled that
        # target for a simulator). The project-wide `PRODUCT_NAME: impart` makes
        # PRODUCT_MODULE_NAME default to `impart` for BOTH this extension and
        # the app, so the two targets emit `impart.swiftmodule` into the same
        # Products directory and the build fails with four "Multiple commands
        # produce …/impart.swiftmodule/…" errors before compiling a single file.
        # `impart-Widgets` already carries the same override for the same reason.
        # PRODUCT_NAME is deliberately left alone: only the MODULE name collides,
        # and renaming the product would rename the appex's executable.
        PRODUCT_MODULE_NAME: impartShareExtension
        # The appex was also named `impart.appex` (project-wide PRODUCT_NAME),
        # inside `impart.app` — imbib's names its own `imbib-iOS-ShareExtension`.
        PRODUCT_NAME: impart-ShareExtension
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: impart-ShareExtension/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - sdk: UIKit.framework
      - sdk: UniformTypeIdentifiers.framework
    info:
      # XcodeGen GENERATES this plist from the properties below (that is what an
      # `info:` block means), so hand edits to the file on disk are overwritten
      # on the next `xcodegen generate` — which is presumably how the target
      # ended up with no NSExtension dictionary at all.
      #
      # And with no `NSExtensionPointIdentifier` an `.appex` is not an extension:
      # `simctl install` fails the WHOLE app with "Failed to create app extension
      # placeholder for … impart-ShareExtension.appex" before it is ever
      # launched, so impart-iOS could not be run on a simulator. Nobody had
      # tried until Stage 5c.
      #
      # The activation rule matches what `ShareViewController.didSelectPost`
      # actually handles: plain text, one web URL, one image.
      path: impart-ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: impart
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          # Module-qualified, and the module is the PRODUCT_MODULE_NAME override
          # above rather than the project-wide `impart`.
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: impart-ShareExtension/impart-ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.impress.suite

  impart-iOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: impart-iOSTests
    dependencies:
      - target: impart-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imbib.impart.iostests
        # Same `impart.swiftmodule` collision the share extension had — the
        # macOS `impartTests` target already sets `PRODUCT_MODULE_NAME`.
        PRODUCT_NAME: impart-iOSTests
        PRODUCT_MODULE_NAME: impartIOSTests
        GENERATE_INFOPLIST_FILE: YES
        # PRE-EXISTING BUILD BREAK. XcodeGen derives TEST_HOST from the app
        # target's NAME (`impart-iOS.app/impart-iOS`), but the project-wide
        # `PRODUCT_NAME: impart` means the product is `impart.app/impart` — so
        # `xcodebuild test` failed with "Could not find test host for
        # impart-iOSTests" before running anything. imprint's `imprint-iOSTests`
        # carries the same override for the same reason.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/impart.app/impart"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # iOS UI tests (Stage 5c) — impart's first, following imbib-iOSUITests.
  # A UI-testing bundle launches the app out of process, so it needs no
  # TEST_HOST override; PRODUCT_NAME/PRODUCT_MODULE_NAME ARE overridden because
  # the project-wide `PRODUCT_NAME: impart` would otherwise collide with the
  # app's own product in the simulator products directory.
  # NOT depended on: ImpressTestKit — that package is macOS-only
  # (platforms: [.macOS(.v26)]). Accessibility anchors are declared locally in
  # the test target so the runner does not link PMC + the Rust xcframework.
  impart-iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: impart-iOSUITests
    dependencies:
      - target: impart-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imbib.impart.iosuitests
        PRODUCT_NAME: impart-iOSUITests
        PRODUCT_MODULE_NAME: impartiOSUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  impart:
    build:
      targets:
        impart: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - impartTests
    profile:
      config: Release
    archive:
      config: Release

  impart-iOS:
    build:
      targets:
        impart-iOS: all
        impart-iOSUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - impart-iOSTests
        - impart-iOSUITests
    profile:
      config: Release
    archive:
      config: Release
