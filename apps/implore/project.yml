name: implore

# Chassis UTIs (`ChassisUTIs` target template) — the types
# PublicationManagerCore/ImpressKit build with `UTType(exportedAs:)`. Declared
# once for the whole suite; see the header of that file.
include:
  - path: ../chassis-utis.yml
options:
  bundleIdPrefix: com.impress.implore
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

settings:
  base:
    PRODUCT_NAME: implore
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: QG3MEYVHMS
    CODE_SIGN_STYLE: Automatic

packages:
  ImploreRustCore:
    path: ImploreRustCore
  ImploreCore:
    path: Packages/ImploreCore
  ImpressTestKit:
    path: ../../packages/ImpressTestKit
  ImpressHelixCore:
    path: ../../packages/ImpressHelixCore
  ImpressAutomation:
    path: ../../packages/ImpressAutomation
  ImpressLogging:
    path: ../../packages/ImpressLogging
  ImpressKit:
    path: ../../packages/ImpressKit
  ImpressKeyboard:
    path: ../../packages/ImpressKeyboard
  ImpressRustCore:
    path: ../../packages/ImpressRustCore
  ImpressSpotlight:
    path: ../../packages/ImpressSpotlight
  # Stage 2-B (GUI unification): the shared chassis lives in
  # PublicationManagerCore. implore consumes it (one compile implementation,
  # thin-twin shells — same pattern as imprint).
  PublicationManagerCore:
    path: ../imbib/PublicationManagerCore

targets:
  implore:
    type: application
    platform: macOS
    templates: [ChassisUTIs]
    postBuildScripts:
      # Debug macOS builds install a fresh copy into ~/Applications so Spotlight
      # always launches the latest build (not a stale DerivedData/Archive copy).
      - name: Install to ~/Applications (Debug)
        basedOnDependencyAnalysis: false
        script: |
          # IMPRESS_SKIP_INSTALL=1 opts out (worktree/CI builds must not
          # hijack the ~/Applications copy a developer is actively using).
          # Also require a real signing identity: an ad-hoc (CODE_SIGNING_ALLOWED=NO)
          # copy has NO entitlements, and installing it strips the app-sandbox +
          # application-groups grants → macOS prompts on every launch for the
          # shared group container and Documents.
          if [ "$CONFIGURATION" = "Debug" ] && [ "$PLATFORM_NAME" = "macosx" ] && [ -z "$IMPRESS_SKIP_INSTALL" ] && [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
            DEST="$HOME/Applications"
            LSREG="/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister"
            mkdir -p "$DEST"
            rm -rf "$DEST/$FULL_PRODUCT_NAME"
            /usr/bin/ditto "$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME" "$DEST/$FULL_PRODUCT_NAME"
            # Script phases run BEFORE Xcode's final product codesign, so the copy is
            # unsigned at this point — sign it ourselves or launchd refuses to spawn it.
            ENT=$(/usr/bin/find "$TARGET_TEMP_DIR" -name "*.xcent" -print -quit 2>/dev/null)
            if [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
              # The debug dylib (Xcode 16 previews) is also only signed during final
              # product signing — sign nested dylibs first or the outer sign fails.
              for dl in "$DEST/$FULL_PRODUCT_NAME/Contents/MacOS/"*.dylib; do
                [ -e "$dl" ] && /usr/bin/codesign --force --timestamp=none --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$dl"
              done
              /usr/bin/codesign --force ${ENT:+--entitlements "$ENT"} --options runtime --timestamp=none --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$DEST/$FULL_PRODUCT_NAME" || echo "warning: re-sign of installed copy failed"
            fi
            /usr/bin/chflags nohidden "$DEST/$FULL_PRODUCT_NAME"
            "$LSREG" -f "$DEST/$FULL_PRODUCT_NAME" || true
            # Keep the DerivedData copy out of Spotlight so ~/Applications is the only hit
            "$LSREG" -u "$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME" 2>/dev/null || true
            /usr/bin/chflags hidden "$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME" || true
            echo "note: installed $FULL_PRODUCT_NAME to $DEST"
          fi
    sources:
      - path: Implore/Sources
        excludes:
          - "**/.DS_Store"
          - "**/AI/**"
    settings:
      base:
        INFOPLIST_FILE: Implore/Info.plist
        CODE_SIGN_ENTITLEMENTS: Implore/implore.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.impress.implore
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/../../Frameworks"
    dependencies:
      - package: ImploreCore
      - package: ImpressHelixCore
      - package: ImpressAutomation
      - package: ImpressLogging
      - package: ImpressKit
      - package: ImpressKeyboard
      - package: ImpressSpotlight
      - package: PublicationManagerCore
    info:
      path: Implore/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: implore
            CFBundleURLSchemes:
              - implore
        LSApplicationQueriesSchemes:
          - imbib
          - imprint
          - impel
          - impart
        # implore declares no types of its own — its whole exported set is the
        # chassis one, supplied by the ChassisUTIs template
        # (apps/chassis-utis.yml). figure-reference used to be EXPORTED here and
        # veusz-plot-reference IMPORTED; both graduated into the template on
        # 2026-07-30. Note implore was the only app exporting figure-reference
        # while never reaching it — imbib and imprint reach it, through
        # PMC's shared `SourceEditorView.onDrop`, and only imported it.
    entitlements:
      path: Implore/implore.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.application-groups:
          # Team-ID prefix on macOS avoids the app-group TCC prompt.
          - QG3MEYVHMS.com.impress.shared
          - QG3MEYVHMS.com.impress.suite

  imploreUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: imploreUITests
    dependencies:
      - target: implore
      - package: ImpressTestKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.impress.implore.uitests
        PRODUCT_MODULE_NAME: imploreUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  implore:
    build:
      targets:
        implore: all
        imploreUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - imploreUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
