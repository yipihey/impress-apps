name: imprint
options:
  bundleIdPrefix: com.imbib
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    PRODUCT_NAME: imprint
    DEVELOPMENT_TEAM: QG3MEYVHMS
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  ImprintCore:
    path: Packages/ImprintCore
  ImprintRustCore:
    path: ImprintRustCore
  ImpressTestKit:
    path: ../../packages/ImpressTestKit
  ImpressHelixCore:
    path: ../../packages/ImpressHelixCore
  ImpressAI:
    path: ../../packages/ImpressAI
  ImpressAutomation:
    path: ../../packages/ImpressAutomation
  ImpressKeyboard:
    path: ../../packages/ImpressKeyboard
  ImpressOperationQueue:
    path: ../../packages/ImpressOperationQueue
  ImpressSidebar:
    path: ../../packages/ImpressSidebar
  ImpressLogging:
    path: ../../packages/ImpressLogging
  ImpressKit:
    path: ../../packages/ImpressKit
  ImpressRustCore:
    path: ../../packages/ImpressRustCore
  ImpressStoreKit:
    path: ../../packages/ImpressStoreKit
  ImpressSpotlight:
    path: ../../packages/ImpressSpotlight
  ImpressToolbox:
    path: ../../packages/ImpressToolbox
  ImpressGit:
    path: ../../packages/ImpressGit
  ImpressSyntaxHighlight:
    path: ../../packages/ImpressSyntaxHighlight
  ImbibRustCore:
    path: ../imbib/ImbibRustCore
  ImpressPublicationUI:
    path: ../../packages/ImpressPublicationUI

targets:
  imprint:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    postBuildScripts:
      # Debug macOS builds install a fresh copy into ~/Applications so Spotlight
      # always launches the latest build (not a stale DerivedData/Archive copy).
      - name: Install to ~/Applications (Debug)
        basedOnDependencyAnalysis: false
        script: |
          # IMPRESS_SKIP_INSTALL=1 opts out (worktree/CI builds must not
          # hijack the ~/Applications copy a developer is actively using).
          if [ "$CONFIGURATION" = "Debug" ] && [ "$PLATFORM_NAME" = "macosx" ] && [ -z "$IMPRESS_SKIP_INSTALL" ]; then
            DEST="$HOME/Applications"
            LSREG="/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister"
            mkdir -p "$DEST"
            rm -rf "$DEST/$FULL_PRODUCT_NAME"
            /usr/bin/ditto "$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME" "$DEST/$FULL_PRODUCT_NAME"
            # Script phases run BEFORE Xcode's final product codesign, so the copy is
            # unsigned at this point — sign it ourselves or launchd refuses to spawn it.
            ENT=$(/usr/bin/find "$TARGET_TEMP_DIR" -name "*.xcent" -print -quit 2>/dev/null)
            if [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
              # The debug dylib (Xcode 16 previews) is also only signed during final
              # product signing — sign nested dylibs first or the outer sign fails.
              for dl in "$DEST/$FULL_PRODUCT_NAME/Contents/MacOS/"*.dylib; do
                [ -e "$dl" ] && /usr/bin/codesign --force --timestamp=none --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$dl"
              done
              /usr/bin/codesign --force ${ENT:+--entitlements "$ENT"} --options runtime --timestamp=none --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$DEST/$FULL_PRODUCT_NAME" || echo "warning: re-sign of installed copy failed"
            fi
            /usr/bin/chflags nohidden "$DEST/$FULL_PRODUCT_NAME"
            "$LSREG" -f "$DEST/$FULL_PRODUCT_NAME" || true
            # Keep the DerivedData copy out of Spotlight so ~/Applications is the only hit
            "$LSREG" -u "$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME" 2>/dev/null || true
            /usr/bin/chflags hidden "$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME" || true
            echo "note: installed $FULL_PRODUCT_NAME to $DEST"
          fi
    sources:
      - path: Shared
      - path: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imbib.imprint
        INFOPLIST_FILE: macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: macOS/imprint.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: ImprintCore
      - package: ImprintRustCore
      - package: ImpressHelixCore
      - package: ImpressAI
      - package: ImpressAutomation
      - package: ImpressKeyboard
      - package: ImpressOperationQueue
      - package: ImpressSidebar
      - package: ImpressLogging
      - package: ImpressKit
      - package: ImpressRustCore
      - package: ImpressStoreKit
      - package: ImpressSpotlight
      - package: ImpressToolbox
      - package: ImpressGit
      - package: ImpressSyntaxHighlight
      - package: ImbibRustCore
      - package: ImpressPublicationUI
    info:
      path: macOS/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.imbib.imprint
            CFBundleURLSchemes:
              - imprint
        NSUserActivityTypes:
          - com.imprint.editing-document
          - com.imprint.viewing-document
        LSApplicationQueriesSchemes:
          - imbib
          - implore
          - impel
          - impart
        CFBundleDocumentTypes:
          - CFBundleTypeName: Imprint Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.imbib.imprint.document
          - CFBundleTypeName: LaTeX Source
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.tug.tex
            CFBundleTypeExtensions:
              - tex
          - CFBundleTypeName: Plain Text
            CFBundleTypeRole: Editor
            LSHandlerRank: None
            LSItemContentTypes:
              - public.plain-text
        UTExportedTypeDeclarations:
          - UTTypeConformsTo:
              - com.apple.package
            UTTypeDescription: Imprint Document
            UTTypeIdentifier: com.imbib.imprint.document
            UTTypeTagSpecification:
              public.filename-extension:
                - imprint
          - UTTypeConformsTo:
              - public.data
            UTTypeDescription: Impress Document Reference
            UTTypeIdentifier: com.impress.document-reference
            UTTypeTagSpecification: {}
        UTImportedTypeDeclarations:
          - UTTypeConformsTo:
              - public.data
            UTTypeDescription: Impress Paper Reference
            UTTypeIdentifier: com.impress.paper-reference
            UTTypeTagSpecification: {}
          - UTTypeConformsTo:
              - public.data
            UTTypeDescription: Impress Figure Reference
            UTTypeIdentifier: com.impress.figure-reference
            UTTypeTagSpecification: {}
          - UTTypeConformsTo:
              - public.data
            UTTypeDescription: Impress Veusz Plot Reference
            UTTypeIdentifier: com.impress.veusz-plot-reference
            UTTypeTagSpecification: {}
          - UTTypeConformsTo:
              - public.data
              - public.plain-text
            UTTypeDescription: Veusz Plot
            UTTypeIdentifier: org.veusz.document
            UTTypeTagSpecification:
              public.filename-extension:
                - vsz
    entitlements:
      path: macOS/imprint.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.application-groups:
          # Team-ID prefix on macOS: authorized by the QG3MEYVHMS.* profile
          # wildcard, so access never triggers the app-group TCC prompt.
          - QG3MEYVHMS.com.imbib.shared
          - QG3MEYVHMS.com.impress.suite
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.imbib.shared
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.imbib.shared

  imprintTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: imprint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imbib.imprint.tests
        PRODUCT_MODULE_NAME: imprintTests
        GENERATE_INFOPLIST_FILE: YES

  imprintUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: imprintUITests
    dependencies:
      - target: imprint
      - package: ImpressTestKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imbib.imprint.uitests
        PRODUCT_MODULE_NAME: imprintUITests
        GENERATE_INFOPLIST_FILE: YES

  # iOS Target
  imprint-iOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Shared
      - path: imprint-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imbib.imprint
        INFOPLIST_FILE: imprint-iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: imprint-iOS/imprint-iOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - package: ImprintCore
      - package: ImprintRustCore
      - package: ImpressHelixCore
      - package: ImpressAI
      - package: ImpressAutomation
      - package: ImpressKeyboard
      - package: ImpressOperationQueue
      - package: ImpressSidebar
      - package: ImpressLogging
      - package: ImpressKit
      - package: ImpressRustCore
      - package: ImpressStoreKit
      - package: ImpressSpotlight
      - package: ImpressToolbox
      - package: ImpressGit
      - package: ImpressSyntaxHighlight
      - target: imprint-ShareExtension
        embed: true
    info:
      path: imprint-iOS/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.imbib.imprint
            CFBundleURLSchemes:
              - imprint
        NSUserActivityTypes:
          - com.imprint.editing-document
          - com.imprint.viewing-document
        LSApplicationQueriesSchemes:
          - imbib
          - implore
          - impel
          - impart
        CFBundleDocumentTypes:
          - CFBundleTypeName: Imprint Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.imbib.imprint.document
          - CFBundleTypeName: LaTeX Source
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.tug.tex
            CFBundleTypeExtensions:
              - tex
          - CFBundleTypeName: Plain Text
            CFBundleTypeRole: Editor
            LSHandlerRank: None
            LSItemContentTypes:
              - public.plain-text
        UTExportedTypeDeclarations:
          - UTTypeConformsTo:
              - com.apple.package
            UTTypeDescription: Imprint Document
            UTTypeIdentifier: com.imbib.imprint.document
            UTTypeTagSpecification:
              public.filename-extension:
                - imprint
          - UTTypeConformsTo:
              - public.data
            UTTypeDescription: Impress Document Reference
            UTTypeIdentifier: com.impress.document-reference
            UTTypeTagSpecification: {}
        UTImportedTypeDeclarations:
          - UTTypeConformsTo:
              - public.data
            UTTypeDescription: Impress Paper Reference
            UTTypeIdentifier: com.impress.paper-reference
            UTTypeTagSpecification: {}
          - UTTypeConformsTo:
              - public.data
            UTTypeDescription: Impress Figure Reference
            UTTypeIdentifier: com.impress.figure-reference
            UTTypeTagSpecification: {}
          - UTTypeConformsTo:
              - public.data
            UTTypeDescription: Impress Veusz Plot Reference
            UTTypeIdentifier: com.impress.veusz-plot-reference
            UTTypeTagSpecification: {}
          - UTTypeConformsTo:
              - public.data
              - public.plain-text
            UTTypeDescription: Veusz Plot
            UTTypeIdentifier: org.veusz.document
            UTTypeTagSpecification:
              public.filename-extension:
                - vsz
    entitlements:
      path: imprint-iOS/imprint-iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.imbib.shared
          - group.com.impress.suite
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.imbib.shared
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.imbib.shared

  imprint-ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: imprint-ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imbib.imprint.share-extension
        # Override the project-wide PRODUCT_NAME=imprint — otherwise this
        # target and imprint-iOS both emit imprint.swiftmodule into the same
        # simulator products dir ("Multiple commands produce" build failure).
        PRODUCT_NAME: imprint-ShareExtension
        PRODUCT_MODULE_NAME: ImprintShareExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: imprint-ShareExtension/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - sdk: UIKit.framework
      - sdk: UniformTypeIdentifiers.framework
    info:
      path: imprint-ShareExtension/Info.plist
      # These MUST live here — xcodegen regenerates Info.plist from this
      # block, so hand-edits to the file are wiped on every `xcodegen
      # generate`. Without NSExtension + CFBundleDisplayName installd
      # rejects the whole host app ("Failed to create app extension
      # placeholder", "does not have a CFBundleDisplayName").
      properties:
        CFBundleDisplayName: imprint
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsFileWithMaxCount: 1
    entitlements:
      path: imprint-ShareExtension/imprint-ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.impress.suite

  imprint-iOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: imprint-iOSTests
    dependencies:
      - target: imprint-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imbib.imprint.iostests
        PRODUCT_NAME: imprint-iOSTests
        PRODUCT_MODULE_NAME: imprintiOSTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  imprint:
    build:
      targets:
        imprint: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - imprintTests
        - imprintUITests
    profile:
      config: Release
    archive:
      config: Release

  imprint-iOS:
    build:
      targets:
        imprint-iOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - imprint-iOSTests
    profile:
      config: Release
    archive:
      config: Release
