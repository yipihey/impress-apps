    { name = "impress-schema-ref-codegen", git = "https://github.com/yipihey/koine", rev = "3190205ef975e9fdffa1170e24a8570d8df5b717" },
    { name = "impress-service-core", git = "https://github.com/yipihey/koine", rev = "3190205ef975e9fdffa1170e24a8570d8df5b717" },
    { name = "impress-service-macros", git = "https://github.com/yipihey/koine", rev = "3190205ef975e9fdffa1170e24a8570d8df5b717" },
    { name = "impress-settings", git = "https://github.com/yipihey/koine", rev = "3190205ef975e9fdffa1170e24a8570d8df5b717" },
