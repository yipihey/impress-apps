    { name = "koine-store-dir", git = "https://github.com/yipihey/koine", rev = "3190205ef975e9fdffa1170e24a8570d8df5b717" },
    { name = "koine-store-memory", git = "https://github.com/yipihey/koine", rev = "3190205ef975e9fdffa1170e24a8570d8df5b717" },
    { name = "koine-workspace-hack", git = "https://github.com/yipihey/koine", rev = "3190205ef975e9fdffa1170e24a8570d8df5b717" },
