name: imbib - Rust CI

on:
  push:
    branches: [main]
    paths:
      - 'crates/imbib-core/**'
      - 'crates/impress-*/**'
      # Path deps compiled (and linted) as part of the imbib-core gate.
      - 'crates/im-bibtex/**'
      - 'crates/im-identifiers/**'
      - '.github/workflows/imbib-rust.yml'
# pull_request trigger removed 2026-07-28: this lane runs on a self-hosted
# runner and the repo is public — fork PRs must never reach that machine.

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

concurrency:
  group: imbib-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: [self-hosted, impress-mac]
    defaults:
      run:
        working-directory: crates/imbib-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # target/ is NOT round-tripped through actions/cache any more. All four
      # runners are directories on this ONE Mac: actions/checkout deletes the
      # gitignored target/ at job start, the tarball is then downloaded from
      # GitHub and re-uploaded at the end. Measured 15-60 min of "Post Cache"
      # per job against cold builds of a few minutes, three saves per push
      # failing outright on an expired upload token, and a full 10 GB repo quota
      # whose evictions took the xcframework entries with them.
      # A per-runner directory outside the checkout survives `git clean -ffdx`,
      # uploads nothing, and is not subject to the quota. ~/.cargo already
      # persists on this machine and needs no cache step.
      - name: Use a persistent cargo target directory
        run: |
          dir="$HOME/ci-cargo-target/${{ github.workflow }}-${{ github.job }}"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --features native -- -D warnings

      - name: Run tests
        run: cargo test --features native

  # Note: iOS builds are handled via pre-built xcframeworks in the app project.
  # Cross-compiling with the native feature requires special TLS configuration.

  generate-bindings:
    name: Generate Swift Bindings
    runs-on: [self-hosted, impress-mac]
    defaults:
      run:
        working-directory: crates/imbib-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # target/ is NOT round-tripped through actions/cache any more. All four
      # runners are directories on this ONE Mac: actions/checkout deletes the
      # gitignored target/ at job start, the tarball is then downloaded from
      # GitHub and re-uploaded at the end. Measured 15-60 min of "Post Cache"
      # per job against cold builds of a few minutes, three saves per push
      # failing outright on an expired upload token, and a full 10 GB repo quota
      # whose evictions took the xcframework entries with them.
      # A per-runner directory outside the checkout survives `git clean -ffdx`,
      # uploads nothing, and is not subject to the quota. ~/.cargo already
      # persists on this machine and needs no cache step.
      - name: Use a persistent cargo target directory
        run: |
          dir="$HOME/ci-cargo-target/${{ github.workflow }}-${{ github.job }}"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - name: Build library
        run: |
          # Release compile check (lib + bins), as before.
          cargo build --release --features native
          # The FFI crates are crate-type=["lib"] now, so ask explicitly for the
          # staticlib the bindgen step reads (emitting staticlib+cdylib from the
          # shared lib target made every dependent build archive and link them).
          cargo rustc --release --features native --lib --crate-type staticlib

      - name: Generate Swift bindings
        run: |
          # uniffi-bindgen auto-applies swiftformat when it is on PATH.
          # GitHub's hosted macOS images ship it; dev Macs and the self-hosted
          # runner generally don't — so hosted CI produced formatted bindings
          # (`if cond` vs `if (cond)`) that never matched the raw committed
          # file and the staleness guard below cried wolf. Remove it when
          # present (sudo -n: hosted runners have passwordless sudo, the
          # self-hosted runner has neither sudo nor swiftformat).
          if command -v swiftformat >/dev/null 2>&1; then
            sudo -n rm -f "$(command -v swiftformat)" || \
              echo "::warning::swiftformat present but not removable; bindings diff may reformat"
          fi
          mkdir -p generated
          cargo run --release -p uniffi-bindgen -- generate \
            --library "$CARGO_TARGET_DIR/release/libimbib_core.a" \
            --language swift \
            --out-dir generated

      # The bindings committed under apps/imbib/ImbibRustCore/Sources are what
      # the app actually compiles against. If they drift from the Rust, the app
      # still BUILDS and then crashes at launch with a UniFFI checksum
      # mismatch — so a stale commit here is invisible until runtime. Nothing
      # guarded that before; this does.
      - name: Committed Swift bindings match the Rust
        run: |
          # -b -B tolerate pure reformatting: uniffi-bindgen post-processes with
          # swiftformat when it is on PATH and warns-and-skips when it is not, so
          # byte equality depends on the runner's tooling. A method present in the
          # Rust but missing from the committed bindings is not whitespace, so the
          # check that matters still fires.
          if ! diff -u -b -B ../../apps/imbib/ImbibRustCore/Sources/ImbibRustCore/imbib_core.swift \
                             generated/imbib_core.swift; then
            echo "::error::Committed imbib_core.swift is stale."
            echo "Run crates/imbib-core/build-xcframework.sh and commit the result."
            exit 1
          fi

      - name: Upload Swift bindings
        uses: actions/upload-artifact@v4
        with:
          name: swift-bindings
          path: crates/imbib-core/generated/
