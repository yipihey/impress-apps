name: imprint - iOS install smoke (Simulator)

# Split out of imprint-apps.yml on 2026-07-28.
#
# This is the lane that boots a simulator, builds imprint-iOS for it, installs
# the bundle and launches it. It is the only check that can catch an *install*
# rejection — a plain `build` against a generic destination never installs, so
# it cannot see a missing NSExtension or CFBundleDisplayName, which is exactly
# the bug that broke imprint-iOS. Nothing about the check changes here.
#
# What changes is when it runs. Booting a sim + a full iOS build + install +
# launch poll was the slowest thing in CI and it ran on every push, including
# pushes that touched no iOS source at all. Now:
#
#   * nightly, so platform rot still cannot survive a day unnoticed — which was
#     the original reason imprint-apps.yml exists (imprint-iOS went months
#     without compiling because nothing built it);
#   * on demand, for when you are actually working on the install path;
#   * and on any push/PR that touches the iOS target's own sources, the share
#     extension, or project.yml — i.e. its true inputs.
#
# The per-push macOS app build stays in imprint-apps.yml.

on:
  schedule:
    # 09:00 UTC — after the working day on the US west coast, so a red nightly
    # is waiting in the morning rather than mid-session.
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/imprint/imprint-iOS/**'
      - 'apps/imprint/imprint-iOSTests/**'
      - 'apps/imprint/imprint-ShareExtension/**'
      - 'apps/imprint/Shared/**'
      - 'apps/imprint/project.yml'
      - '.github/workflows/imprint-ios-smoke.yml'
# pull_request trigger removed 2026-07-28: this lane runs on a self-hosted
# runner and the repo is public — fork PRs must never reach that machine.

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

concurrency:
  # One run per LANE: repeated pushes collapse to the newest (the older
  # in-progress run is cancelled — freshest signal, least Mac time).
  # Deliberately NOT one machine-wide shared group: GitHub keeps at most
  # one queued run per group, so sibling lanes of the SAME push displace
  # each other and report "cancelled" on the commit (873cbb66: 6 of 8
  # Swift lanes never ran). Machine-wide serialization is the runner's
  # job — each self-hosted runner takes one job at a time.
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  ios-smoke:
    name: imprint-iOS install smoke (Simulator)
    runs-on: [self-hosted, impress-mac]
    steps:
      - uses: actions/checkout@v4

      # `rustup toolchain install stable` (the action's first step) aborts
      # with "failure removing component 'cargo-aarch64-apple-darwin',
      # directory does not exist: 'bin/cargo'" when the toolchain directory
      # is half there. That is what turned this lane red on 2026-09-06: the
      # four runners on this Mac still shared ONE ~/.rustup, and two jobs
      # updating stable at once left it in that state. Each runner has had
      # its own RUSTUP_HOME since 2026-09-07 (`.env`), which removed the
      # race; this step removes the other way in — a job cancelled mid-install
      # — by uninstalling a stable that has no cargo, so the action installs
      # it clean instead of failing to update it.
      - name: Repair a half-installed stable toolchain
        run: |
          tc="${RUSTUP_HOME:-$HOME/.rustup}/toolchains/stable-aarch64-apple-darwin"
          if [ -d "$tc" ] && [ ! -x "$tc/bin/cargo" ]; then
            echo "stable toolchain at $tc has no cargo — removing it for a clean install"
            rustup toolchain uninstall stable || rm -rf "$tc"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      # target/ is NOT round-tripped through actions/cache any more. All four
      # runners are directories on this ONE Mac: actions/checkout deletes the
      # gitignored target/ at job start, the tarball is then downloaded from
      # GitHub and re-uploaded at the end. Measured 15-60 min of "Post Cache"
      # per job against cold builds of a few minutes, three saves per push
      # failing outright on an expired upload token, and a full 10 GB repo quota
      # whose evictions took the xcframework entries with them.
      # A per-runner directory outside the checkout survives `git clean -ffdx`,
      # uploads nothing, and is not subject to the quota. ~/.cargo already
      # persists on this machine and needs no cache step.
      - name: Use a persistent cargo target directory
        run: |
          dir="$HOME/ci-cargo-target/${{ github.workflow }}-${{ github.job }}"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - name: Install xcodegen
        run: brew install xcodegen

      # iOS slices required here, so imprint-core runs with the script's
      # default (multi-platform) slice set.
      - name: ImprintCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: imprint-core

      - name: ImpressStoreFfi.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impress-store-ffi

      - name: ImpressHelix.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impress-helix

      - name: ImbibCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: imbib-core
          env-extra: MACOSX_DEPLOYMENT_TARGET=14.0

      - name: ScixClientCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: scix-client-ffi

      - name: Generate Xcode project
        working-directory: apps/imprint
        run: xcodegen generate

      # Install-smoke: boot a sim, build for it, install, launch. A plain
      # `build` (generic destination) never installs, so it CANNOT catch
      # Info.plist/appex install rejections — exactly the class of bug that
      # broke imprint-iOS install (missing NSExtension/CFBundleDisplayName).
      - name: imprint-iOS install smoke (Simulator)
        working-directory: apps/imprint
        run: |
          set -eo pipefail
          # xcodebuild-accepted destination (simctl's list can disagree with
          # xcodebuild's destination set on CI runners; see imbib-tests.yml).
          UDID=$(xcodebuild -derivedDataPath "$PWD/.ci-derived" -scheme imprint-iOS -showdestinations 2>/dev/null \
            | grep "platform:iOS Simulator" | grep -v placeholder \
            | grep -oE 'id:[0-9A-F-]{36}' | head -1 | cut -c4-)
          echo "sim: $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild -derivedDataPath "$PWD/.ci-derived" -project imprint.xcodeproj -scheme imprint-iOS -configuration Debug \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO build | tail -30
          APP=$(find .ci-derived/Build/Products/Debug-iphonesimulator -maxdepth 1 -name 'imprint.app' | head -1)
          echo "installing $APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.imbib.imprint
          # Poll instead of a single 5s check: first launch on a cold CI
          # runner can be slow, and a crash needs diagnostics, not a bare
          # "did not launch".
          LAUNCHED=0
          for i in 1 2 3 4 5 6; do
            sleep 5
            # NO PIPE into the match, deliberately. `grep -q` exits the instant
            # it matches, which closes the pipe and kills `launchctl` with
            # SIGPIPE (141); `set -o pipefail` above then reports the whole
            # pipeline as failed. A SUCCESSFUL match therefore read as "did not
            # launch", and this lane went red on 2026-09-08 with imprint alive
            # and well in the simulator. It is a race on how much `launchctl
            # list` has left to write when grep quits — latent since this file
            # was written, and lost consistently once the CI simulator had been
            # booted for days and its service list had grown.
            services=$(xcrun simctl spawn "$UDID" launchctl list 2>/dev/null || true)
            case "$services" in
              *com.imbib.imprint*) LAUNCHED=1; break ;;
            esac
          done
          if [ "$LAUNCHED" = "1" ]; then
            echo "imprint-iOS launched OK"
          else
            echo "imprint-iOS did not launch — diagnostics follow"
            echo "=== process log (last 3m) ==="
            xcrun simctl spawn "$UDID" log show --last 3m \
              --predicate 'process == "imprint"' 2>/dev/null | tail -80 || true
            # imprint's OWN crash reports only. The unfiltered listing that
            # used to print here showed whatever had crashed on the host most
            # recently — on a shared CI Mac that is usually some unrelated
            # daemon — directly under a heading that made it look like the
            # cause. It cost two separate investigations before anyone noticed
            # imprint had never crashed at all.
            echo "=== imprint crash reports (none below means imprint did not crash) ==="
            for f in $(ls -t ~/Library/Logs/DiagnosticReports/imprint* 2>/dev/null | head -2); do
              echo "--- $f"; head -60 "$f"
            done
            exit 1
          fi

      # The app this lane launched is a HOST process that outlives the job:
      # the simulator shares the Mac's network namespace, so the launched
      # app's automation server (enabled by default) sat on 23121 for hours
      # after the run and shadowed the DESKTOP app on the same port —
      # `/api/status` answered from the simulator, and host-side verification
      # was reading the wrong app (2026-09-23, a sim imbib up 4½ h on 23120).
      # This is its own `always()` step because the diagnostic branch above
      # `exit 1`s: the failing run was exactly the one that left a listener
      # behind. Shutting the simulator down as well means a launched app that
      # slipped past `terminate` still goes away with its host.
      - name: Terminate and shut down the simulator
        if: always()
        run: |
          xcrun simctl terminate "$UDID" com.imbib.imprint || true
          xcrun simctl shutdown "$UDID" || true
