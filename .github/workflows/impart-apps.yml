name: impart - App Builds (macOS + iOS)

# Guard against platform rot: impart-iOS could not build for months
# (share-extension module collision + iOS-incompatible API use) because
# nothing ever built it. This workflow builds BOTH app targets on every
# change that could affect them.

on:
  push:
    branches: [main]
    paths:
      - 'apps/impart/**'
      - 'crates/impress-store-ffi/**'
      - 'crates/impress-core/**'
      - 'packages/**'
      - '.github/workflows/impart-apps.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/impart/**'
      - 'crates/impress-store-ffi/**'
      - 'crates/impress-core/**'
      - 'packages/**'
      - '.github/workflows/impart-apps.yml'

env:
  # Every Swift lane sets this. The root manifest turns on release-profile
  # incremental for the local loop; on a runner it only writes gigabytes of
  # incremental state onto a 14 GB disk that is thrown away afterwards.
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build-apps:
    name: Build impart (macOS + iOS Simulator)
    # HOSTED on purpose, and the only Swift app lane that is: it is also the
    # only one with a pull_request trigger. The repo is public, so a fork PR
    # must never reach the self-hosted Mac (the rule every other lane
    # documents). The price is that this runner starts with nothing: every
    # xcframework the package graph declares has to be built or restored here.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 only. macos-latest is Apple Silicon and the simulator it boots is
      # arm64, so x86_64 slices would be built, cached and never linked — two
      # of every framework's five slices. IMPRESS_SKIP_X86=1 below and
      # ARCHS=arm64 in both xcodebuild calls are the same decision.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim

      # No target/ cache. It used to be round-tripped here keyed on Cargo.lock,
      # which for five release builds is several GB of tarball against a 10 GB
      # repo quota that is already full and already evicting the xcframework
      # entries. The xcframework action below caches the OUTPUTS instead, which
      # is what lets a Swift-only PR skip the Rust entirely.

      - name: Install xcodegen
        run: brew install xcodegen

      # impart links PublicationManagerCore on both platforms, and PMC drags in
      # four Rust cores on top of impart's own ImpressRustCore. Every one is a
      # gitignored local binaryTarget, and package resolution walks the whole
      # graph before building anything, so ONE missing artifact fails the lane
      # at "Could not resolve package dependencies" — which is how this lane
      # failed on every PR for weeks before 2026-09-24 while it built only
      # ImpressStoreFfi, and was waved through as "base-red". The set matches
      # impart-tests.yml's; FULL iOS slices because the smoke below builds
      # impart-iOS.
      - name: ImpressStoreFfi.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impress-store-ffi
          env-extra: IMPRESS_SKIP_X86=1

      - name: ImbibCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: imbib-core
          env-extra: IMPRESS_SKIP_X86=1 MACOSX_DEPLOYMENT_TARGET=14.0

      - name: ScixClientCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: scix-client-ffi
          env-extra: IMPRESS_SKIP_X86=1

      - name: ImpressHelix.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impress-helix
          env-extra: IMPRESS_SKIP_X86=1

      - name: ImprintCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: imprint-core
          env-extra: IMPRESS_SKIP_X86=1

      # The hosted image has ~14 GB free and imprint-core's release target
      # alone is several GB, so record the headroom: when this lane next fails
      # for space, the number is already in the log.
      - name: Disk after Rust
        run: df -h "$GITHUB_WORKSPACE" && du -sh target 2>/dev/null || true

      - name: Generate Xcode project
        working-directory: apps/impart
        run: xcodegen generate

      # tee + grep on failure: `tail -50` alone keeps xcodebuild's summary of
      # WHICH files failed and drops every `error:` line saying why.
      - name: Build impart (macOS)
        working-directory: apps/impart
        run: |
          set -o pipefail
          xcodebuild -project impart.xcodeproj \
            -scheme impart \
            -configuration Debug \
            -destination 'platform=macOS' \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build-output-macos.txt | tail -50 \
          || { echo "::group::compiler errors"; grep -E '(error|fatal error):' build-output-macos.txt | sort -u | head -60; echo "::endgroup::"; exit 1; }

      # Install-smoke: boot a sim, build for it, install, launch. A plain
      # `build` (generic destination) never installs, so it CANNOT catch
      # Info.plist/appex install rejections — the class of bug that broke
      # imprint-iOS install (missing NSExtension/CFBundleDisplayName),
      # which impart-ShareExtension also had.
      - name: impart-iOS install smoke (Simulator)
        working-directory: apps/impart
        run: |
          set -eo pipefail
          UDID=$(xcrun simctl list devices available | grep -oE 'iPad Pro[^(]*\(([0-9A-F-]+)\)' | grep -oE '[0-9A-F-]{36}' | head -1)
          [ -z "$UDID" ] && UDID=$(xcrun simctl list devices available | grep -oE '\(([0-9A-F-]{36})\)' | grep -oE '[0-9A-F-]{36}' | head -1)
          echo "sim: $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild -project impart.xcodeproj -scheme impart-iOS -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build-ios \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-output-ios.txt | tail -30 \
            || { echo "::group::compiler errors"; grep -E '(error|fatal error):' build-output-ios.txt | sort -u | head -60; echo "::endgroup::"; exit 1; }
          APP=$(find build-ios/Build/Products/Debug-iphonesimulator -maxdepth 1 -name 'impart.app' | head -1)
          echo "installing $APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.imbib.impart
          sleep 5
          xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q "com.imbib.impart" \
            && echo "impart-iOS launched OK" \
            || (echo "impart-iOS did not launch" && exit 1)

      # The app this lane launched is a HOST process that outlives the job:
      # the simulator shares the Mac's network namespace, so the launched
      # app's automation server (enabled by default) sat on 23122 for hours
      # after the run and shadowed the DESKTOP app on the same port —
      # `/api/status` answered from the simulator, and host-side verification
      # was reading the wrong app (2026-09-23, a sim imbib up 4½ h on 23120).
      # This is its own `always()` step because the diagnostic branch above
      # `exit 1`s: the failing run was exactly the one that left a listener
      # behind. Shutting the simulator down as well means a launched app that
      # slipped past `terminate` still goes away with its host.
      - name: Terminate and shut down the simulator
        if: always()
        run: |
          xcrun simctl terminate "$UDID" com.imbib.impart || true
          xcrun simctl shutdown "$UDID" || true
