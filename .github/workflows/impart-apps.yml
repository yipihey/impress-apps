name: impart - App Builds (macOS + iOS)

# Guard against platform rot: impart-iOS could not build for months
# (share-extension module collision + iOS-incompatible API use) because
# nothing ever built it. This workflow builds BOTH app targets on every
# change that could affect them.

on:
  push:
    branches: [main]
    paths:
      - 'apps/impart/**'
      - 'apps/chassis-utis.yml'
      # Everything impart's package graph resolves outside apps/impart:
      # both targets link PublicationManagerCore, which reaches imbib's and
      # imprint's Swift cores and their committed bindings. A PMC-only PR
      # changes what this lane compiles without touching apps/impart.
      - 'apps/imbib/PublicationManagerCore/**'
      - 'apps/imbib/ImbibRustCore/**'
      - 'apps/imbib/ImbibVerbsFFI/**'
      - 'apps/imprint/Packages/ImprintCore/**'
      - 'apps/imprint/ImprintRustCore/**'
      - 'packages/**'
      # All of crates/, not a list. The frameworks below reach many crate
      # directories between them (their --all-features path closure, the same
      # set the xcframework action hashes into each cache key), and an
      # enumeration here would drift the first time one gains a dependency.
      # Over-triggering is cheap: a crate outside every closure leaves the
      # keys unchanged, so only the Swift build runs.
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'schema-refs.json'
      - '.cargo/**'
      - '.github/actions/xcframework/**'
      - '.github/workflows/impart-apps.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/impart/**'
      - 'apps/chassis-utis.yml'
      # Everything impart's package graph resolves outside apps/impart:
      # both targets link PublicationManagerCore, which reaches imbib's and
      # imprint's Swift cores and their committed bindings. A PMC-only PR
      # changes what this lane compiles without touching apps/impart.
      - 'apps/imbib/PublicationManagerCore/**'
      - 'apps/imbib/ImbibRustCore/**'
      - 'apps/imbib/ImbibVerbsFFI/**'
      - 'apps/imprint/Packages/ImprintCore/**'
      - 'apps/imprint/ImprintRustCore/**'
      - 'packages/**'
      # All of crates/, not a list. The frameworks below reach many crate
      # directories between them (their --all-features path closure, the same
      # set the xcframework action hashes into each cache key), and an
      # enumeration here would drift the first time one gains a dependency.
      # Over-triggering is cheap: a crate outside every closure leaves the
      # keys unchanged, so only the Swift build runs.
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'schema-refs.json'
      - '.cargo/**'
      - '.github/actions/xcframework/**'
      - '.github/workflows/impart-apps.yml'

env:
  # Every Swift lane sets this. The root manifest turns on release-profile
  # incremental for the local loop; on a runner it only writes gigabytes of
  # incremental state onto a 14 GB disk that is thrown away afterwards.
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # No CARGO_PROFILE_RELEASE_STRIP override. Under rustc 1.97.1 the xcode-27
  # image (macOS 27) could not read back a proc-macro dylib after release's
  # default strip=debuginfo ("can't find crate for `zerofrom_derive`", runs
  # 36047933967, 36049515666), so this lane turned stripping off. 1.98.1
  # does not have the problem, and rust-toolchain.toml pins it.

# A newer push to the same PR makes the running one worthless, and on the
# self-hosted Mac it holds one of four runners for twenty minutes. main keeps
# every run: each one is a post-merge signal for its own commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-apps:
    # The job name is the required check; keep it whichever runner it lands on.
    name: Build impart (macOS + iOS Simulator)
    # SELF-HOSTED for pushes to main and for pull requests from branches of
    # this repository; HOSTED (xcode-27) for pull requests from forks.
    #
    # It was hosted for everything until 2026-10-14 and took 1h45-2h on almost
    # every run (docs/build-machine-hygiene.md § "The impart lane"). The
    # xcframework cache key was not the problem: it is already scoped to each
    # crate's closure, and the closure of five of the seven frameworks includes
    # impress-core, koine (a git dependency bumped by most PRs) and the hakari
    # workspace-hack, so nearly every PR is a genuine miss. A miss on a hosted
    # runner is a cold release build of ~600-900 crates per slice
    # (ImpressStoreFfi alone: 33-35 min). The same miss on the self-hosted Mac,
    # with its warm per-runner target dir, is 5-6 min. PR-scoped actions/cache
    # entries were also invisible to main, so the post-merge push rebuilt the
    # exact keys its PR had just built; the runner's local store is not scoped
    # by ref, so a merged PR's frameworks are there for main and for the other
    # lanes.
    #
    # Fork PRs stay hosted because the repo is public: code from a fork must
    # never run on the build Mac. `head.repo.full_name` comes from the event
    # payload, which a fork cannot set. A branch of this repository can only be
    # pushed by someone who can already push to main, which runs every other
    # self-hosted lane. (A fork can still edit this file in its own PR; what
    # stops that is the repository's approval policy for outside contributors,
    # "all_external_contributors" as of 2026-10-14, not this expression.)
    #
    # Hosted: xcode-27, not macos-latest. macos-latest's newest Xcode is 26.6,
    # whose type checker gives up on SectionContentView.swift:462 ("unable to
    # type-check this expression in reasonable time"). xcode-27 is GitHub's
    # hosted image for that toolchain (runner-images#14404).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","impress-mac"]') || 'xcode-27' }}
    env:
      # The impart target's Debug post-build phase installs into
      # ~/Applications; on the build Mac that is the developer's own copy.
      # CODE_SIGNING_ALLOWED=NO already skips it; this says so explicitly.
      IMPRESS_SKIP_INSTALL: 1
    steps:
      - uses: actions/checkout@v4

      # Hosted: PINNED to 27.0 (27A266a), the exact build the self-hosted Mac
      # has. On the hosted image latest-stable picks 27.1, installed as
      # Xcode_27.1_beta.app, and under it every Rust build died before
      # compiling a line of ours: "can't find crate for `zerofrom_derive`"
      # (run 36047933967). Self-hosted: latest-stable, like every other lane
      # on that Mac. Move the pin with the Mac.
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ runner.environment == 'self-hosted' && 'latest-stable' || '27.0' }}

      # The arm64-only decision below is only right on Apple Silicon; fail
      # loudly if the label ever lands on an Intel image instead of producing
      # frameworks the build cannot link.
      - name: Runner is arm64
        run: |
          uname -m; xcodebuild -version
          [ "$(uname -m)" = "arm64" ]

      # Hosted: arm64 only. The runner is Apple Silicon and the simulator it
      # boots is arm64, so x86_64 slices would be built, cached and never
      # linked — two of every framework's five slices. IMPRESS_SKIP_X86=1 below
      # and ARCHS=arm64 in both xcodebuild calls are the same decision.
      #
      # Self-hosted: every slice, because that is the variant every other lane
      # on the Mac builds (impart-tests.yml's iOS job uses exactly this set).
      # The runner's xcframework store is keyed by variant, so matching it
      # means a PR's build is the entry main's lanes restore after the merge,
      # and theirs is the one this lane restores. The two x86_64 slices cost a
      # few minutes against a target dir that already holds them.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.environment == 'self-hosted' && 'aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim' || 'aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim' }}

      # Hosted: no target/ cache. It used to be round-tripped here keyed on
      # Cargo.lock, which for five release builds is several GB of tarball
      # against a 10 GB repo quota that is already full (11.2 GB of entries on
      # 2026-10-14) and already evicting the xcframework entries. The
      # xcframework action below caches the OUTPUTS instead, which is what lets
      # a Swift-only PR skip the Rust entirely.
      #
      # Self-hosted: the runner's own bounded target dir, as in every lane there.
      - name: Use a persistent cargo target directory
        if: runner.environment == 'self-hosted'
        run: ./scripts/ci-cargo-target.sh >> "$GITHUB_ENV"   # one bounded dir per runner

      - name: Install xcodegen
        run: brew install xcodegen

      # impart links PublicationManagerCore on both platforms, and PMC drags in
      # sibling Rust cores on top of impart's own ImpressRustCore. Every one is a
      # gitignored local binaryTarget, and package resolution walks the whole
      # graph before building anything, so ONE missing artifact fails the lane
      # at "Could not resolve package dependencies" — which is how this lane
      # failed on every PR for weeks before 2026-09-24 while it built only
      # ImpressStoreFfi, and was waved through as "base-red". The set matches
      # impart-tests.yml's; FULL iOS slices because the smoke below builds
      # impart-iOS.
      #
      # env-extra is written `hosted && X || Y`, never `self-hosted && '' || X`:
      # '' is falsy in an expression, so the second form always yields X.
      - name: ImpressStoreFfi.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impress-store-ffi
          env-extra: ${{ runner.environment != 'self-hosted' && 'IMPRESS_SKIP_X86=1' || '' }}

      - name: ImbibCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: imbib-core
          env-extra: ${{ runner.environment != 'self-hosted' && 'IMPRESS_SKIP_X86=1 MACOSX_DEPLOYMENT_TARGET=14.0' || 'MACOSX_DEPLOYMENT_TARGET=14.0' }}

      - name: ImbibVerbsFfi.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: imbib-verbs-ffi
          env-extra: ${{ runner.environment != 'self-hosted' && 'IMPRESS_SKIP_X86=1 MACOSX_DEPLOYMENT_TARGET=14.0' || 'MACOSX_DEPLOYMENT_TARGET=14.0' }}

      # MessageManagerCore imports ImpartVerbsFFI on both platforms.
      - name: ImpartVerbsFfi.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impart-verbs-ffi
          env-extra: ${{ runner.environment != 'self-hosted' && 'IMPRESS_SKIP_X86=1' || '' }}

      - name: ScixClientCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: scix-client-ffi
          env-extra: ${{ runner.environment != 'self-hosted' && 'IMPRESS_SKIP_X86=1' || '' }}

      - name: ImpressHelix.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impress-helix
          env-extra: ${{ runner.environment != 'self-hosted' && 'IMPRESS_SKIP_X86=1' || '' }}

      - name: ImprintCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: imprint-core
          env-extra: ${{ runner.environment != 'self-hosted' && 'IMPRESS_SKIP_X86=1' || '' }}

      # Record the headroom so a space failure never has to be guessed at. The
      # first full build (run 36037604487) left target/ at 8.9 GB with 83 GiB
      # still free on macos-26-arm64.
      # Self-hosted: df only. The target dir there is the runner's shared one,
      # tens of GB that `du` would spend minutes walking.
      - name: Disk after Rust
        run: |
          df -h "$GITHUB_WORKSPACE"
          if [ "$RUNNER_ENVIRONMENT" != "self-hosted" ]; then du -sh target 2>/dev/null || true; fi

      # Booted here, before either Swift build, so the 20-25 s a fresh device
      # takes to boot overlaps the macOS build instead of preceding the iOS
      # one. `simctl boot` returns once the boot has started; the smoke step
      # waits for it with `bootstatus -b`.
      - name: Boot a simulator
        run: |
          set -eo pipefail
          DEVICES=$(xcrun simctl list devices available)
          UDID=""
          # Self-hosted: a throwaway device of our own, deleted in the cleanup
          # step. The Mac's device set is shared by four runners and the
          # developer; picking an existing device let two lanes boot the same
          # one, and whichever finished first shut it down under the other.
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            # The type of an iPhone the newest iOS runtime already pairs with:
            # the newest device TYPE may need a runtime this Mac does not have.
            PAIR=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          rts = sorted((k for k in d if ".iOS-" in k), reverse=True,
                       key=lambda k: [int(x) for x in k.rsplit(".iOS-", 1)[1].split("-")])
          for rt in rts:
              for dev in d[rt]:
                  if ".iPhone-" in dev.get("deviceTypeIdentifier", ""):
                      print(dev["deviceTypeIdentifier"], rt); sys.exit()
          ' || true)
            TYPE=${PAIR% *}; RUNTIME=${PAIR#* }
            if [ -n "$PAIR" ]; then
              UDID=$(xcrun simctl create "ci-impart-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$TYPE" "$RUNTIME" || true)
              if [ -n "$UDID" ]; then echo "CREATED_SIM=1" >> "$GITHUB_ENV"; fi
            fi
            DEVICES=$(xcrun simctl list devices available)
          fi
          # `|| true` on each lookup: under pipefail a grep with no match
          # killed the step on the FIRST line, so the fallback never ran and
          # the step died silently — which it did on the xcode-27 image, whose
          # device set has no iPad Pro.
          [ -n "$UDID" ] || UDID=$(echo "$DEVICES" | grep -E 'iPad Pro' | grep -oE '[0-9A-F-]{36}' | head -1 || true)
          [ -n "$UDID" ] || UDID=$(echo "$DEVICES" | grep -E 'iPhone|iPad' | grep -oE '[0-9A-F-]{36}' | head -1 || true)
          if [ -z "$UDID" ]; then
            echo "::error::no available iOS simulator on this image"
            echo "$DEVICES"; xcrun simctl list runtimes
            exit 1
          fi
          echo "sim: $UDID ($(echo "$DEVICES" | grep "$UDID" | sed -E 's/^ +//'))"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true

      # Self-hosted: a DerivedData dir per runner that survives the checkout's
      # clean, so Xcode rebuilds only what changed (scripts/ci-derived-data.sh;
      # the default location on the build Mac is the developer's own
      # DerivedData). Hosted: inside the checkout, a VM that is discarded.
      # Both Swift builds share it: they compile the same packages for two
      # platforms, and one dir keeps one package resolution.
      - name: DerivedData location
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            DERIVED=$(./scripts/ci-derived-data.sh impart-apps)
          else
            DERIVED="$GITHUB_WORKSPACE/apps/impart/.ci-derived"
          fi
          echo "DERIVED=$DERIVED" >> "$GITHUB_ENV"
          echo "DerivedData: $DERIVED"

      - name: Generate Xcode project
        working-directory: apps/impart
        run: xcodegen generate

      # tee + grep on failure: `tail -50` alone keeps xcodebuild's summary of
      # WHICH files failed and drops every `error:` line saying why.
      - name: Build impart (macOS)
        working-directory: apps/impart
        run: |
          set -o pipefail
          xcodebuild -project impart.xcodeproj -derivedDataPath "$DERIVED" \
            -scheme impart \
            -configuration Debug \
            -destination 'platform=macOS' \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build-output-macos.txt | tail -50 \
          || { echo "::group::compiler errors"; grep -E '(error|fatal error):' build-output-macos.txt | sort -u | head -60; echo "::endgroup::"; exit 1; }

      # Install-smoke: build for the booted sim, install, launch. A plain
      # `build` (generic destination) never installs, so it CANNOT catch
      # Info.plist/appex install rejections — the class of bug that broke
      # imprint-iOS install (missing NSExtension/CFBundleDisplayName),
      # which impart-ShareExtension also had.
      - name: impart-iOS install smoke (Simulator)
        working-directory: apps/impart
        run: |
          set -eo pipefail
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild -project impart.xcodeproj -scheme impart-iOS -configuration Debug \
            -destination "id=$UDID" -derivedDataPath "$DERIVED" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-output-ios.txt | tail -30 \
            || { echo "::group::compiler errors"; grep -E '(error|fatal error):' build-output-ios.txt | sort -u | head -60; echo "::endgroup::"; exit 1; }
          APP=$(find "$DERIVED/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name 'impart.app' | head -1)
          echo "installing $APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.imbib.impart
          sleep 5
          # Read the complete process list before matching it. Under pipefail,
          # grep -q can close the pipe early and turn a successful match into
          # an upstream SIGPIPE failure.
          xcrun simctl spawn "$UDID" launchctl list > launchctl-list.txt
          if grep -Fq "com.imbib.impart" launchctl-list.txt; then
            echo "impart-iOS launched OK"
          else
            cat launchctl-list.txt
            echo "impart-iOS did not remain running"
            exit 1
          fi

      # The app this lane launched is a HOST process that outlives the job:
      # the simulator shares the Mac's network namespace, so the launched
      # app's automation server (enabled by default) sat on 23122 for hours
      # after the run and shadowed the DESKTOP app on the same port —
      # `/api/status` answered from the simulator, and host-side verification
      # was reading the wrong app (2026-09-23, a sim imbib up 4½ h on 23120).
      # This is its own `always()` step because the diagnostic branch above
      # `exit 1`s: the failing run was exactly the one that left a listener
      # behind. Shutting the simulator down as well means a launched app that
      # slipped past `terminate` still goes away with its host.
      - name: Terminate and shut down the simulator
        if: always()
        run: |
          [ -n "${UDID:-}" ] || exit 0
          xcrun simctl terminate "$UDID" com.imbib.impart || true
          xcrun simctl shutdown "$UDID" || true
          if [ "${CREATED_SIM:-}" = "1" ]; then xcrun simctl delete "$UDID" || true; fi
