name: impel - Rust CI

on:
  push:
    branches: [main]
    paths:
      - 'crates/impel-core/**'
      - 'crates/impel-server/**'
      - 'crates/impel-tools/**'
      - 'crates/impress-*/**'
      - 'apps/impel-tui/**'
      - '.github/workflows/impel-rust.yml'
# pull_request trigger removed 2026-07-28: this lane runs on a self-hosted
# runner and the repo is public — fork PRs must never reach that machine.
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

concurrency:
  group: impel-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-core:
    name: Test impel-core
    runs-on: [self-hosted, impress-mac]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # target/ is NOT round-tripped through actions/cache any more. All four
      # runners are directories on this ONE Mac: actions/checkout deletes the
      # gitignored target/ at job start, the tarball is then downloaded from
      # GitHub and re-uploaded at the end. Measured 15-60 min of "Post Cache"
      # per job against cold builds of a few minutes, three saves per push
      # failing outright on an expired upload token, and a full 10 GB repo quota
      # whose evictions took the xcframework entries with them.
      # A per-runner directory outside the checkout survives `git clean -ffdx`,
      # uploads nothing, and is not subject to the quota. ~/.cargo already
      # persists on this machine and needs no cache step.
      - name: Use a persistent cargo target directory
        run: |
          dir="$HOME/ci-cargo-target/${{ github.workflow }}-${{ github.job }}"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - name: Check formatting
        run: cargo fmt -p impel-core --check

      - name: Clippy (default features)
        run: cargo clippy -p impel-core -- -D warnings

      - name: Clippy (with sqlite)
        run: cargo clippy -p impel-core --features sqlite -- -D warnings

      - name: Run tests
        run: cargo test -p impel-core

      - name: Run tests (with sqlite)
        run: cargo test -p impel-core --features sqlite

      # impel-tools projects the #[impress_service] inventory into impel's
      # agent loop. Its tests assert the inventory is actually linked in, so
      # this lane catches a service crate dropping out of the dependency graph
      # — which would silently shrink the agent's tool surface.
      - name: Check formatting (impel-tools)
        run: cargo fmt -p impel-tools --check

      - name: Clippy (impel-tools)
        run: cargo clippy -p impel-tools -- -D warnings

      - name: Run tests (impel-tools)
        run: cargo test -p impel-tools

  test-tui:
    name: Test impel-tui
    runs-on: [self-hosted, impress-mac]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # target/ is NOT round-tripped through actions/cache any more. All four
      # runners are directories on this ONE Mac: actions/checkout deletes the
      # gitignored target/ at job start, the tarball is then downloaded from
      # GitHub and re-uploaded at the end. Measured 15-60 min of "Post Cache"
      # per job against cold builds of a few minutes, three saves per push
      # failing outright on an expired upload token, and a full 10 GB repo quota
      # whose evictions took the xcframework entries with them.
      # A per-runner directory outside the checkout survives `git clean -ffdx`,
      # uploads nothing, and is not subject to the quota. ~/.cargo already
      # persists on this machine and needs no cache step.
      - name: Use a persistent cargo target directory
        run: |
          dir="$HOME/ci-cargo-target/${{ github.workflow }}-${{ github.job }}"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - name: Check formatting
        run: cargo fmt -p impel-tui --check

      - name: Clippy
        run: cargo clippy -p impel-tui -- -D warnings

      - name: Build
        run: cargo build -p impel-tui

  test-server:
    name: Test impel-server
    runs-on: [self-hosted, impress-mac]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # target/ is NOT round-tripped through actions/cache any more. All four
      # runners are directories on this ONE Mac: actions/checkout deletes the
      # gitignored target/ at job start, the tarball is then downloaded from
      # GitHub and re-uploaded at the end. Measured 15-60 min of "Post Cache"
      # per job against cold builds of a few minutes, three saves per push
      # failing outright on an expired upload token, and a full 10 GB repo quota
      # whose evictions took the xcframework entries with them.
      # A per-runner directory outside the checkout survives `git clean -ffdx`,
      # uploads nothing, and is not subject to the quota. ~/.cargo already
      # persists on this machine and needs no cache step.
      - name: Use a persistent cargo target directory
        run: |
          dir="$HOME/ci-cargo-target/${{ github.workflow }}-${{ github.job }}"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - name: Check formatting
        run: cargo fmt -p impel-server --check

      - name: Clippy
        run: cargo clippy -p impel-server -- -D warnings

      - name: Build library
        run: cargo build -p impel-server

  generate-bindings:
    name: Generate Swift Bindings
    runs-on: [self-hosted, impress-mac]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # target/ is NOT round-tripped through actions/cache any more. All four
      # runners are directories on this ONE Mac: actions/checkout deletes the
      # gitignored target/ at job start, the tarball is then downloaded from
      # GitHub and re-uploaded at the end. Measured 15-60 min of "Post Cache"
      # per job against cold builds of a few minutes, three saves per push
      # failing outright on an expired upload token, and a full 10 GB repo quota
      # whose evictions took the xcframework entries with them.
      # A per-runner directory outside the checkout survives `git clean -ffdx`,
      # uploads nothing, and is not subject to the quota. ~/.cargo already
      # persists on this machine and needs no cache step.
      - name: Use a persistent cargo target directory
        run: |
          dir="$HOME/ci-cargo-target/${{ github.workflow }}-${{ github.job }}"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - name: Build library with UniFFI
        run: |
          # Release compile check, then the staticlib the bindgen step reads.
          cargo build -p impel-core --release --features native
          cargo rustc -p impel-core --release --features native --lib --crate-type staticlib

      - name: Generate Swift bindings
        run: |
          mkdir -p crates/impel-core/generated
          cargo run --release -p uniffi-bindgen -- generate \
            --library "$CARGO_TARGET_DIR/release/libimpel_core.a" \
            --language swift \
            --out-dir crates/impel-core/generated

      - name: Upload Swift bindings
        uses: actions/upload-artifact@v4
        with:
          name: impel-swift-bindings
          path: crates/impel-core/generated/

      # The steps above generate impel-core's bindings, which are an artifact
      # and nothing else — impel commits no impel_core.swift. The binding the
      # app actually compiles against is impel-tools', under CounselEngine, and
      # until now nothing checked it. impel-tools has no features and links the
      # service crates purely to populate the inventory.
      #
      # It is NOT a plain `cargo build`, for the same three reasons the
      # impel-core steps above are shaped the way they are, and all three were
      # introduced by 95d4c69 after this step was written:
      #
      #   * `crate-type = ["lib"]` (impel-tools/Cargo.toml). A plain build
      #     emits an rlib and no `libimpel_tools.dylib` — the staticlib the
      #     bindgen step reads is produced on demand by `cargo rustc --lib
      #     --crate-type staticlib`, exactly as build-xcframework.sh does it.
      #   * There is no `uniffi-bindgen` bin in impel-tools; the per-crate
      #     copies were replaced by the one `crates/uniffi-bindgen`.
      #   * Every job in this file redirects CARGO_TARGET_DIR to
      #     $HOME/ci-cargo-target, so a workspace-relative `target/` names a
      #     directory nothing writes to.
      - name: Build impel-tools
        run: |
          # Release compile check, then the staticlib the bindgen step reads.
          cargo build -p impel-tools --release
          cargo rustc -p impel-tools --release --lib --crate-type staticlib

      - name: Generate impel-tools Swift bindings
        run: |
          # uniffi-bindgen auto-applies swiftformat when it is on PATH, which
          # reformats the output away from the raw committed form and makes the
          # guard below cry wolf. Remove it when present.
          if command -v swiftformat >/dev/null 2>&1; then
            sudo -n rm -f "$(command -v swiftformat)" || \
              echo "::warning::swiftformat present but not removable; bindings diff may reformat"
          fi
          mkdir -p crates/impel-tools/generated
          cargo run --release -p uniffi-bindgen -- generate \
            --library "$CARGO_TARGET_DIR/release/libimpel_tools.a" \
            --language swift \
            --out-dir crates/impel-tools/generated

      # The cheap name-level lint in uniffi-bindings.yml blocks PRs on a
      # missing export; this full diff additionally catches a changed
      # signature, which moves the UniFFI checksum and crashes at launch.
      - name: Committed Swift bindings match the Rust
        run: |
          # -b -B tolerate pure reformatting (see the swiftformat note above).
          if ! diff -u -b -B \
              apps/impel/Packages/CounselEngine/Sources/ImpelToolsFFI/impel_tools.swift \
              crates/impel-tools/generated/impel_tools.swift; then
            echo "::error::Committed impel_tools.swift is stale."
            echo "Run crates/impel-tools/build-xcframework.sh and commit the result."
            exit 1
          fi
