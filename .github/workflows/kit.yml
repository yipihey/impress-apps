name: kit - the layout + surface kit can leave

# ADR-0033 D7 decided that the layout + surface layer (the "kit") must be able to
# leave this repository as its own package. docs/kit-manifest.md names what the
# kit is. This lane is what keeps that true, so "can leave" is checked on every
# change rather than claimed:
#
#   deps        scripts/check-kit-deps.sh: every kit crate's cargo tree reaches
#               no workspace crate outside the kit, except impress-core's store
#               from the store tier. --self-test first, so a check that can no
#               longer fail does not pass silently.
#   standalone  scripts/check-kit-standalone.sh: the kit crates plus
#               impress-core, copied into a scratch workspace with nothing else
#               from this repository, pass `cargo check --all-targets`.
#
# HOSTED RUNNERS, deliberately, unlike workspace-rust.yml. This lane has to
# block a pull request: W6's proof is the lane green on its PR, and a kit break
# (a new `impress-core` or domain-core edge) is only cheap to fix before it
# merges. Every self-hosted lane here is push-only, because the repo is public
# and fork PRs must never reach that machine (pull_request trigger removed
# 2026-07-28), so a self-hosted kit lane could only report after the merge.
# Hosted runners are free for a public repo and take fork PRs safely. The cost is
# a cold build every run: the 10 GB actions/cache quota was full on 2026-09-11,
# so nothing is cached, and the persistent-target-dir step the self-hosted lanes
# use has no hosted equivalent. The standalone build is the kit and impress-core
# only (~50 s cold on an M-series Mac, a few minutes on a hosted one). No
# half-installed-toolchain repair either: that step exists for the shared
# ~/.rustup on the self-hosted Mac, and a hosted VM starts clean.
#
# The toolchain is rust-toolchain.toml's pin (1.98.1). rustup resolves it on
# the first cargo call in the checkout, the same way it does locally.

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/config.toml'
      - 'scripts/check-kit-*.sh'
      - 'docs/kit-manifest.md'
      - 'packages/ImpressLayout/**'
      - 'packages/ImpressSurface/**'
      - 'packages/ImpressRustCore/**'
      - '.github/workflows/kit.yml'
  pull_request:
    branches: [main]
    # The same list as push, spelled twice rather than through a YAML anchor.
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/config.toml'
      - 'scripts/check-kit-*.sh'
      - 'docs/kit-manifest.md'
      - 'packages/ImpressLayout/**'
      - 'packages/ImpressSurface/**'
      - 'packages/ImpressRustCore/**'
      - '.github/workflows/kit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kit-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  deps:
    name: Kit crates reach only the kit and impress-core's store
    # cargo tree builds nothing, and `--target all` makes the answer the same
    # on Linux as on a Mac, so the cheapest runner will do.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Classifier self-test
        run: ./scripts/check-kit-deps.sh --self-test

      - name: Kit dependency line (ADR-0033 D7)
        run: ./scripts/check-kit-deps.sh --strict

  standalone:
    name: Kit builds without the rest of the repository
    # macOS, because that is where the kit ships and where the script is run
    # locally, so a green here means what a green there means.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Kit plus impress-core in a scratch workspace
        run: ./scripts/check-kit-standalone.sh --strict

  packages:
    name: Kit Swift packages depend only on kit-grade packages
    # The manifests are parsed as text, like check-chassis-deps.sh, so no Swift
    # toolchain and no xcframework are needed and the cheapest runner will do.
    # BUILDING packages/ImpressLayout needs ImpressRustCore's xcframework, which
    # is a Rust build of impress-store-ffi; that happens on the self-hosted
    # impress-app lane (push-only), which also runs this script.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ImpressLayout + ImpressSurface stay kit-grade (ADR-0033 D7)
        run: ./scripts/check-kit-packages.sh
