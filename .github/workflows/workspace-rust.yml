name: workspace - Rust CI

# The floor under every other Rust workflow.
#
# Each app's workflow scopes clippy to that app's core crate — imbib-rust.yml
# runs from `crates/imbib-core`, imprint-rust.yml from `crates/imprint-core`.
# That leaves real gaps between them, and things lived in those gaps for months:
#
#   * `impart-core` did not compile at all with `--features native`. A crate-root
#     `pub use types::Address` shadowed the `pub use ffi_types::*` glob, so the
#     UDL scaffolding resolved the wrong `Address`. No gate ever built it.
#   * `impress-tags` carried a `uniffi::export` on a function returning a type
#     recursive through `Box<T>`, which UniFFI cannot lower. Never compiled.
#   * Lints in a *dependency's* test target are invisible to an app-scoped gate,
#     because dependencies are built as libs only.
#
# So: one job that selects the whole workspace and enables `native`, which is
# what the apps actually link. The per-app workflows keep their app-specific
# steps (xcframework builds, binding sync, iOS install smoke) — this one only
# guarantees the Rust floor is level everywhere. The floor has a second shape,
# every crate built alone with no features: see the `isolated` job.

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'schema-refs.json'
      - 'scripts/check-schema-refs.sh'
      - 'scripts/clippy-each-crate.sh'
      - '.github/workflows/workspace-rust.yml'
# pull_request trigger removed 2026-07-28: this lane runs on a self-hosted
# runner and the repo is public — fork PRs must never reach that machine.
env:
  CARGO_TERM_COLOR: always
  # Incremental state is per-workspace-member and worth nothing to a CI job that
  # builds once; it was also riding along inside the cached target/ tarballs.
  CARGO_INCREMENTAL: 0

concurrency:
  group: workspace-rust-${{ github.ref }}
  cancel-in-progress: true

# SHARDING (2026-07-31). The campaign push showed the failure mode of one
# monolithic lane: a cold cache turned "Workspace lint" into a ~90-minute job
# while three runners sat idle. The workspace splits on its one natural heavy
# boundary — the imprint tree links Typst + Tectonic, which dominate cold
# compile time — so each half's cold wall-time is roughly half, and with four
# runners the two clippy shards and two test shards run concurrently. The
# shards PARTITION the workspace by construction: `imprint` is an explicit
# `-p` list, `rest` is `--workspace --exclude` of exactly that list, so a new
# crate lands in `rest` automatically and nothing can fall between the gates.
# Feature note: `--features native` with `--workspace` applies per-member
# where defined; the `-p` shard must use the `pkg/feature` spelling instead,
# because a plain `--features native` errors on an explicit package list
# (and only imprint-core HAS one there: imprint-service's features are
# the render engines, proven by a local dry run of both shard commands).
# The shard lists used to be spelled twice here (clippy and test matrices)
# because a matrix cannot read `env:`, with a note to keep the copies
# identical - and a fifth, different spelling lived in CLAUDE.md. They now all
# call scripts/rust-gate.sh, which owns the selection once. A `run:` step can
# call a script even though a matrix cannot read `env:`.

jobs:
  guards:
    name: Guards (fmt + schema refs)
    runs-on: [self-hosted, impress-mac]
    steps:
      - uses: actions/checkout@v4

      # Bash + python3 only, under a second; a schema-ref mismatch is a
      # silently-empty query rather than a compile error — fail fast on it
      # before anything compiles.
      - name: Schema-ref lint
        run: ./scripts/check-schema-refs.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # `--all` because the per-app gates only check their own subtree, and fmt
      # drift between them is the single most common cause of a red main.
      # Needs no cache: fmt does not compile.
      - name: Check formatting
        run: ./scripts/rust-gate.sh fmt

  # The floor's second shape: every crate built ALONE, with no features, which
  # is what a dependent crate and a per-app `cargo test -p` compile. The shards
  # cannot reach it, because cargo unifies features across every package one
  # invocation selects: the shards turn on `native`, and even a featureless
  # `--workspace` build inherits impress-mcp's `imprint-service/typst-render`.
  # So at 536776e9 imprint-service's `not(typst-render)` fallback named a type
  # that only exists with Typst on, both shards stayed green, and imprint-rust
  # (`cargo test -p imprint-service`) and impel-rust (`cargo clippy -p
  # impel-tools`) went red. scripts/clippy-each-crate.sh runs one clippy per
  # crate, lib targets and then all targets; its header says why both.
  isolated:
    name: Clippy (each crate alone, no features)
    runs-on: [self-hosted, impress-mac]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # No actions/cache here: the repo's 10 GB cache quota was already full
      # on 2026-09-11 (10.4 GB active), so another target/ tarball would only
      # evict the shard and xcframework entries. actions/checkout wipes the
      # gitignored target/ at job start, so the build lives outside the
      # checkout instead. Cargo's fingerprints keep it correct across commits;
      # delete the directory to reclaim the space.
      - name: Use a persistent cargo target directory
        run: |
          dir="$HOME/ci-cargo-target/workspace-rust-isolated"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"

      - name: Clippy each crate alone
        run: ./scripts/clippy-each-crate.sh both

  clippy:
    name: Clippy (${{ matrix.shard.name }})
    runs-on: [self-hosted, impress-mac]
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: imprint
          - name: rest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # No actions/cache for target/ here. All four runners are directories on
      # ONE Mac, so the cache round-trip was pure overhead: actions/checkout
      # deletes the gitignored target/ at job start, the tarball is then
      # downloaded from GitHub and re-uploaded at the end. Measured on this
      # workflow: 48s-6m21s of real work against 14-36 minutes of "Post Cache",
      # and three sibling jobs spent an hour each on saves that then FAILED on
      # an expired upload token. The 10 GB repo quota was full, so the shard
      # caches evicted each other and the xcframework entries besides.
      #
      # A per-runner, per-shard directory outside the checkout survives
      # `git clean -ffdx`, costs no upload, and is not subject to the quota.
      # ~/.cargo is already shared and persistent on this machine.
      - name: Use a persistent cargo target directory
        run: |
          dir="$HOME/ci-cargo-target/${{ github.workflow }}-clippy-${{ matrix.shard.name }}"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"

      # `--all-targets` reaches tests and benches; the feature spelling matches
      # what the apps actually link — see the sharding note above.
      - name: Clippy
        run: ./scripts/rust-gate.sh clippy ${{ matrix.shard.name }}

  test:
    name: Tests (${{ matrix.shard.name }})
    runs-on: [self-hosted, impress-mac]
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: imprint
          - name: rest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # No actions/cache for target/ here. All four runners are directories on
      # ONE Mac, so the cache round-trip was pure overhead: actions/checkout
      # deletes the gitignored target/ at job start, the tarball is then
      # downloaded from GitHub and re-uploaded at the end. Measured on this
      # workflow: 48s-6m21s of real work against 14-36 minutes of "Post Cache",
      # and three sibling jobs spent an hour each on saves that then FAILED on
      # an expired upload token. The 10 GB repo quota was full, so the shard
      # caches evicted each other and the xcframework entries besides.
      #
      # A per-runner, per-shard directory outside the checkout survives
      # `git clean -ffdx`, costs no upload, and is not subject to the quota.
      # ~/.cargo is already shared and persistent on this machine.
      - name: Use a persistent cargo target directory
        run: |
          dir="$HOME/ci-cargo-target/${{ github.workflow }}-test-${{ matrix.shard.name }}"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"

      - name: Run tests
        run: ./scripts/rust-gate.sh test ${{ matrix.shard.name }}
