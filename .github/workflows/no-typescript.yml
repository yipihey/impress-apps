name: No new TypeScript

# The Apple apps are a pure Rust core with a Swift GUI. Agent-facing capability
# belongs in an `#[impress_service]` trait, where one definition generates the
# MCP tool, the CLI subcommand and impel's agent tool together — not in a
# hand-written server that has to be kept in step by hand.
#
# This job exists because the note alone did not hold. While the TypeScript MCP
# server was being retired, a6ace854 added 21 imbib tools to it by hand and
# eleven of them already existed in the Rust inventory, generated the whole
# time. A rule nothing checks is a rule that drifts.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  no-new-typescript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the merge base can be resolved.
          fetch-depth: 0

      - name: No TypeScript is tracked
        shell: bash
        run: |
          set -euo pipefail

          # BASE/HEAD are only used to name what a given push introduced. The
          # check itself does not depend on them, so a missing base must NOT
          # skip the job — it used to `exit 0`, which was right when the check
          # was differential and is a hole now that it is absolute.
          BASE=""
          HEAD="${{ github.sha }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          fi

          # The invariant is ABSOLUTE, not differential: zero tracked TypeScript.
          #
          # It used to be "may shrink, never grow" (--diff-filter=A only), which
          # was right while apps/imbib/imbib-web was still here. That debt reached
          # zero in the 2026-07-28 audit, so the stronger check is now available —
          # and it closes a hole: a diff-filter=A test only sees files git calls
          # *added* between BASE and HEAD, so a rename from a non-.ts path (status
          # R) or an oddly-attributed merge could slip a file in. Counting what is
          # tracked cannot be evaded that way.
          #
          # Vendored checkouts and dependencies are not ours to police.
          # `(^|/)` matters: a bare '/node_modules/' pattern does not match a
          # root-level node_modules/, so vendored files there would be reported
          # as ours. -E for the alternation.
          VENDORED='(^|/)(node_modules|\.build)/'
          TRACKED="$(git ls-files '*.ts' '*.tsx' | { grep -vE "$VENDORED" || true; })"

          # Still computed, purely so the error names what this push introduced.
          # Empty when there is no base (first push, workflow_dispatch).
          ADDED=""
          if [ -n "$BASE" ]; then
            ADDED="$(git diff --name-only --diff-filter=A "$BASE" "$HEAD" -- '*.ts' '*.tsx' 2>/dev/null \
              | { grep -vE "$VENDORED" || true; })"
          fi

          if [ -n "$TRACKED" ]; then
            echo "::error::TypeScript is tracked in this repo. The Apple apps are a pure Rust core with a Swift GUI."
            echo
            if [ -n "$ADDED" ]; then
              echo "Added by this push:"
              printf '  %s\n' $ADDED
              echo
            fi
            echo "All tracked TypeScript:"
            printf '  %s\n' $TRACKED
            echo
            echo "Agent-facing capability belongs in an #[impress_service] trait:"
            echo "  crates/imbib-service, crates/imprint-service, ..."
            echo "One #[impress_method] generates the MCP tool, the CLI subcommand"
            echo "and impel's agent tool together. See docs/mcp-migration-ledger.md."
            exit 1
          fi

          echo "No TypeScript tracked. "

      - name: Confirm the retirement holds
        shell: bash
        run: |
          set -euo pipefail
          # grep -v exits 1 on empty input; `|| true` keeps the step alive
          # now that the debt has actually reached zero (2026-07-28 audit).
          FILES="$(git ls-files '*.ts' '*.tsx' \
            | { grep -vE '(^|/)(node_modules|\.build)/' || true; })"
          if [ -z "$FILES" ]; then
            echo "TypeScript files still tracked: 0 — retirement complete."
            exit 0
          fi
          COUNT="$(printf '%s\n' "$FILES" | wc -l | tr -d ' ')"
          echo "TypeScript files still tracked: $COUNT"
          echo "This number may only go down. See the Phase 9 audit in the"
          echo "retirement plan: replace with Swift/Rust, or delete."
          printf '%s\n' "$FILES" | sed 's|/[^/]*$||' | sort | uniq -c | sort -rn
