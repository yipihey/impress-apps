name: imprint - App Builds (macOS + iOS)

# Guard against platform rot: imprint-iOS went months without compiling
# because nothing ever built it. This workflow builds BOTH app targets on
# every change that could affect them.

on:
  push:
    branches: [main]
    paths:
      - 'apps/imprint/**'
      - 'crates/imprint-core/**'
      # Sibling cores whose xcframeworks this workflow builds and links.
      - 'crates/impress-helix/**'
      - 'crates/impress-store-ffi/**'
      - 'crates/imbib-core/**'
      - 'packages/**'
      - '.github/workflows/imprint-apps.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/imprint/**'
      - 'crates/imprint-core/**'
      # Sibling cores whose xcframeworks this workflow builds and links.
      - 'crates/impress-helix/**'
      - 'crates/impress-store-ffi/**'
      - 'crates/imbib-core/**'
      - 'packages/**'
      - '.github/workflows/imprint-apps.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-apps:
    name: Build imprint (macOS + iOS Simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-imprint-apps-${{ hashFiles('**/Cargo.lock') }}

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build multi-platform ImprintCore.xcframework
        run: bash crates/imprint-core/build-xcframework.sh

      # imprint also links these sibling Rust cores (shared store, Helix
      # editor, imbib bridge); their xcframeworks are gitignored build
      # artifacts and must be produced on the runner too.
      - name: Build ImpressStoreFfi.xcframework
        run: bash crates/impress-store-ffi/build-xcframework.sh

      - name: Build ImpressHelix.xcframework
        run: bash crates/impress-helix/build-xcframework.sh

      - name: Build ImbibCore.xcframework
        run: bash crates/imbib-core/build-xcframework.sh

      - name: Generate Xcode project
        working-directory: apps/imprint
        run: xcodegen generate

      - name: Build imprint (macOS)
        working-directory: apps/imprint
        run: |
          set -o pipefail
          xcodebuild -project imprint.xcodeproj \
            -scheme imprint \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -50

      # Install-smoke: boot a sim, build for it, install, launch. A plain
      # `build` (generic destination) never installs, so it CANNOT catch
      # Info.plist/appex install rejections — exactly the class of bug that
      # broke imprint-iOS install (missing NSExtension/CFBundleDisplayName).
      - name: imprint-iOS install smoke (Simulator)
        working-directory: apps/imprint
        run: |
          set -eo pipefail
          # xcodebuild-accepted destination (simctl's list can disagree with
          # xcodebuild's destination set on CI runners; see imbib-tests.yml).
          UDID=$(xcodebuild -scheme imprint-iOS -showdestinations 2>/dev/null \
            | grep "platform:iOS Simulator" | grep -v placeholder \
            | grep -oE 'id:[0-9A-F-]{36}' | head -1 | cut -c4-)
          echo "sim: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild -project imprint.xcodeproj -scheme imprint-iOS -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO build | tail -30
          APP=$(find build-ios/Build/Products/Debug-iphonesimulator -maxdepth 1 -name 'imprint.app' | head -1)
          echo "installing $APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.imbib.imprint
          sleep 5
          xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q "com.imbib.imprint" \
            && echo "imprint-iOS launched OK" \
            || (echo "imprint-iOS did not launch" && exit 1)
