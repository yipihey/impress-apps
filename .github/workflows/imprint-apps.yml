name: imprint - App Builds (macOS + iOS)

# Guard against platform rot: imprint-iOS went months without compiling
# because nothing ever built it. This workflow builds BOTH app targets on
# every change that could affect them.

on:
  push:
    branches: [main]
    paths:
      - 'apps/imprint/**'
      - 'crates/imprint-core/**'
      - 'packages/**'
      - '.github/workflows/imprint-apps.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/imprint/**'
      - 'crates/imprint-core/**'
      - 'packages/**'
      - '.github/workflows/imprint-apps.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-apps:
    name: Build imprint (macOS + iOS Simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-imprint-apps-${{ hashFiles('**/Cargo.lock') }}

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build multi-platform ImprintCore.xcframework
        run: bash crates/imprint-core/build-xcframework.sh

      - name: Generate Xcode project
        working-directory: apps/imprint
        run: xcodegen generate

      - name: Build imprint (macOS)
        working-directory: apps/imprint
        run: |
          set -o pipefail
          xcodebuild -project imprint.xcodeproj \
            -scheme imprint \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -50

      - name: Build imprint-iOS (Simulator)
        working-directory: apps/imprint
        run: |
          set -o pipefail
          xcodebuild -project imprint.xcodeproj \
            -scheme imprint-iOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -50
