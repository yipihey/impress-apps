name: imprint - App Build (macOS)

# The fast per-push app gate: build the macOS target on every change that
# could affect it.
#
# The iOS half — boot a simulator, build for it, install, launch — used to run
# here on every push and dominated the lane's wall clock. It now lives in
# imprint-ios-smoke.yml: nightly, on demand, and on pushes that touch the iOS
# sources themselves. Same checks, different schedule (see that file's header
# for why platform rot is still covered).

on:
  push:
    branches: [main]
    paths:
      - 'apps/imprint/**'
      - 'crates/imprint-core/**'
      # Sibling cores whose xcframeworks this workflow builds and links.
      - 'crates/impress-helix/**'
      - 'crates/impress-store-ffi/**'
      - 'crates/impress-ai/**'
      - 'crates/imbib-core/**'
      - 'packages/**'
      - '.github/workflows/imprint-apps.yml'
# pull_request trigger removed 2026-07-28: this lane runs on a self-hosted
# runner and the repo is public — fork PRs must never reach that machine.

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

# Superseded pushes have nothing to say. Cancel them.
concurrency:
  # One run per LANE: repeated pushes collapse to the newest (the older
  # in-progress run is cancelled — freshest signal, least Mac time).
  # Deliberately NOT one machine-wide shared group: GitHub keeps at most
  # one queued run per group, so sibling lanes of the SAME push displace
  # each other and report "cancelled" on the commit (873cbb66: 6 of 8
  # Swift lanes never ran). Machine-wide serialization is the runner's
  # job — each self-hosted runner takes one job at a time.
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-apps:
    name: Build imprint (macOS)
    runs-on: [self-hosted, impress-mac]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      # target/ is NOT round-tripped through actions/cache any more. All four
      # runners are directories on this ONE Mac: actions/checkout deletes the
      # gitignored target/ at job start, the tarball is then downloaded from
      # GitHub and re-uploaded at the end. Measured 15-60 min of "Post Cache"
      # per job against cold builds of a few minutes, three saves per push
      # failing outright on an expired upload token, and a full 10 GB repo quota
      # whose evictions took the xcframework entries with them.
      # A per-runner directory outside the checkout survives `git clean -ffdx`,
      # uploads nothing, and is not subject to the quota. ~/.cargo already
      # persists on this machine and needs no cache step.
      - name: Use a persistent cargo target directory
        run: |
          dir="$HOME/ci-cargo-target/${{ github.workflow }}-${{ github.job }}"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - name: Install xcodegen
        run: brew install xcodegen

      # Full slice set: the generated project carries the imprint-iOS target
      # alongside the macOS one, so package resolution needs the iOS slices
      # even though only macOS is built here.
      - name: ImprintCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: imprint-core

      # imprint also links these sibling Rust cores (shared store, Helix
      # editor, imbib bridge); their xcframeworks are gitignored build
      # artifacts and must be produced on the runner too.
      - name: ImpressStoreFfi.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impress-store-ffi

      - name: ImpressHelix.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impress-helix

      - name: ImbibCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: imbib-core
          env-extra: MACOSX_DEPLOYMENT_TARGET=14.0

      # ImpressScixCore's binary target arrived with the chassis unification and
      # reaches imprint through PublicationManagerCore.
      - name: ScixClientCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: scix-client-ffi

      - name: Generate Xcode project
        working-directory: apps/imprint
        run: xcodegen generate

      - name: Build imprint (macOS)
        working-directory: apps/imprint
        run: |
          set -o pipefail
          xcodebuild -derivedDataPath "$PWD/.ci-derived" -project imprint.xcodeproj \
            -scheme imprint \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -50
