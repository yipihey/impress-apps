name: imprint - Tectonic engine (vcpkg)

# Split out of imprint-rust.yml on 2026-07-28.
#
# This lane builds the self-contained Tectonic LaTeX engine: freetype,
# graphite2, harfbuzz and ICU compiled statically through vcpkg, then
# imprint-core with `--features tectonic-render`, then a real end-to-end PDF
# compile that fetches the TeX bundle over the network. It is the slowest job
# in the repository by a wide margin — a cold vcpkg tree is most of an hour —
# and it ran on every push that touched any `crates/impress-*` file, which is
# to say most of them.
#
# Its true inputs are small and specific: the vcpkg manifest (which lives in
# crates/imprint-core/Cargo.toml under [package.metadata.vcpkg]), the Tectonic
# code paths behind the feature flag, and the spike test itself. Those are the
# push filters below. Everything else it might catch — a compiler bump, a
# vcpkg port drifting, a TeX bundle going stale — is drift over time, which is
# what the nightly run is for.
#
# The pure-Rust imprint gates (fmt, clippy, unit tests, Tier A self-test) stay
# per-push in imprint-rust.yml. Nothing about what this lane tests changed.

on:
  schedule:
    # 08:30 UTC, half an hour ahead of the iOS smoke so the two marathons do
    # not queue behind each other on the macOS runner pool.
    - cron: '30 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # The vcpkg manifest (git rev + port list + triplets) lives here.
      - 'crates/imprint-core/Cargo.toml'
      - 'crates/imprint-core/src/latex/**'
      - 'crates/imprint-core/tests/tectonic_spike.rs'
      - 'crates/imprint-selftest/Cargo.toml'
      - '.github/workflows/imprint-tectonic.yml'
# pull_request trigger removed 2026-07-28: this lane runs on a self-hosted
# runner and the repo is public — fork PRs must never reach that machine.

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: imprint-tectonic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tectonic:
    name: Tectonic engine (self-contained, arm64 + vcpkg)
    runs-on: [self-hosted, impress-mac]  # arm64 Apple Silicon
    steps:
      - uses: actions/checkout@v4

      # `rustup toolchain install stable` (the action's first step) aborts
      # with "failure removing component 'cargo-aarch64-apple-darwin',
      # directory does not exist: 'bin/cargo'" when the toolchain directory
      # is half there. That is what turned this lane red on 2026-09-06: the
      # four runners on this Mac still shared ONE ~/.rustup, and two jobs
      # updating stable at once left it in that state. Each runner has had
      # its own RUSTUP_HOME since 2026-09-07 (`.env`), which removed the
      # race; this step removes the other way in — a job cancelled mid-install
      # — by uninstalling a stable that has no cargo, so the action installs
      # it clean instead of failing to update it.
      - name: Repair a half-installed stable toolchain
        run: |
          tc="${RUSTUP_HOME:-$HOME/.rustup}/toolchains/stable-aarch64-apple-darwin"
          if [ -d "$tc" ] && [ ! -x "$tc/bin/cargo" ]; then
            echo "stable toolchain at $tc has no cargo — removing it for a clean install"
            rustup toolchain uninstall stable || rm -rf "$tc"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # No actions/cache in this lane. It used to round-trip ~/.cargo AND
      # target/ (1.4 GB per entry, a new entry per Cargo.lock change), the
      # vcpkg tree (220 MB) and the TeX bundle through the repo's 10 GB quota
      # — the largest entries in it, on a self-hosted Mac where all of them
      # already persist. Each saved entry evicted others, and the hosted
      # impart lane's xcframework entries, used least often, went first.
      # Same fix the other self-hosted lanes made (imprint-ios-smoke.yml):
      # a per-lane target directory outside the checkout survives
      # `git clean -ffdx` and uploads nothing. cargo-vcpkg builds its tree
      # under the target directory, so the static C deps persist with it;
      # VCPKG_ROOT names the same place for the steps below. ~/.cargo and
      # ~/tectonic-cache are in $HOME and persist on their own.
      - name: Use a persistent cargo target directory
        run: |
          dir="$HOME/ci-cargo-target/${{ github.workflow }}-${{ github.job }}"
          mkdir -p "$dir"
          {
            echo "CARGO_TARGET_DIR=$dir"
            echo "VCPKG_ROOT=$dir/vcpkg"
            # $HOME, not "~": a `~` in an env: value reaches tectonic
            # unexpanded, as a relative directory named "~".
            echo "TECTONIC_CACHE_DIR=$HOME/tectonic-cache"
          } >> "$GITHUB_ENV"

      # ICU's vcpkg port needs autotools; cargo-vcpkg drives the static build.
      # pkg-config + libtool: common implicit deps of the harfbuzz/graphite2
      # port toolchains that macos-latest runners don't guarantee.
      - name: Install build tools
        run: |
          brew install autoconf automake autoconf-archive pkg-config libtool
          cargo install cargo-vcpkg

      - name: Build vcpkg dependencies
        run: cargo vcpkg build --manifest-path crates/imprint-core/Cargo.toml

      # cargo-vcpkg reports only "failed" — the actual error lives in the
      # port buildtree logs. Surface the tails so the run is debuggable.
      - name: Surface vcpkg logs on failure
        if: failure()
        run: |
          echo "=== vcpkg buildtree logs (most recent first) ==="
          for f in $(ls -t $(find "$VCPKG_ROOT/buildtrees" -name '*.log' 2>/dev/null) 2>/dev/null | head -12); do
            echo; echo "===== $f ====="; tail -80 "$f"
          done

      # tectonic-render pulls its C deps from the vcpkg tree (static, no Homebrew
      # dylibs). The tests fetch the TeX bundle on first run (needs network).
      # The TeX bundle + generated format files persist across runs in
      # $TECTONIC_CACHE_DIR; a cold or flaky first fetch otherwise fails the
      # end-to-end compile test with "could not open format file latex".
      - name: Test tectonic-render (imprint-core)
        env:
          TECTONIC_DEP_BACKEND: vcpkg
        run: |
          # Warm the bundle/format cache with retries before the real tests:
          # the first fetch is network-dependent and occasionally partial.
          for i in 1 2 3; do
            if cargo test -p imprint-core --features tectonic-render --test tectonic_spike -- compiles_to_pdf_with_synctex; then
              break
            fi
            echo "warm-up attempt $i failed; clearing format cache and retrying"
            rm -rf "$TECTONIC_CACHE_DIR/formats"
            sleep 10
          done
          cargo test -p imprint-core --features tectonic-render

      - name: Tier-A self-test with tectonic-render
        env:
          TECTONIC_DEP_BACKEND: vcpkg
        run: cargo run -p imprint-selftest --features tectonic-render --bin imprint-selftest -- --tier a
