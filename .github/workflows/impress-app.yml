name: impress - App Builds

# The sixth shell's lane (ADR-0022 D9), on the impart-tests.yml pattern.
#
# What it is FOR is different from the other app lanes, and worth stating: the
# other five guard an app's own code. impress has almost none — 920 lines across
# both platforms, none of it business logic. This lane guards the CLAIM: that a
# shell built out of nothing but the preset, the shared root and the registries
# still COMPILES against a chassis that is being changed for other reasons.
#
# It is therefore the suite's most sensitive lane to chassis regressions, and
# the cheapest one to run. A PMC change that breaks impress has broken the
# contract every other app depends on and just happens not to exercise.
#
# Paths are wide on purpose (all of packages/**, all of PMC) because impress
# links the union of what the suite links — that is D7's "impress links all
# renderers" expressed as a trigger list.

on:
  push:
    branches: [main]
    paths:
      - 'apps/impress/**'
      # The chassis, which is nearly all of impress.
      - 'apps/imbib/PublicationManagerCore/**'
      - 'packages/**'
      # The Rust cores impress links through PMC. Enumerated rather than
      # 'crates/**' so an unrelated crate does not queue a mac job.
      - 'crates/impress-core/**'
      - 'crates/impress-store-ffi/**'
      - 'crates/imbib-core/**'
      - 'crates/imprint-core/**'
      - 'crates/impress-helix/**'
      - 'crates/scix-client-ffi/**'
      - 'schema-refs.json'
      - 'scripts/check-schema-refs.sh'
      - 'scripts/check-chassis-deps.sh'
      - '.github/workflows/impress-app.yml'
# NO pull_request trigger, deliberately — the same rule every other lane
# documents: this runs on a self-hosted runner and the repo is public, so a fork
# PR must never reach that machine.

env:
  CARGO_TERM_COLOR: always

concurrency:
  # One run per LANE: repeated pushes collapse to the newest (the older
  # in-progress run is cancelled — freshest signal, least Mac time).
  # Deliberately NOT one machine-wide shared group: GitHub keeps at most
  # one queued run per group, so sibling lanes of the SAME push displace
  # each other and report "cancelled" on the commit (873cbb66: 6 of 8
  # Swift lanes never ran). Machine-wide serialization is the runner's
  # job — each self-hosted runner takes one job at a time.
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-impress-macos:
    name: Build impress (macOS) + unit bundle
    runs-on: [self-hosted, impress-mac]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        # apps/*/*.xcodeproj/ is gitignored, so the project must be generated.
        run: brew install xcodegen

      - name: Schema-ref lint
        # impress READS every kind in the store and writes none. A misspelled
        # ref returns zero rows silently, which in this shell looks exactly like
        # "the other apps haven't written anything yet" — the most deniable
        # spelling of the bug this lint exists for.
        run: ./scripts/check-schema-refs.sh

      - name: Chassis dependency lint
        # impress is the app with the strongest interest in PMC not growing:
        # it links everything, so every dependency added there lands here.
        run: ./scripts/check-chassis-deps.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-impress-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-impress-

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          # NOT ~/Library/Developer/Xcode/DerivedData: on the self-hosted runner
          # that is the DEVELOPER's DerivedData (see imbib-tests.yml).
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-impress-${{ hashFiles('apps/imbib/PublicationManagerCore/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-impress-

      # Every xcframework below is a gitignored build artifact, so a clean
      # checkout has to produce them all or xcodebuild fails during package
      # resolution. impress links the full set through PMC.
      - name: ImpressStoreFfi.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impress-store-ffi

      - name: ImbibCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          # MACOSX_DEPLOYMENT_TARGET is the script's own default, stated
          # explicitly so this job shares one cache entry with the other lanes.
          crate: imbib-core
          env-extra: MACOSX_DEPLOYMENT_TARGET=14.0

      - name: ScixClientCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: scix-client-ffi

      - name: ImpressHelix.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impress-helix

      # FULL slice set, not IMPRINT_SKIP_IOS=1: impress's generated project
      # carries an iOS target beside the macOS one, so package resolution walks
      # the whole graph even in a macOS-only build.
      - name: ImprintCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: imprint-core

      - name: Generate Xcode project
        working-directory: apps/impress
        run: xcodegen generate

      # BUILD-FOR-TESTING, NOT `test`. `impressTests` is a bundle.unit-test with
      # a TEST_HOST of impress.app, so `xcodebuild test` would LAUNCH a GUI app
      # on a shared runner — which this repo does not do from CI (the rule the
      # impart lane states at length). `build-for-testing` compiles the app AND
      # the test bundle, which is what catches the class of break this lane
      # exists for.
      #
      # The consequence, stated so it is not mistaken for coverage: the
      # assertions in `ImpressShellTests` are COMPILED here and never RUN. The
      # facts that can be checked headlessly (the settings preset's inventory,
      # its factory coverage, the shell preset's truth table) live in
      # PublicationManagerCoreTests instead, which imbib-tests.yml executes.
      - name: Build impress (macOS) + impressTests
        working-directory: apps/impress
        run: |
          set -o pipefail
          xcodebuild -derivedDataPath "$PWD/.ci-derived" build-for-testing \
            -project impress.xcodeproj \
            -scheme impress \
            -configuration Debug \
            -destination 'platform=macOS' \
            -resultBundlePath ${{ runner.temp }}/BuildResults-impress-macOS.xcresult \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            IMPRESS_SKIP_INSTALL=1 \
            2>&1 | tee build-output-macos.txt | tail -50

      # ADR-0022 D7's size-tracking rule: "keep recording per-PR binary sizes,
      # so the future impress target is a link-list decision, not a refactor".
      # The target exists now, so the recording is a step rather than a promise.
      - name: Record binary size
        working-directory: apps/impress
        run: |
          APP=".ci-derived/Build/Products/Debug/impress.app"
          {
            echo "### impress binary size"
            echo ""
            echo "| item | size |"
            echo "|---|---|"
            echo "| bundle | $(du -sh "$APP" | cut -f1) |"
            echo "| app-target object code | $(find .ci-derived/Build/Intermediates.noindex -name '*.o' -path '*impress.build*' | xargs du -ch 2>/dev/null | tail -1 | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload macOS build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-results-impress-macos
          path: |
            ${{ runner.temp }}/BuildResults-impress-macOS.xcresult
            apps/impress/build-output-macos.txt

  build-impress-ios:
    name: Build impress-iOS (Simulator)
    # Rule 1 of the iOS/macOS parity protocol (ADR-023): every commit that
    # touches the shared chassis must also compile the iOS target. impress-iOS
    # is the chassis's most demanding iOS consumer — it is the only host that
    # routes THREE record kinds through `RecordSidebarBuilder`, `RecordListHost`
    # and the per-kind detail panes at once.
    runs-on: [self-hosted, impress-mac]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-impress-ios-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-impress-ios-

      - name: ImpressStoreFfi.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impress-store-ffi

      - name: ImbibCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: imbib-core
          env-extra: MACOSX_DEPLOYMENT_TARGET=14.0

      - name: ScixClientCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: scix-client-ffi

      - name: ImpressHelix.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impress-helix

      - name: ImprintCore.xcframework (multi-platform)
        uses: ./.github/actions/xcframework
        with:
          crate: imprint-core

      - name: Generate Xcode project
        working-directory: apps/impress
        run: xcodegen generate

      # Same reasoning as the macOS job: `build-for-testing`, never `test`.
      # `impress-iOSUITests` drives the app out of process on a BOOTED
      # simulator; compiling both targets is what proves the project is sound.
      # `generic/platform=iOS Simulator` on purpose: no device is booted, so
      # nothing launches and no runtime/device-set mismatch can flake the lane.
      #
      # The UI suite itself is run by hand against a booted simulator (see
      # apps/impress/impress-iOSUITests). Promoting it into this lane is the
      # obvious follow-up and needs the device-set discipline
      # imbib-tests.yml's install smoke already has.
      - name: Build impress-iOS + UI test bundle (Simulator)
        working-directory: apps/impress
        run: |
          set -o pipefail
          xcodebuild -derivedDataPath "$PWD/.ci-derived" build-for-testing \
            -project impress.xcodeproj \
            -scheme impress-iOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -resultBundlePath ${{ runner.temp }}/BuildResults-impress-iOS.xcresult \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build-output-ios.txt | tail -50

      - name: Upload iOS build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-results-impress-ios
          path: |
            ${{ runner.temp }}/BuildResults-impress-iOS.xcresult
            apps/impress/build-output-ios.txt
