name: imprint - Rust CI

on:
  push:
    branches: [main]
    paths:
      - 'crates/imprint-core/**'
      - 'crates/imprint-service/**'
      - 'crates/imprint-selftest/**'
      - 'crates/impress-*/**'
      - '.github/workflows/imprint-rust.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/imprint-core/**'
      - 'crates/imprint-service/**'
      - 'crates/imprint-selftest/**'
      - 'crates/impress-*/**'
      - '.github/workflows/imprint-rust.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: crates/imprint-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-imprint-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --features native -- -D warnings

      - name: Run tests
        run: cargo test --features native

  selftest:
    name: Service + Self-Test (Tier A)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-imprint-selftest-${{ hashFiles('**/Cargo.lock') }}

      # Exercises the imprint-service traits + the imprint-selftest harness.
      # Tier A is pure-Rust and headless (no app, no UI). Tier B is skipped in
      # CI since no imprint app is running — the harness reports those as
      # skipped, not failed.
      - name: Test service + self-test crates
        run: cargo test -p imprint-service -p imprint-selftest

      # Run the Tier A capability report and fail the build if any capability
      # regresses. `--tier a` never touches the network; the binary exits
      # non-zero if any capability fails.
      - name: Run Tier A capability self-test
        run: cargo run -p imprint-selftest --bin imprint-selftest -- --tier a

  tectonic:
    name: Tectonic engine (self-contained, arm64 + vcpkg)
    runs-on: macos-latest  # arm64 Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # ICU's vcpkg port needs autotools; cargo-vcpkg drives the static build.
      - name: Install build tools
        run: |
          brew install autoconf automake autoconf-archive
          cargo install cargo-vcpkg

      # The vcpkg static C deps (freetype/graphite2/harfbuzz/icu) are slow to
      # build; cache them keyed on the manifest that pins the vcpkg rev + list.
      - name: Cache vcpkg static deps
        uses: actions/cache@v4
        with:
          path: target/vcpkg
          key: ${{ runner.os }}-vcpkg-tectonic-${{ hashFiles('crates/imprint-core/Cargo.toml') }}

      - name: Build vcpkg dependencies
        run: cargo vcpkg build --manifest-path crates/imprint-core/Cargo.toml

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-tectonic-${{ hashFiles('**/Cargo.lock') }}

      # tectonic-render pulls its C deps from the vcpkg tree (static, no Homebrew
      # dylibs). The tests fetch the TeX bundle on first run (needs network).
      - name: Test tectonic-render (imprint-core)
        env:
          VCPKG_ROOT: ${{ github.workspace }}/target/vcpkg
          TECTONIC_DEP_BACKEND: vcpkg
        run: cargo test -p imprint-core --features tectonic-render

      - name: Tier-A self-test with tectonic-render
        env:
          VCPKG_ROOT: ${{ github.workspace }}/target/vcpkg
          TECTONIC_DEP_BACKEND: vcpkg
        run: cargo run -p imprint-selftest --features tectonic-render --bin imprint-selftest -- --tier a

  generate-bindings:
    name: Generate Swift Bindings
    runs-on: macos-latest
    defaults:
      run:
        working-directory: crates/imprint-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-imprint-${{ hashFiles('**/Cargo.lock') }}

      - name: Build library
        run: cargo build --release --features native

      - name: Generate Swift bindings
        run: |
          mkdir -p generated
          cargo run --release --features native --bin uniffi-bindgen generate \
            --library ../../target/release/libimprint_core.dylib \
            --language swift \
            --out-dir generated

      - name: Upload Swift bindings
        uses: actions/upload-artifact@v4
        with:
          name: imprint-swift-bindings
          path: crates/imprint-core/generated/
