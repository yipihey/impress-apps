name: imprint - Rust CI

on:
  push:
    branches: [main]
    paths:
      - 'crates/imprint-core/**'
      - 'crates/imprint-service/**'
      - 'crates/imprint-selftest/**'
      - 'crates/impress-*/**'
      - '.github/workflows/imprint-rust.yml'
# pull_request trigger removed 2026-07-28: this lane runs on a self-hosted
# runner and the repo is public — fork PRs must never reach that machine.
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

concurrency:
  group: imprint-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: [self-hosted, impress-mac]
    defaults:
      run:
        working-directory: crates/imprint-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # target/ is NOT round-tripped through actions/cache any more. All four
      # runners are directories on this ONE Mac: actions/checkout deletes the
      # gitignored target/ at job start, the tarball is then downloaded from
      # GitHub and re-uploaded at the end. Measured 15-60 min of "Post Cache"
      # per job against cold builds of a few minutes, three saves per push
      # failing outright on an expired upload token, and a full 10 GB repo quota
      # whose evictions took the xcframework entries with them.
      # A per-runner directory outside the checkout survives `git clean -ffdx`,
      # uploads nothing, and is not subject to the quota. ~/.cargo already
      # persists on this machine and needs no cache step.
      - name: Use a persistent cargo target directory
        run: |
          dir="$HOME/ci-cargo-target/${{ github.workflow }}-${{ github.job }}"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --features native -- -D warnings

      - name: Run tests
        run: cargo test --features native

  selftest:
    name: Service + Self-Test (Tier A)
    runs-on: [self-hosted, impress-mac]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # target/ is NOT round-tripped through actions/cache any more. All four
      # runners are directories on this ONE Mac: actions/checkout deletes the
      # gitignored target/ at job start, the tarball is then downloaded from
      # GitHub and re-uploaded at the end. Measured 15-60 min of "Post Cache"
      # per job against cold builds of a few minutes, three saves per push
      # failing outright on an expired upload token, and a full 10 GB repo quota
      # whose evictions took the xcframework entries with them.
      # A per-runner directory outside the checkout survives `git clean -ffdx`,
      # uploads nothing, and is not subject to the quota. ~/.cargo already
      # persists on this machine and needs no cache step.
      - name: Use a persistent cargo target directory
        run: |
          dir="$HOME/ci-cargo-target/${{ github.workflow }}-${{ github.job }}"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      # Exercises the imprint-service traits + the imprint-selftest harness.
      # Tier A is pure-Rust and headless (no app, no UI). Tier B is skipped in
      # CI since no imprint app is running — the harness reports those as
      # skipped, not failed.
      - name: Test service + self-test crates
        run: cargo test -p imprint-service -p imprint-selftest

      # Run the Tier A capability report and fail the build if any capability
      # regresses. `--tier a` never touches the network; the binary exits
      # non-zero if any capability fails.
      - name: Run Tier A capability self-test
        run: cargo run -p imprint-selftest --bin imprint-selftest -- --tier a

  # The Tectonic/vcpkg job used to live here. It moved to
  # imprint-tectonic.yml on 2026-07-28: nightly + on-demand + on pushes that
  # touch the vcpkg manifest or the LaTeX paths, instead of on every push that
  # touched any crates/impress-* file. Same steps, same assertions.

  generate-bindings:
    name: Generate Swift Bindings
    runs-on: [self-hosted, impress-mac]
    defaults:
      run:
        working-directory: crates/imprint-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # target/ is NOT round-tripped through actions/cache any more. All four
      # runners are directories on this ONE Mac: actions/checkout deletes the
      # gitignored target/ at job start, the tarball is then downloaded from
      # GitHub and re-uploaded at the end. Measured 15-60 min of "Post Cache"
      # per job against cold builds of a few minutes, three saves per push
      # failing outright on an expired upload token, and a full 10 GB repo quota
      # whose evictions took the xcframework entries with them.
      # A per-runner directory outside the checkout survives `git clean -ffdx`,
      # uploads nothing, and is not subject to the quota. ~/.cargo already
      # persists on this machine and needs no cache step.
      - name: Use a persistent cargo target directory
        run: |
          dir="$HOME/ci-cargo-target/${{ github.workflow }}-${{ github.job }}"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - name: Build library
        run: |
          # Release compile check (lib + bins), as before.
          cargo build --release --features native
          # The FFI crates are crate-type=["lib"] now, so ask explicitly for the
          # staticlib the bindgen step reads (emitting staticlib+cdylib from the
          # shared lib target made every dependent build archive and link them).
          cargo rustc --release --features native --lib --crate-type staticlib

      - name: Generate Swift bindings
        run: |
          # uniffi-bindgen auto-applies swiftformat when it is on PATH, which
          # reformats the output (`if cond` vs `if (cond)`) away from the raw
          # form the committed file is in — the staleness guard below would
          # then cry wolf on every run. Remove it when present (sudo -n:
          # hosted runners have passwordless sudo, the self-hosted runner has
          # neither sudo nor swiftformat). Same treatment as imbib-rust.yml.
          if command -v swiftformat >/dev/null 2>&1; then
            sudo -n rm -f "$(command -v swiftformat)" || \
              echo "::warning::swiftformat present but not removable; bindings diff may reformat"
          fi
          mkdir -p generated
          cargo run --release -p uniffi-bindgen -- generate \
            --library "$CARGO_TARGET_DIR/release/libimprint_core.a" \
            --language swift \
            --out-dir generated

      # imprint commits the SAME generated file twice: once for the app-local
      # package and once for the SPM package the iOS target consumes. Both are
      # what the app actually compiles against, and both must match the Rust.
      #
      # The cheap name-level lint in uniffi-bindings.yml already blocks PRs on
      # a missing export. This is the thorough half: a full diff also catches a
      # CHANGED signature or renamed type, which moves the UniFFI checksum and
      # crashes at launch with "API checksum mismatch" rather than failing the
      # build. It needs a real cargo build, so it lives here, post-merge.
      - name: Committed Swift bindings match the Rust
        run: |
          # -b -B tolerate pure reformatting (see the swiftformat note above);
          # an export present in the Rust and absent from the committed file is
          # not whitespace, so the check that matters still fires.
          # ONE committed binding: ImprintCore re-exports ImprintRustCore rather
          # than carrying a second copy (see BINDINGS in
          # scripts/check-uniffi-bindings.sh, the authoritative list). The
          # second path this loop used to name no longer exists, and `diff`
          # against a missing file reads as "stale".
          status=0
          for committed in \
            ../../apps/imprint/ImprintRustCore/Sources/ImprintRustCore/imprint_core.swift; do
            if ! diff -u -b -B "$committed" generated/imprint_core.swift; then
              echo "::error::Committed $committed is stale."
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "Run crates/imprint-core/build-xcframework.sh and commit the result."
            echo "Judge the diff by declarations gained/lost, not diffstat:"
            echo "uniffi-bindgen reorders freely."
            exit 1
          fi

      - name: Upload Swift bindings
        uses: actions/upload-artifact@v4
        with:
          name: imprint-swift-bindings
          path: crates/imprint-core/generated/
