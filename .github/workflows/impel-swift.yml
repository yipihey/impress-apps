name: impel - Swift Tests

# impel had no Swift lane until 2026-07-26: `.gitignore` excluded
# apps/*/Packages/*/Tests/, so the `.testTarget(path: "Tests/...")` in
# each impel package manifest pointed at a directory that did not exist
# in a clean clone. Every `swift build` / `xcodebuild` there died with
# `invalid custom path 'Tests/...'`. The tests are tracked now; this
# workflow is what keeps them from rotting again.

on:
  push:
    branches: [main]
    paths:
      - 'apps/impel/**'
      - 'packages/**'
      # CounselEngine's test target takes a TEST-ONLY dependency on
      # PublicationManagerCore, and `JournalStatusPolicyParityTests` is the
      # interlock between `JournalPipeline.autoSnapshotStatuses` and
      # `ManuscriptRecordKind.descriptor`'s `freezesSource` statuses. Without
      # this path the interlock never runs on the change most likely to break
      # it — a descriptor-only edit in PMC. (The `build-app` job also links PMC,
      # so it was already under-triggered.)
      - 'apps/imbib/PublicationManagerCore/**'
      - 'crates/impress-core/**'
      - 'crates/impress-store-ffi/**'
      - '.github/workflows/impel-swift.yml'
# pull_request trigger removed 2026-07-28: this lane runs on a self-hosted
# runner and the repo is public — fork PRs must never reach that machine.
env:
  CARGO_TERM_COLOR: always

concurrency:
  # One run per LANE: repeated pushes collapse to the newest (the older
  # in-progress run is cancelled — freshest signal, least Mac time).
  # Deliberately NOT one machine-wide shared group: GitHub keeps at most
  # one queued run per group, so sibling lanes of the SAME push displace
  # each other and report "cancelled" on the commit (873cbb66: 6 of 8
  # Swift lanes never ran). Machine-wide serialization is the runner's
  # job — each self-hosted runner takes one job at a time.
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: Test impel Swift packages
    runs-on: [self-hosted, impress-mac]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-impel-swift-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-impel-${{ hashFiles('apps/impel/Packages/*/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-impel-

      # CounselEngine links ImpressRustCore, whose binary target is the
      # gitignored ImpressStoreFfi.xcframework — it must be produced here.
      - name: ImpressStoreFfi.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impress-store-ffi

      # CounselEngine also declares its own impel_toolsFFI binary target.
      # `swift test` resolves the whole package graph, so the artifact has to
      # exist even for the ImpelCore/ImpelMail steps' sibling package.
      - name: ImpelTools.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impel-tools

      # impel links PublicationManagerCore (Stage 2-C chassis conversion), and
      # `swift test` resolves PMC's WHOLE binary-target closure even for
      # packages that never call into it — the campaign push failed here with
      # "does not contain a binary artifact" for helix and scix. This is the
      # same five-crate closure imbib-tests.yml builds for PMC.
      - name: ImbibCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: imbib-core
          env-extra: MACOSX_DEPLOYMENT_TARGET=14.0

      - name: ScixClientCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: scix-client-ffi

      - name: ImpressHelix.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impress-helix

      - name: ImprintCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: imprint-core
          env-extra: IMPRINT_SKIP_IOS=1

      - name: Test ImpelCore
        working-directory: apps/impel/Packages/ImpelCore
        run: swift test

      - name: Test ImpelMail
        working-directory: apps/impel/Packages/ImpelMail
        run: swift test

      - name: Test CounselEngine
        working-directory: apps/impel/Packages/CounselEngine
        run: swift test

  build-app:
    name: Build impel (macOS) + app unit tests
    runs-on: [self-hosted, impress-mac]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-impel-swift-${{ hashFiles('**/Cargo.lock') }}

      - name: Install xcodegen
        run: brew install xcodegen

      - name: ImpressStoreFfi.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impress-store-ffi

      # The impel app links the PublicationManagerCore chassis, which drags in
      # the imbib, Helix and SciX cores on top of impel's own ImpelTools. Every
      # one of these is a gitignored build artifact, so a clean checkout has to
      # produce them all or xcodebuild fails at package resolution.
      - name: ImpelTools.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impel-tools

      - name: ImbibCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: imbib-core
          env-extra: MACOSX_DEPLOYMENT_TARGET=14.0

      - name: ImpressHelix.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impress-helix

      - name: ScixClientCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: scix-client-ffi

      # PMC -> ImprintCore -> imprint_coreFFI. impel is a macOS-only project,
      # so skip the three iOS slices — imprint-core links Typst and is by far
      # the most expensive crate in this graph.
      - name: ImprintCore.xcframework (macOS slices only)
        uses: ./.github/actions/xcframework
        with:
          crate: imprint-core
          env-extra: IMPRINT_SKIP_IOS=1

      - name: Generate Xcode project
        working-directory: apps/impel
        run: xcodegen generate

      - name: Build impel (macOS)
        working-directory: apps/impel
        run: |
          set -o pipefail
          xcodebuild -derivedDataPath "$PWD/.ci-derived" -project impel.xcodeproj \
            -scheme impel \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -50

      # Unit bundle only. impelUITests is in the scheme's test action but
      # drives the real app through XCUITest, which needs accessibility
      # permissions the runner does not grant.
      - name: Run impelTests (unit bundle)
        working-directory: apps/impel
        run: |
          set -o pipefail
          xcodebuild -derivedDataPath "$PWD/.ci-derived" test \
            -project impel.xcodeproj \
            -scheme impel \
            -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:impelTests \
            -resultBundlePath ${{ runner.temp }}/TestResults-impel.xcresult \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -50

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-impel
          path: ${{ runner.temp }}/TestResults-impel.xcresult
