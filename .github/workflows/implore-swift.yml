name: implore - Swift Tests

# implore had no Swift lane until 2026-07-26: implore-rust.yml is
# cargo-only and nothing in .github ever ran
# crates/implore-core/build-xcframework.sh, so neither the app nor the
# ImploreCore package was compiled by CI at all. That is how the script's
# `-d` guard on apps/implore/Frameworks (which silently skipped the copy
# on any fresh checkout) survived unnoticed.

on:
  push:
    branches: [main]
    paths:
      - 'apps/implore/**'
      - 'packages/**'
      - 'crates/implore-core/**'
      - 'crates/impress-core/**'
      - 'crates/impress-helix/**'
      - 'crates/impress-store-ffi/**'
      - '.github/workflows/implore-swift.yml'
# pull_request trigger removed 2026-07-28: this lane runs on a self-hosted
# runner and the repo is public — fork PRs must never reach that machine.
env:
  CARGO_TERM_COLOR: always

concurrency:
  # One run per LANE: repeated pushes collapse to the newest (the older
  # in-progress run is cancelled — freshest signal, least Mac time).
  # Deliberately NOT one machine-wide shared group: GitHub keeps at most
  # one queued run per group, so sibling lanes of the SAME push displace
  # each other and report "cancelled" on the commit (873cbb66: 6 of 8
  # Swift lanes never ran). Machine-wide serialization is the runner's
  # job — each self-hosted runner takes one job at a time.
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: Test ImploreCore package
    runs-on: [self-hosted, impress-mac]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-implore-swift-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-implore-

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-implore-${{ hashFiles('apps/implore/Packages/*/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-implore-

      # Also copies into apps/implore/Frameworks/, which is where
      # ImploreRustCore's binary target points — both destinations are in the
      # composite action's cache path list.
      - name: ImploreCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: implore-core

      # ImploreCore -> ImpressRustCore -> ImpressStoreFfi.xcframework.
      - name: ImpressStoreFfi.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impress-store-ffi

      - name: Test ImploreCore
        working-directory: apps/implore/Packages/ImploreCore
        run: swift test

  build-app:
    name: Build implore (macOS)
    runs-on: [self-hosted, impress-mac]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-implore-swift-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-implore-

      - name: Install xcodegen
        run: brew install xcodegen

      - name: ImploreCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: implore-core

      - name: ImpressStoreFfi.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impress-store-ffi

      # The app links ImpressHelixCore for its editor surfaces.
      - name: ImpressHelix.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impress-helix

      # The app also links the PublicationManagerCore chassis, which brings the
      # SciX client and imbib cores with it. Gitignored artifacts, so a clean
      # checkout must build them or xcodebuild fails at package resolution.
      - name: ScixClientCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: scix-client-ffi

      - name: ImbibCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: imbib-core
          env-extra: MACOSX_DEPLOYMENT_TARGET=14.0

      # PMC -> ImprintCore -> imprint_coreFFI. implore is a macOS-only project,
      # so skip the three iOS slices — imprint-core links Typst and is by far
      # the most expensive crate in this graph.
      - name: ImprintCore.xcframework (macOS slices only)
        uses: ./.github/actions/xcframework
        with:
          crate: imprint-core
          env-extra: IMPRINT_SKIP_IOS=1

      # implore ships .metal shaders (Sources/Metal/Shaders/). Xcode 26
      # no longer bundles the Metal compiler — without this the build dies
      # with "cannot execute tool 'metal' due to missing Metal Toolchain".
      # Tolerated failure: on Xcode versions that still bundle it, the
      # component name is unknown and the download is a no-op. If the
      # toolchain is genuinely missing, the build step below says so.
      - name: Ensure Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Generate Xcode project
        working-directory: apps/implore
        run: xcodegen generate

      # Build only. implore's sole Xcode test target is imploreUITests,
      # which drives the real app through XCUITest and needs accessibility
      # permissions the runner does not grant; the unit-level coverage
      # lives in the ImploreCore package job above.
      - name: Build implore (macOS)
        working-directory: apps/implore
        run: |
          set -o pipefail
          xcodebuild -derivedDataPath "$PWD/.ci-derived" -project implore.xcodeproj \
            -scheme implore \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -50
