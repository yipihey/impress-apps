name: implore - Rust CI

on:
  push:
    branches: [main]
    paths:
      - 'crates/implore-*/**'
      - '.github/workflows/implore-rust.yml'
# pull_request trigger removed 2026-07-28: this lane runs on a self-hosted
# runner and the repo is public — fork PRs must never reach that machine.
env:
  CARGO_TERM_COLOR: always

concurrency:
  group: implore-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: [self-hosted, impress-mac]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-implore-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting (implore-core)
        working-directory: crates/implore-core
        run: cargo fmt --check

      - name: Check formatting (implore-stats)
        working-directory: crates/implore-stats
        run: cargo fmt --check

      - name: Check formatting (implore-io)
        working-directory: crates/implore-io
        run: cargo fmt --check

      - name: Check formatting (implore-selection)
        working-directory: crates/implore-selection
        run: cargo fmt --check

      - name: Clippy (all implore crates)
        run: |
          cargo clippy -p implore-core -p implore-stats -p implore-io -p implore-selection \
            --all-targets -- -D warnings

      - name: Run tests (all implore crates)
        run: |
          cargo test -p implore-core -p implore-stats -p implore-io -p implore-selection

  generate-bindings:
    name: Generate Swift Bindings
    runs-on: [self-hosted, impress-mac]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-implore-${{ hashFiles('**/Cargo.lock') }}

      - name: Build library
        working-directory: crates/implore-core
        run: cargo build --release --features uniffi

      - name: Generate Swift bindings
        working-directory: crates/implore-core
        run: |
          # uniffi-bindgen auto-applies swiftformat when it is on PATH, which
          # reformats the output away from the raw form the committed file is
          # in and makes the staleness guard below cry wolf. Remove it when
          # present. Same treatment as imbib-rust.yml.
          if command -v swiftformat >/dev/null 2>&1; then
            sudo -n rm -f "$(command -v swiftformat)" || \
              echo "::warning::swiftformat present but not removable; bindings diff may reformat"
          fi
          mkdir -p generated
          cargo run --release --features uniffi --bin uniffi-bindgen generate \
            --library ../../target/release/libimplore_core.dylib \
            --language swift \
            --out-dir generated

      # The committed copy under apps/implore/ImploreRustCore is what the app
      # compiles against; nothing regenerates it at build time. The cheap
      # name-level lint in uniffi-bindings.yml blocks PRs on a missing export;
      # this full diff additionally catches a changed signature, which moves
      # the UniFFI checksum and crashes at launch instead of failing the build.
      - name: Committed Swift bindings match the Rust
        working-directory: crates/implore-core
        run: |
          # -b -B tolerate pure reformatting (see the swiftformat note above).
          if ! diff -u -b -B ../../apps/implore/ImploreRustCore/Sources/ImploreRustCore/implore_core.swift \
                             generated/implore_core.swift; then
            echo "::error::Committed implore_core.swift is stale."
            echo "Run crates/implore-core/build-xcframework.sh and commit the result."
            exit 1
          fi

      - name: Upload Swift bindings
        uses: actions/upload-artifact@v4
        with:
          name: implore-swift-bindings
          path: crates/implore-core/generated/
