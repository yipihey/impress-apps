name: implore - Rust CI

on:
  push:
    branches: [main]
    paths:
      - 'crates/implore-*/**'
      - '.github/workflows/implore-rust.yml'
# pull_request trigger removed 2026-07-28: this lane runs on a self-hosted
# runner and the repo is public — fork PRs must never reach that machine.
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

concurrency:
  group: implore-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: [self-hosted, impress-mac]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # target/ is NOT round-tripped through actions/cache any more. All four
      # runners are directories on this ONE Mac: actions/checkout deletes the
      # gitignored target/ at job start, the tarball is then downloaded from
      # GitHub and re-uploaded at the end. Measured 15-60 min of "Post Cache"
      # per job against cold builds of a few minutes, three saves per push
      # failing outright on an expired upload token, and a full 10 GB repo quota
      # whose evictions took the xcframework entries with them.
      # A per-runner directory outside the checkout survives `git clean -ffdx`,
      # uploads nothing, and is not subject to the quota. ~/.cargo already
      # persists on this machine and needs no cache step.
      - name: Use a persistent cargo target directory
        run: |
          dir="$HOME/ci-cargo-target/${{ github.workflow }}-${{ github.job }}"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - name: Check formatting (implore-core)
        working-directory: crates/implore-core
        run: cargo fmt --check

      - name: Check formatting (implore-stats)
        working-directory: crates/implore-stats
        run: cargo fmt --check

      - name: Check formatting (implore-io)
        working-directory: crates/implore-io
        run: cargo fmt --check

      - name: Check formatting (implore-selection)
        working-directory: crates/implore-selection
        run: cargo fmt --check

      - name: Clippy (all implore crates)
        run: |
          cargo clippy -p implore-core -p implore-stats -p implore-io -p implore-selection \
            --all-targets -- -D warnings

      - name: Run tests (all implore crates)
        run: |
          cargo test -p implore-core -p implore-stats -p implore-io -p implore-selection

  generate-bindings:
    name: Generate Swift Bindings
    runs-on: [self-hosted, impress-mac]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # target/ is NOT round-tripped through actions/cache any more. All four
      # runners are directories on this ONE Mac: actions/checkout deletes the
      # gitignored target/ at job start, the tarball is then downloaded from
      # GitHub and re-uploaded at the end. Measured 15-60 min of "Post Cache"
      # per job against cold builds of a few minutes, three saves per push
      # failing outright on an expired upload token, and a full 10 GB repo quota
      # whose evictions took the xcframework entries with them.
      # A per-runner directory outside the checkout survives `git clean -ffdx`,
      # uploads nothing, and is not subject to the quota. ~/.cargo already
      # persists on this machine and needs no cache step.
      - name: Use a persistent cargo target directory
        run: |
          dir="$HOME/ci-cargo-target/${{ github.workflow }}-${{ github.job }}"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - name: Build library
        working-directory: crates/implore-core
        run: |
          # Release compile check (lib + bins), as before.
          cargo build --release --features uniffi
          # The FFI crates are crate-type=["lib"] now, so ask explicitly for the
          # staticlib the bindgen step reads (emitting staticlib+cdylib from the
          # shared lib target made every dependent build archive and link them).
          cargo rustc --release --features uniffi --lib --crate-type staticlib

      - name: Generate Swift bindings
        working-directory: crates/implore-core
        run: |
          mkdir -p generated
          cargo run --release -p uniffi-bindgen -- generate \
            --library ../../target/release/libimplore_core.a \
            --language swift \
            --out-dir generated

      - name: Upload Swift bindings
        uses: actions/upload-artifact@v4
        with:
          name: implore-swift-bindings
          path: crates/implore-core/generated/
