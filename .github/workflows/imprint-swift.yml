name: imprint - Swift Tests

# The ImprintCore package tests ran nowhere until 2026-07-26:
# imprint-apps.yml only *builds* the app targets and imprint-rust.yml is
# cargo-only. Half of them were not even tracked (see the .gitignore note
# about apps/*/Packages/*/Tests/), so a clean clone silently lost them.

on:
  push:
    branches: [main]
    paths:
      - 'apps/imprint/Packages/**'
      - 'packages/**'
      - 'crates/imprint-core/**'
      - 'crates/impress-core/**'
      - 'crates/impress-store-ffi/**'
      - 'crates/impress-ai/**'
      - 'apps/imprint/Shared/**'
      - 'schema-refs.json'
      - 'scripts/check-schema-refs.sh'
      - '.github/workflows/imprint-swift.yml'
# pull_request trigger removed 2026-07-28: this lane runs on a self-hosted
# runner and the repo is public — fork PRs must never reach that machine.
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

concurrency:
  # One run per LANE: repeated pushes collapse to the newest (the older
  # in-progress run is cancelled — freshest signal, least Mac time).
  # Deliberately NOT one machine-wide shared group: GitHub keeps at most
  # one queued run per group, so sibling lanes of the SAME push displace
  # each other and report "cancelled" on the commit (873cbb66: 6 of 8
  # Swift lanes never ran). Machine-wide serialization is the runner's
  # job — each self-hosted runner takes one job at a time.
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: Test ImprintCore package
    runs-on: [self-hosted, impress-mac]

    steps:
      - uses: actions/checkout@v4

      - name: Schema-ref lint
        # imprint is where the reader/writer split lived longest: sections were
        # WRITTEN as `manuscript-section` and READ as `manuscript-section@1.0.0`,
        # so the outline, /api/manuscripts/{id}/sections and cross-document
        # search were structurally empty. Neither imbib-tests.yml nor
        # workspace-rust.yml has `apps/imprint/**` in its path filter, so
        # without this step an imprint-only change is ungated.
        run: ./scripts/check-schema-refs.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # target/ is NOT round-tripped through actions/cache any more. All four
      # runners are directories on this ONE Mac: actions/checkout deletes the
      # gitignored target/ at job start, the tarball is then downloaded from
      # GitHub and re-uploaded at the end. Measured 15-60 min of "Post Cache"
      # per job against cold builds of a few minutes, three saves per push
      # failing outright on an expired upload token, and a full 10 GB repo quota
      # whose evictions took the xcframework entries with them.
      # A per-runner directory outside the checkout survives `git clean -ffdx`,
      # uploads nothing, and is not subject to the quota. ~/.cargo already
      # persists on this machine and needs no cache step.
      - name: Use a persistent cargo target directory
        run: |
          dir="$HOME/ci-cargo-target/${{ github.workflow }}-${{ github.job }}"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      # No SwiftPM cache: ~/Library/Caches/org.swift.swiftpm is the developer's
      # own directory on this self-hosted Mac and already persists between jobs.
      # The step cost 8-9 minutes of upload per job, and its key hashed
      # Package.resolved, which is gitignored - so the key never changed.
      # This script produces BOTH apps/imprint/Frameworks/ImprintCore.xcframework
      # and the imprint_core.swift bindings the ImprintCore/ImprintRustCore
      # packages compile against. ImprintCore's manifest cannot even resolve
      # without the framework, so the composite action caches all of them
      # together — restoring the binary without the bindings would be worse
      # than a cold build.
      - name: ImprintCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: imprint-core

      # ImprintCore -> ImpressRustCore -> ImpressStoreFfi.xcframework.
      - name: ImpressStoreFfi.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impress-store-ffi

      - name: Test ImprintCore
        working-directory: apps/imprint/Packages/ImprintCore
        run: swift test
