name: imprint - Swift Tests

# The ImprintCore package tests ran nowhere until 2026-07-26:
# imprint-apps.yml only *builds* the app targets and imprint-rust.yml is
# cargo-only. Half of them were not even tracked (see the .gitignore note
# about apps/*/Packages/*/Tests/), so a clean clone silently lost them.

on:
  push:
    branches: [main]
    paths:
      - 'apps/imprint/Packages/**'
      - 'packages/**'
      - 'crates/imprint-core/**'
      - 'crates/impress-core/**'
      - 'crates/impress-store-ffi/**'
      - 'apps/imprint/Shared/**'
      - 'schema-refs.json'
      - 'scripts/check-schema-refs.sh'
      - '.github/workflows/imprint-swift.yml'
# pull_request trigger removed 2026-07-28: this lane runs on a self-hosted
# runner and the repo is public — fork PRs must never reach that machine.
env:
  CARGO_TERM_COLOR: always

concurrency:
  # ONE xcodebuild lane machine-wide: every heavy workflow shares this
  # group, so app builds queue instead of thrashing the single Mac the
  # self-hosted runners AND live agent sessions share. GitHub keeps at
  # most one queued run per group — bursts collapse to the newest.
  group: mac-xcode-heavy
  cancel-in-progress: false

jobs:
  package-tests:
    name: Test ImprintCore package
    runs-on: [self-hosted, impress-mac]

    steps:
      - uses: actions/checkout@v4

      - name: Schema-ref lint
        # imprint is where the reader/writer split lived longest: sections were
        # WRITTEN as `manuscript-section` and READ as `manuscript-section@1.0.0`,
        # so the outline, /api/manuscripts/{id}/sections and cross-document
        # search were structurally empty. Neither imbib-tests.yml nor
        # workspace-rust.yml has `apps/imprint/**` in its path filter, so
        # without this step an imprint-only change is ungated.
        run: ./scripts/check-schema-refs.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-imprint-swift-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-imprint-

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-imprint-${{ hashFiles('apps/imprint/Packages/*/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-imprint-

      # This script produces BOTH apps/imprint/Frameworks/ImprintCore.xcframework
      # and the imprint_core.swift bindings the ImprintCore/ImprintRustCore
      # packages compile against. ImprintCore's manifest cannot even resolve
      # without the framework, so the composite action caches all of them
      # together — restoring the binary without the bindings would be worse
      # than a cold build.
      - name: ImprintCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: imprint-core

      # ImprintCore -> ImpressRustCore -> ImpressStoreFfi.xcframework.
      - name: ImpressStoreFfi.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impress-store-ffi

      - name: Test ImprintCore
        working-directory: apps/imprint/Packages/ImprintCore
        run: swift test
