name: imbib - Swift Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/imbib/**'
      - 'packages/**'
      - 'crates/**'
      - 'schema-refs.json'
      - 'scripts/check-schema-refs.sh'
      - '.github/workflows/imbib-tests.yml'
# pull_request trigger removed 2026-07-28: this lane runs on a self-hosted
# runner and the repo is public — fork PRs must never reach that machine.

concurrency:
  group: imbib-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-publicationmanagercore:
    name: Test PublicationManagerCore
    # PMC's Package.swift declares platforms: .macOS(.v26); executing its
    # tests needs a macOS 26 RUNTIME (FoundationModels etc.) — building on
    # an older image works, dlopen of the test bundle does not.
    runs-on: [self-hosted, impress-mac]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          # NOT ~/Library/Developer/Xcode/DerivedData: on the self-hosted
          # runner that is the DEVELOPER's DerivedData. Caching it let CI
          # restore over the copy the human is using, and CI's
          # CODE_SIGNING_ALLOWED=NO builds (no entitlements, ad-hoc signed)
          # then re-prompt TCC for app-group access every launch.
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: ImbibCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: imbib-core
          env-extra: MACOSX_DEPLOYMENT_TARGET=14.0

      # PublicationManagerCore / the imbib app also link these sibling Rust
      # cores; their xcframeworks are gitignored artifacts and must be
      # produced on the runner too.
      - name: ImpressStoreFfi.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impress-store-ffi

      - name: ScixClientCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: scix-client-ffi

      - name: ImpressHelix.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impress-helix

      # PMC took over the Typst compile/edit stack, so it now depends on the
      # ImprintCore package -> ImprintRustCore -> imprint_coreFFI, whose
      # xcframework the imprint build script drops in apps/imprint/Frameworks.
      # This lane only builds/tests for macOS, so skip the three iOS slices —
      # imprint-core links Typst and is the most expensive crate in the graph.
      # IMPRINT_SKIP_IOS is part of the cache key: the macOS-only artifact must
      # never be handed to the iOS job below.
      - name: ImprintCore.xcframework (macOS slices only)
        uses: ./.github/actions/xcframework
        with:
          crate: imprint-core
          env-extra: IMPRINT_SKIP_IOS=1

      - name: Build and Test PublicationManagerCore
        working-directory: apps/imbib/PublicationManagerCore
        run: |
          set -o pipefail
          swift build
          swift test 2>&1 | tee test-output.txt
          # Check for test failures
          if grep -q "Test Suite.*failed" test-output.txt; then
            echo "::error::Some tests failed"
            exit 1
          fi

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publicationmanagercore-test-output
          path: apps/imbib/PublicationManagerCore/test-output.txt

  test-imbib-app:
    name: Test imbib App
    # Same macOS 26 runtime requirement as the PMC job above.
    runs-on: [self-hosted, impress-mac]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: ImbibCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: imbib-core
          env-extra: MACOSX_DEPLOYMENT_TARGET=14.0

      # PublicationManagerCore / the imbib app also link these sibling Rust
      # cores; their xcframeworks are gitignored artifacts and must be
      # produced on the runner too.
      - name: ImpressStoreFfi.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impress-store-ffi

      - name: ScixClientCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: scix-client-ffi

      - name: ImpressHelix.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impress-helix

      # PMC -> ImprintCore -> imprint_coreFFI. Full slice set here: the
      # generated project carries an iOS target alongside the macOS one, so
      # resolution sees the whole graph even though only macOS is built.
      - name: ImprintCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: imprint-core

      - name: Generate Xcode project
        working-directory: apps/imbib/imbib
        run: xcodegen generate

      - name: Build and Test macOS (Unit Tests)
        working-directory: apps/imbib/imbib
        run: |
          # pipefail: without it the step exits with tee's status and a
          # resolution/build failure reports green (masked exactly this way
          # until 2026-07-27, when the missing ImprintCore artifact "passed").
          set -o pipefail
          xcodebuild -derivedDataPath "$PWD/.ci-derived" test \
            -scheme imbib \
            -only-testing:imbibTests \
            -destination 'platform=macOS' \
            -resultBundlePath ${{ runner.temp }}/TestResults-macOS.xcresult \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-output-macos.txt

      - name: Upload macOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos
          path: |
            ${{ runner.temp }}/TestResults-macOS.xcresult
            apps/imbib/imbib/test-output-macos.txt

  # Rule 1 of the iOS/macOS parity protocol (ADR-023):
  # every commit that touches PublicationManagerCore must also
  # compile the iOS target. Without this job, cross-platform
  # regressions in the shared package go unnoticed until someone
  # manually builds the iOS scheme.
  build-imbib-ios:
    name: Build imbib iOS
    runs-on: [self-hosted, impress-mac]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-ios-${{ hashFiles('**/Cargo.lock') }}

      # Same MACOSX_DEPLOYMENT_TARGET as the macOS jobs — it is the script's
      # own default, stated explicitly so all three jobs share one cache entry
      # instead of building the identical artifact twice.
      - name: ImbibCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: imbib-core
          env-extra: MACOSX_DEPLOYMENT_TARGET=14.0

      # PublicationManagerCore / the imbib app also link these sibling Rust
      # cores; their xcframeworks are gitignored artifacts and must be
      # produced on the runner too.
      - name: ImpressStoreFfi.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impress-store-ffi

      - name: ScixClientCore.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: scix-client-ffi

      - name: ImpressHelix.xcframework
        uses: ./.github/actions/xcframework
        with:
          crate: impress-helix

      # PMC -> ImprintCore -> imprint_coreFFI. iOS slices are required here,
      # so this one runs with the script's default (multi-platform) slice set.
      - name: ImprintCore.xcframework (multi-platform)
        uses: ./.github/actions/xcframework
        with:
          crate: imprint-core

      - name: Generate Xcode project
        working-directory: apps/imbib/imbib
        run: xcodegen generate

      - name: Build imbib iOS (Simulator)
        working-directory: apps/imbib/imbib
        run: |
          xcodebuild -derivedDataPath "$PWD/.ci-derived" build \
            -scheme imbib-iOS \
            -destination 'generic/platform=iOS Simulator' \
            -resultBundlePath ${{ runner.temp }}/BuildResults-iOS.xcresult \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build-output-ios.txt

      # Install-smoke: a `build` never installs, so it can't catch appex /
      # Info.plist install rejections. Boot a sim, install, launch.
      - name: imbib-iOS install smoke (Simulator)
        working-directory: apps/imbib/imbib
        run: |
          set -eo pipefail
          # Ask xcodebuild for a destination it actually accepts: simctl's
          # device list and xcodebuild's destination set can disagree on CI
          # runners (multiple runtimes/device sets), so a simctl-picked UDID
          # may be rejected with 'Unable to find a destination'.
          UDID=$(xcodebuild -derivedDataPath "$PWD/.ci-derived" -scheme imbib-iOS -showdestinations 2>/dev/null \
            | grep "platform:iOS Simulator" | grep -v placeholder \
            | grep -oE 'id:[0-9A-F-]{36}' | head -1 | cut -c4-)
          echo "sim: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild -derivedDataPath "$PWD/.ci-derived" -scheme imbib-iOS -configuration Debug \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO build | tail -30
          APP=$(find .ci-derived/Build/Products/Debug-iphonesimulator -maxdepth 1 -name 'imbib.app' | head -1)
          echo "installing $APP"
          xcrun simctl install "$UDID" "$APP"
          # Verify by PID liveness, not launchctl label grep: simctl launch
          # prints "bundle-id: PID", sim app processes are host processes,
          # and the launchctl listing has produced false "did not launch"
          # verdicts on runners even when launch returned a live PID.
          PID=$(xcrun simctl launch "$UDID" com.impress.imbib | awk -F': ' '{print $2}')
          echo "launched pid=$PID"
          sleep 8
          if ps -p "$PID" > /dev/null 2>&1; then
            echo "imbib-iOS launched OK (pid $PID alive after 8s)"
          else
            echo "imbib-iOS exited within 8s — dumping recent crash reports"
            for f in $(ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -3); do
              echo "===== $f"; tail -60 ~/Library/Logs/DiagnosticReports/"$f" 2>/dev/null
            done
            exit 1
          fi

      - name: Upload iOS build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-results-ios
          path: |
            ${{ runner.temp }}/BuildResults-iOS.xcresult
            apps/imbib/imbib/build-output-ios.txt

  lint:
    name: SwiftLint
    runs-on: [self-hosted, impress-mac]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        working-directory: apps/imbib
        run: |
          swiftlint lint --reporter github-actions-logging || true

      - name: Chassis dependency allowlist
        # Blast-radius gate (ADR-0021 / WP-X1): a new PublicationManagerCore
        # dependency ships to every impress app — adding one requires editing
        # scripts/check-chassis-deps.sh in the same PR.
        run: ./scripts/check-chassis-deps.sh

      - name: Schema-ref lint
        # The store matches `schema_ref` by exact equality, so a misspelled ref
        # returns zero rows silently — no error, no log, just an empty surface.
        # Repeated here rather than left to workspace-rust.yml because that lane
        # is gated on `crates/**`: a Swift-only change (which is how the iOS
        # citation picker asked for `bibliography-entry` instead of
        # `imbib/bibliography-entry`) never triggers it.
        run: ./scripts/check-schema-refs.sh
